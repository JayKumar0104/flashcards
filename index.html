<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Vocabulary practice</title>
<style>
:root{
--lang:#4f46e5;--lang2:#4338ca;--lang-soft:#eef0fe;--lang-line:#d7dafc;
--apush:#b45309;--apush2:#92400e;--apush-soft:#fdf3e6;--apush-line:#f1d6b3;
--accent:var(--lang);--accent2:var(--lang2);--soft:var(--lang-soft);--softline:var(--lang-line);--onaccent:#fff;
--bg:#f7f6f3;--bg2:#efede8;--paper:#fff;--ink:#181b24;--ink2:#383d4a;--muted:#676d7c;--line:#e8e5de;--line2:#d9d5cc;
--green:#137a45;--greenbg:#ebf8f1;--greenline:#bde5cd;--red:#b42318;--redbg:#fdf1ef;--redline:#f4c7c1;
--tintL:95%;--tintS:75%;--dotL:50%;--eyeL:36%;--mark:hsl(48 100% 68% / .6);
--shadow-sm:0 1px 2px rgba(24,27,36,.06);
--shadow:0 1px 2px rgba(24,27,36,.04),0 6px 20px -8px rgba(24,27,36,.14);
--shadow-lg:0 2px 6px rgba(24,27,36,.05),0 22px 50px -18px rgba(24,27,36,.28);
--r:20px;--hh:65px;--th:120px;
--serif:"Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,serif;
--sans:-apple-system,BlinkMacSystemFont,"Segoe UI Variable","Segoe UI",system-ui,Roboto,"Helvetica Neue",sans-serif}
body[data-course=apush]{--accent:var(--apush);--accent2:var(--apush2);--soft:var(--apush-soft);--softline:var(--apush-line)}
@media(prefers-color-scheme:dark){:root{--lang:#8f8aff;--lang2:#aaa6ff;--lang-soft:#23223f;--lang-line:#36346a;--apush:#f2a65a;--apush2:#f7bd80;--apush-soft:#2f2212;--apush-line:#57401f;--onaccent:#15141c;--bg:#111217;--bg2:#1c1d25;--paper:#1b1d25;--ink:#eceef4;--ink2:#c8cbd6;--muted:#989eac;--line:#2a2d38;--line2:#3a3e4b;--green:#5cd197;--greenbg:#13271d;--greenline:#24523a;--red:#ff8c82;--redbg:#2c1615;--redline:#5b2a25;--tintL:17%;--tintS:35%;--dotL:62%;--eyeL:72%;--mark:hsl(48 90% 50% / .35);--shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -10px rgba(0,0,0,.6);--shadow-lg:0 2px 6px rgba(0,0,0,.3),0 24px 50px -18px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--hh) + 16px)}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:16px/1.55 var(--sans);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
body:before{content:"";position:fixed;inset:0 0 auto 0;height:560px;background:radial-gradient(900px 420px at 85% -140px,var(--soft),transparent 70%),radial-gradient(700px 360px at -5% -180px,var(--soft),transparent 70%);pointer-events:none;z-index:-1}
button,input,select{font:inherit;color:inherit}
button,input,select,summary{touch-action:manipulation}
button{cursor:pointer;min-height:44px;border:1px solid var(--line2);border-radius:12px;background:var(--paper);color:var(--ink);padding:10px 16px;font-weight:600;line-height:1.3;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:var(--shadow-sm);transition:background .15s,border-color .15s,color .15s,transform .15s,box-shadow .2s}
button:hover{border-color:var(--accent);color:var(--accent)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:default;transform:none}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.primary:hover{background:var(--accent2);border-color:var(--accent2);color:var(--onaccent)}
.ghost,.textbtn{background:transparent;border-color:transparent;box-shadow:none;color:var(--accent)}
.ghost:hover,.textbtn:hover{background:var(--soft);border-color:transparent}
button.small{min-height:38px;padding:7px 13px;font-size:13.5px;border-radius:10px}
.iconbtn{width:44px;padding:0}
.linkbtn{min-height:0;padding:0;border:0;background:none;box-shadow:none;color:var(--accent);text-decoration:underline;text-underline-offset:3px;font-weight:650;display:inline}
.linkbtn:hover{background:none}
.ic{flex-shrink:0;transition:transform .2s}
[hidden]{display:none!important}
kbd{font:600 11px/1 var(--sans);padding:3px 6px;border:1px solid var(--line2);border-bottom-width:2px;border-radius:6px;background:var(--paper);color:var(--muted)}
.sr-only{position:absolute;clip:rect(0,0,0,0);width:1px;height:1px;overflow:hidden;white-space:nowrap}
/* Header */
header{position:sticky;top:0;z-index:20;background:var(--bg);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(1.4) blur(14px);backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.bar{max-width:1240px;margin:auto;padding:12px 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}
.brand{border:0;background:none;box-shadow:none;padding:0;gap:10px;font-size:16.5px;font-weight:720;letter-spacing:-.02em;color:var(--ink);white-space:nowrap}
.brand:hover{color:var(--ink);background:none}
.logo{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:var(--onaccent);background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 6px 14px -6px var(--accent)}
.nav{display:flex;gap:3px;padding:4px;background:var(--bg2);border:1px solid var(--line);border-radius:14px}
.nav button{min-height:36px;padding:6px 14px;font-size:14px;border:0;box-shadow:none;background:transparent;color:var(--muted);font-weight:600;border-radius:10px;white-space:nowrap}
.nav button:hover{color:var(--ink);background:transparent}
.nav button[aria-current=page]{background:var(--paper);color:var(--accent);box-shadow:var(--shadow-sm)}
/* Layout + type */
main{flex:1;width:100%;max-width:1192px;margin:0 auto;padding:40px 24px 80px}
h1{font-size:clamp(30px,4.6vw,44px);line-height:1.1;letter-spacing:-.03em;font-weight:760;margin:0 0 12px}
.h-sm{font-size:24px;letter-spacing:-.02em;margin:0;line-height:1.2}
h2{font-size:21px;line-height:1.3;margin:0 0 6px;letter-spacing:-.02em;font-weight:700}
h3{font-size:17px;line-height:1.35;margin:0;letter-spacing:-.01em;font-weight:680}
p{margin:8px 0 16px}
.muted{color:var(--muted)}.small{font-size:14px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin:0 0 8px;display:flex;align-items:center;gap:8px}
.intro{margin-bottom:28px}.intro p.muted{max-width:680px;font-size:17px;margin:0}
.pagehead{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;margin-bottom:28px;flex-wrap:wrap}.pagehead .intro{margin:0}
.headaside{display:flex;gap:8px;align-items:center}
.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{display:flex;justify-content:space-between;gap:16px;align-items:center;flex-wrap:wrap}
.back{margin-bottom:20px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:28px;box-shadow:var(--shadow)}
.count{font-size:12px;font-weight:650;color:var(--muted);background:var(--bg2);border-radius:99px;padding:2px 9px;font-variant-numeric:tabular-nums;white-space:nowrap}
.dot{width:10px;height:10px;border-radius:50%;background:hsl(var(--h,220) 65% var(--dotL));flex-shrink:0;display:inline-block}
/* Home */
.hero{padding:20px 0 8px;margin-bottom:30px}
.hero h1{font-size:clamp(34px,5.4vw,54px);max-width:760px}
.lead{font-size:18px;max-width:600px;margin:0}
.courses{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.course{--c:var(--lang);--cs:var(--lang-soft);flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:28px;border-radius:24px;min-height:290px;gap:10px;border-color:var(--line);box-shadow:var(--shadow);position:relative;overflow:hidden;font-weight:400}
.course.c-apush{--c:var(--apush);--cs:var(--apush-soft)}
.course:hover{border-color:var(--c);color:var(--ink);transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.course:after{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;background:var(--cs);z-index:0;transition:transform .5s}
.course:hover:after{transform:scale(1.18)}
.course>*{position:relative;z-index:1}
.cicon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;background:var(--c);color:var(--onaccent);margin-bottom:10px;box-shadow:0 10px 22px -10px var(--c)}
.ctitle{font-size:23px;font-weight:720;letter-spacing:-.02em;line-height:1.25}
.cdesc{color:var(--muted);font-size:15.5px;line-height:1.5;max-width:430px}
.cstats{display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.cstats span{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--bg2);border-radius:99px;padding:4px 10px}
.cgo{margin-top:auto;padding-top:14px;display:inline-flex;align-items:center;gap:6px;font-weight:650;color:var(--c,var(--accent));font-size:15px}
.course:hover .cgo .ic,.modecard:hover .cgo .ic{transform:translateX(4px)}
/* AP Lang sets */
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:14px}
.setcard{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:18px 20px 20px;border-radius:18px;border-color:var(--line);box-shadow:var(--shadow-sm);gap:2px;min-height:172px;font-weight:400}
.setcard:hover{transform:translateY(-2px);box-shadow:var(--shadow);color:var(--ink)}
.setcard.current{border-color:var(--softline);background:linear-gradient(180deg,var(--soft),var(--paper) 75%)}
.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;min-height:24px}
.setlabel{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.badge{font-size:11px;font-weight:700;color:var(--accent);background:var(--soft);border:1px solid var(--softline);border-radius:99px;padding:2px 8px}
.setnum{font-size:44px;font-weight:780;letter-spacing:-.04em;line-height:1.05;color:var(--accent);font-variant-numeric:tabular-nums}
.setmeta{font-size:13px;font-weight:600;color:var(--ink2);margin-top:2px}
.setwords{font-size:13px;color:var(--muted);margin-top:auto;padding-top:10px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.45}
/* Set home tiles */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
.tile{display:flex;flex-direction:column;align-items:flex-start;min-height:250px;gap:4px}
.ticon{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:var(--soft);color:var(--accent);margin-bottom:12px;border:1px solid var(--softline)}
.tile p{font-size:15px;color:var(--muted);margin:0 0 6px}
.tile .actions{margin-top:auto;padding-top:14px}
.switcher{display:flex;gap:8px;align-items:center}
.wordsec{margin-top:40px}
.secthead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.secthead h2{margin:0 0 4px}
.wordtable-wrap{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.wordtable{width:100%;border-collapse:collapse;text-align:left;font-size:15px}
.wordtable thead th{background:var(--bg2);color:var(--ink2);font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px;border-bottom:1px solid var(--line);white-space:nowrap}
.wordtable tbody td{padding:16px 18px;border-bottom:1px solid var(--line);vertical-align:middle;color:var(--ink)}
.wordtable tbody tr:last-child td{border-bottom:none}
.wordtable tbody tr{transition:background .15s ease}
.wordtable tbody tr:hover{background:color-mix(in srgb,var(--soft) 55%,transparent)}
.wt-col-num,.wt-num{width:44px;text-align:center;font-size:13px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.wt-col-word,.wt-word-cell{width:180px}
.wt-word-btn{border:0;background:transparent;box-shadow:none;padding:0;min-height:0;display:inline-flex;align-items:center;gap:6px;font-family:var(--serif);font-size:18.5px;font-weight:650;color:var(--accent);text-align:left;cursor:pointer;line-height:1.2;transition:color .15s}
.wt-word-btn:hover{color:var(--accent2);text-decoration:underline;text-underline-offset:3px}
.wt-word-btn:focus-visible{outline:2px solid var(--accent);border-radius:4px;outline-offset:2px}
.wt-col-part,.wt-part-cell{width:140px;white-space:nowrap}
.wt-pos{display:inline-block;font-size:12px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--bg2);color:var(--ink2);border:1px solid var(--line);font-style:italic}
.wt-col-def{min-width:260px}
.wt-def-cell{font-size:15px;line-height:1.55}
.wt-def{color:var(--ink);font-size:15px;line-height:1.55}
.wt-note{margin-top:6px;font-size:13px;line-height:1.45;color:var(--muted);display:flex;align-items:flex-start;gap:8px;padding:6px 10px;border-radius:8px;background:var(--bg2);border:1px solid var(--line)}
.wt-note-tag{font-weight:700;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent);background:var(--soft);padding:1px 6px;border-radius:4px;flex-shrink:0;margin-top:1px}
.wt-col-action,.wt-action-cell{width:84px;text-align:right;white-space:nowrap}
.wt-card-btn{min-height:34px;height:34px;padding:5px 12px;font-size:13px;font-weight:600;border-radius:8px;display:inline-flex;align-items:center;gap:5px;color:var(--ink2);border:1px solid var(--line2);background:var(--paper);box-shadow:var(--shadow-sm);transition:all .15s}
.wt-card-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--soft)}
@media(max-width:720px){
 .wordtable-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
 .wordtable{min-width:580px}
}
@media(max-width:540px){
 .wt-col-num,.wt-num{display:none}
 .wt-col-word,.wt-word-cell{width:130px}
 .wt-card-btn span{display:none}
 .wt-card-btn{padding:5px 8px}
}
.wordcloud{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:6px 14px;border-radius:99px;font-size:14px;font-weight:550;box-shadow:none;border-color:var(--line)}
.chip:hover{background:var(--soft)}
.modegrid{display:grid;grid-template-columns:1fr 1fr;gap:18px;max-width:840px;margin-bottom:22px}
.modecard{flex-direction:column;align-items:flex-start;justify-content:flex-start;text-align:left;padding:26px;border-radius:20px;min-height:230px;gap:6px;font-weight:400;border-color:var(--line);box-shadow:var(--shadow)}
.modecard:hover{color:var(--ink);transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.mtitle{font-size:20px;font-weight:700;letter-spacing:-.02em}
.mdesc{color:var(--muted);font-size:15px;line-height:1.5}
/* Study screens */
.study{max-width:760px;margin:0 auto}
.studytop{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:18px}
.studytop .eyebrow{margin-bottom:4px}
.studymeta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px;min-height:38px}
.counter{font-size:13.5px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.progress{height:6px;background:var(--bg2);border-radius:99px;overflow:hidden;margin-bottom:22px}
.progress i{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .35s cubic-bezier(.3,.7,.2,1)}
.qpanel{padding:32px}
.mode{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent);background:var(--soft);border-radius:99px;padding:5px 12px;margin:0}
.prompt{font-family:var(--serif);font-size:clamp(22px,3.4vw,29px);line-height:1.45;font-weight:500;letter-spacing:-.005em;overflow-wrap:anywhere;margin:16px 0 26px}
.reveal{font-size:17px;background:var(--soft);border:1px dashed var(--softline);border-radius:14px;padding:14px 18px;margin:-8px 0 22px}
.reveal strong{font-family:var(--serif);font-size:23px;color:var(--accent);font-weight:600}
.word{font-family:var(--serif);font-size:clamp(32px,5.4vw,50px);font-weight:600;line-height:1.15;letter-spacing:-.01em;overflow-wrap:anywhere}
.definition{font-size:20px;line-height:1.55;overflow-wrap:anywhere}
label{display:block;font-size:13.5px;font-weight:650;margin-bottom:8px;color:var(--ink2)}
.answer{width:100%;font-size:19px;border:1.5px solid var(--line2);border-radius:14px;padding:14px 16px;min-height:56px;background:var(--bg);color:var(--ink);transition:border-color .15s,box-shadow .15s,background .15s}
.answer:focus{outline:none;border-color:var(--accent);background:var(--paper);box-shadow:0 0 0 4px var(--soft)}
.answer.right{border-color:var(--green);background:var(--greenbg)}.answer.wrong{border-color:var(--red);background:var(--redbg)}
.hinttext{min-height:6px;font-size:14px;color:var(--muted);margin-top:8px}
.msg{font-size:14px;color:var(--red);margin:4px 0 14px;min-height:4px}
.choice{flex:1;min-width:120px;min-height:64px;font-size:17px;border-radius:16px}
.choice.isright{opacity:1;background:var(--greenbg);border-color:var(--green);color:var(--green)}
.choice.iswrong{opacity:1;background:var(--redbg);border-color:var(--red);color:var(--red)}
.notice{display:flex;gap:12px;align-items:flex-start;padding:15px 18px;border-radius:14px;margin:0 0 18px;background:var(--soft);color:var(--ink);border:1px solid var(--softline);font-size:15px}
#questionFeedback .notice{margin:22px 0 4px}
.notice .ic{margin-top:2px}.notice p{margin:4px 0 0;color:var(--ink2)}
.notice.good{background:var(--greenbg);border-color:var(--greenline)}.notice.good .nt,.notice.good>.ic{color:var(--green)}
.notice.bad{background:var(--redbg);border-color:var(--redline)}.notice.bad .nt,.notice.bad>.ic{color:var(--red)}
.footeractions{margin-top:20px}
.notes{margin-top:26px;border-top:1px solid var(--line);padding-top:16px}
.notes p{font-size:14px;color:var(--muted);margin:2px 0 8px}
.checkline{display:flex;align-items:center;gap:10px;min-height:40px;font-weight:600;margin:0;cursor:pointer;font-size:15px;color:var(--ink)}
.checkline input{width:18px;height:18px;accent-color:var(--accent);margin:0}
.seg{display:inline-flex;padding:4px;gap:3px;background:var(--bg2);border:1px solid var(--line);border-radius:14px;flex-wrap:wrap}
.seg button{min-height:36px;padding:6px 14px;font-size:14px;border:0;background:transparent;box-shadow:none;color:var(--muted);border-radius:10px;font-weight:600}
.seg button:hover{color:var(--ink);background:transparent}
.seg button.on{background:var(--paper);color:var(--accent);box-shadow:var(--shadow-sm)}
.formrow{display:flex;gap:22px;flex-wrap:wrap;margin:22px 0 26px}
.flabel{display:block;font-size:13px;font-weight:650;color:var(--ink2);margin-bottom:8px}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 0}
.stats span{font-size:13px;font-weight:600;color:var(--ink2);background:var(--bg2);border-radius:99px;padding:4px 11px}
.result{text-align:center;padding:40px 28px}
.ring{--p:0;width:148px;height:148px;border-radius:50%;margin:0 auto 20px;background:conic-gradient(var(--accent) calc(var(--p) * 1%),var(--bg2) 0);display:grid;place-items:center}
.ring span{width:118px;height:118px;border-radius:50%;background:var(--paper);display:grid;place-items:center;font-size:32px;font-weight:780;letter-spacing:-.03em}
.result .actions{justify-content:center}
.result p{max-width:460px;margin:6px auto 0}
/* Flashcards */
.flashwrap{perspective:1800px}
button.flash{display:grid;width:100%;padding:0;border:0;background:transparent;box-shadow:none;border-radius:26px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.3,.75,.25,1);font-weight:400;color:var(--ink);text-align:center}
button.flash:hover{background:transparent;color:var(--ink)}
button.flash:active{transform:none}
button.flash.flipped{transform:rotateY(180deg)}
button.flash:focus-visible{outline:none}
button.flash:focus-visible .face{outline:3px solid var(--accent);outline-offset:3px}
.face{grid-area:1/1;min-height:340px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:52px 40px;border-radius:26px;background:var(--paper);border:1px solid var(--line);box-shadow:var(--shadow-lg);-webkit-backface-visibility:hidden;backface-visibility:hidden;position:relative;transition:border-color .2s}

/* ===================================================
   APUSH Hub & Category Cards
   =================================================== */
.catgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px;margin-bottom:32px}
.catcard{
  display:flex;flex-direction:column;align-items:flex-start;justify-content:flex-start;
  text-align:left;padding:32px 28px;border-radius:24px;min-height:300px;gap:14px;
  background:var(--paper);border:1.5px solid var(--line);box-shadow:var(--shadow);
  position:relative;overflow:hidden;transition:border-color .2s,transform .2s,box-shadow .2s;
}
.catcard:hover{border-color:var(--c,var(--accent));transform:translateY(-3px);box-shadow:var(--shadow-lg)}
.catcard.c-eptl{--c:var(--apush);--cs:var(--apush-soft)}

.catcard .cicon{
  width:52px;height:52px;border-radius:16px;display:grid;place-items:center;
  background:var(--c,var(--accent));color:#fff;box-shadow:0 8px 20px -6px var(--c,var(--accent));
  margin-bottom:4px;flex-shrink:0;
}
.catcard .ctitle{font-size:22px;font-weight:750;letter-spacing:-.02em;line-height:1.25;margin:0;color:var(--ink)}
.catcard .cdesc{font-size:15px;line-height:1.55;color:var(--muted);margin:0;max-width:440px}
.catcard .cstats{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0 0}
.catcard .cstats span{font-size:12.5px;font-weight:600;color:var(--ink2);background:var(--bg2);border-radius:99px;padding:4px 10px}
.catcard .catactions{margin-top:auto;padding-top:16px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;width:100%}

/* ===================================================
   Flashcards (Shared)
   =================================================== */
.flashwrap{perspective:1800px;margin:0 auto;max-width:760px}
button.flash{
  display:grid;width:100%;padding:0;border:0;background:transparent;box-shadow:none;
  border-radius:24px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.3,.75,.25,1);
  font-weight:400;color:var(--ink);cursor:pointer;
}
.face{
  grid-area:1/1;min-height:380px;display:flex;flex-direction:column;
  padding:28px 32px 24px;border-radius:24px;background:var(--paper);
  border:1.5px solid var(--line);box-shadow:var(--shadow-lg);
  -webkit-backface-visibility:hidden;backface-visibility:hidden;
  position:relative;transition:border-color .2s;text-align:left;box-sizing:border-box;
}
.face.back{transform:rotateY(180deg);background:var(--paper)}
.flash:hover .face{border-color:var(--accent)}

@media(max-width:720px){
  .catgrid{grid-template-columns:1fr;gap:16px}
  .catcard{padding:22px}
  .face{padding:22px 18px 18px;min-height:340px}
}

/* ===================================================
   Packet Practice (Source-Faithful AP Lang Packet Mode)
   =================================================== */
.pkt-tile{position:relative;overflow:hidden;border-color:var(--softline)!important}
.pkt-tile .ticon{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;background:var(--accent);color:var(--onaccent);margin-bottom:12px;box-shadow:0 8px 18px -6px var(--accent)}
.pkt-toolbar{position:sticky;top:calc(var(--hh) + 8px);z-index:15;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px;margin-bottom:24px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pkt-toggle-wrap{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.pkt-switch{display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:650;font-size:14.5px;user-select:none}
.pkt-switch input{position:absolute;opacity:0;width:0;height:0}
.pkt-slider{position:relative;width:44px;height:24px;background:var(--line2);border-radius:99px;transition:.2s;flex-shrink:0}
.pkt-slider:before{content:"";position:absolute;height:18px;width:18px;left:3px;bottom:3px;background:var(--paper);border-radius:50%;box-shadow:var(--shadow-sm);transition:.2s}
.pkt-switch input:checked + .pkt-slider{background:var(--accent)}
.pkt-switch input:checked + .pkt-slider:before{transform:translateX(20px)}
.pkt-mode-info{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.pkt-mode-badge{font-size:11.5px;font-weight:750;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border-radius:99px;border:1px solid var(--softline);background:var(--soft);color:var(--accent)}
.pkt-mode-badge.blank{background:var(--bg2);color:var(--ink2);border-color:var(--line2)}
.pkt-mode-desc{font-size:13.5px;color:var(--muted)}
.pkt-nav-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pkt-select{min-height:38px;padding:6px 12px;border:1px solid var(--line2);border-radius:10px;background:var(--paper);font-size:13.5px;color:var(--ink);max-width:320px}
.pkt-select:focus{border-color:var(--accent);outline:none}

.pkt-section{margin-bottom:28px;padding:28px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pkt-pagemarker{margin-bottom:12px;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
.pkt-meta-header{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;font-size:12.5px;color:var(--muted);letter-spacing:.02em;padding:6px 12px;background:var(--bg2);border-radius:8px;margin-bottom:14px;display:inline-block}
.pkt-sec-head{margin-bottom:20px;border-bottom:1px solid var(--line);padding-bottom:14px}
.pkt-sec-head h2{font-size:22px;margin:0 0 4px;font-weight:750;letter-spacing:-.02em}
.pkt-inst{font-style:italic;color:var(--ink2);margin:8px 0 0;font-size:15px;line-height:1.5}
.pkt-footer-meta{font-size:12px;font-style:italic;color:var(--muted);margin-top:18px;padding-top:10px;border-top:1px dashed var(--line)}

/* Passage */
.pkt-passage-box{background:var(--bg2);border-radius:16px;padding:26px 28px;margin-bottom:24px;border:1px solid var(--line)}
.pkt-passage-box h3{font-family:var(--serif);font-size:24px;font-weight:700;margin:0 0 16px;text-align:center;letter-spacing:-.02em}
.pkt-passage-box p{font-family:var(--serif);font-size:17px;line-height:1.75;margin:14px 0;color:var(--ink)}
.pkt-ctx-num{font-weight:700;color:var(--accent);margin-right:2px;font-family:var(--sans);font-size:14.5px}

/* Questions */
.pkt-qlist{display:flex;flex-direction:column;gap:18px}
.pkt-qitem{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:18px 20px;transition:border-color .15s}
.pkt-qitem:focus-within{border-color:var(--accent)}
.pkt-qhead{display:flex;align-items:baseline;gap:10px;margin-bottom:10px}
.pkt-qnum{font-weight:750;font-size:15px;color:var(--accent);flex-shrink:0}
.pkt-qprompt{font-size:16px;line-height:1.55;margin:0;font-weight:500;color:var(--ink)}
.pkt-qprompt em,.pkt-qprompt i{font-style:italic}
.pkt-baseword{font-weight:600;color:var(--muted);margin-left:6px}

/* Choices */
.pkt-choices{display:grid;grid-template-columns:1fr;gap:8px;margin-top:10px}
.pkt-choice{text-align:left;justify-content:flex-start;padding:10px 14px;border-radius:10px;min-height:42px;border:1px solid var(--line2);background:var(--paper);color:var(--ink);font-weight:450;font-size:14.5px;display:flex;align-items:baseline;gap:8px;box-shadow:var(--shadow-sm);transition:all .15s}
.pkt-choice:hover{border-color:var(--accent);background:var(--soft);color:var(--accent)}
.pkt-choice.selected{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:600;box-shadow:0 0 0 1px var(--accent)}
.pkt-choice.isright{background:var(--greenbg)!important;border-color:var(--green)!important;color:var(--green)!important;font-weight:650}
.pkt-choice.iswrong{background:var(--redbg)!important;border-color:var(--red)!important;color:var(--red)!important}
.pkt-choice-letter{font-weight:750;color:var(--muted)}
.pkt-choice.selected .pkt-choice-letter{color:var(--accent)}

/* Inputs */
.pkt-input-wrap{margin-top:10px}
.pkt-input{width:100%;max-width:520px;min-height:42px;padding:8px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-size:15px;color:var(--ink)}
.pkt-input:focus{background:var(--paper);border-color:var(--accent);outline:none}
.pkt-input.right{border-color:var(--green);background:var(--greenbg)}
.pkt-input.wrong{border-color:var(--red);background:var(--redbg)}
.pkt-tf-actions{display:flex;gap:10px;margin-top:10px}
.pkt-tf{min-width:110px}
.pkt-tf.selected{border-color:var(--accent);background:var(--soft);color:var(--accent);font-weight:650}
.pkt-essay-area{width:100%;min-height:160px;padding:12px 14px;border:1px solid var(--line2);border-radius:10px;background:var(--bg);font-family:var(--sans);font-size:15px;line-height:1.6;color:var(--ink);resize:vertical}
.pkt-essay-area:focus{background:var(--paper);border-color:var(--accent);outline:none}
.pkt-essay-meta{margin-top:8px;font-size:13px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}

/* Vocab Section */
.pkt-roots-card{background:var(--soft);border:1px solid var(--softline);border-radius:16px;padding:22px 24px;margin-bottom:24px}
.pkt-roots-card h3{color:var(--accent);font-size:19px;margin:0 0 10px;font-weight:720}
.pkt-roots-card p{font-size:15.5px;line-height:1.6;margin:0;color:var(--ink)}
.pkt-word-grid{display:flex;flex-direction:column;gap:18px}
.pkt-word-card{border:1px solid var(--line);border-radius:16px;padding:22px 24px;background:var(--paper)}
.pkt-word-title-row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.pkt-w-num{font-size:22px;font-weight:750;color:var(--accent)}
.pkt-w-name{font-size:22px;font-weight:750;color:var(--ink);letter-spacing:-.02em}
.pkt-w-pron{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:15.5px}
.pkt-w-pos{font-size:12.5px;font-weight:650;color:var(--ink2);background:var(--bg2);padding:2px 8px;border-radius:6px}
.pkt-w-etym{font-size:14px;color:var(--muted);margin-left:auto}
.pkt-def-list{margin:8px 0 12px;display:flex;flex-direction:column;gap:10px}
.pkt-def-row{padding-left:6px}
.pkt-def-head{font-size:15.5px;font-weight:550;line-height:1.45;color:var(--ink)}
.pkt-def-lbl{font-weight:700;color:var(--accent);margin-right:4px}
.pkt-def-ex{font-style:italic;color:var(--ink2);font-size:14.5px;margin:3px 0 0 18px;display:block}
.pkt-deriv-wrap{margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.pkt-deriv-item{font-size:14.5px;line-height:1.5}
.pkt-note-callout{background:var(--bg2);border-left:3px solid var(--accent);padding:10px 14px;border-radius:0 10px 10px 0;margin-top:12px;font-size:14px;color:var(--ink2);line-height:1.5}
.pkt-illus-tag{font-size:12px;font-style:italic;color:var(--muted);margin-top:8px}

.pkt-sec-footer{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-top:24px;padding-top:16px;border-top:1px solid var(--line);flex-wrap:wrap}
.pkt-sec-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pkt-sec-score{font-size:13.5px;font-weight:700;padding:4px 12px;border-radius:99px;background:var(--soft);color:var(--accent);border:1px solid var(--softline)}

e requires the adjective histrionic."},{"word":"histrionic","statement":"The host's natural charm and cheerful warmth were described as histrionic because everyone felt at ease.","answer":false,"why":"Natural warmth and liveliness is vivacious; histrionic implies unnatural, affected, and theatrical drama."},{"word":"laconic","statement":"When asked for his opinion on the three-hour meeting, his laconic response was simply, 'Unnecessary.'","answer":true,"why":"Laconic means marked by the use of few words; terse or concise."},{"word":"laconic","statement":"Her answer was laconic because it contained twelve paragraphs explaining every minor detail.","answer":false,"why":"A response spanning twelve detailed paragraphs is wordy and garrulous, the direct opposite of laconic."},{"word":"laconic","statement":"Because the witness gave a laconic answer, the prosecutor accused him of being automatically rude and dictatorial.","answer":false,"why":"Laconic means concise and brief; it does not inherently mean rude or peremptory."},{"word":"peremptory","statement":"Her peremptory command made it clear that the decision was final and would not be discussed further.","answer":true,"why":"Peremptory means ending debate or action; not allowing contradiction or refusal."},{"word":"peremptory","statement":"The judge's peremptory ruling made it clear that no further argument would be heard.","answer":true,"why":"Peremptory describes an authoritative action that permits no debate or refusal."},{"word":"peremptory","statement":"A peremptory edict invites the public to engage in a prolonged and open-ended debate.","answer":false,"why":"Peremptory actions shut down debate and brook no refusal, rather than inviting open discussion."},{"word":"peremptory","statement":"His peremptory manner irritated the committee members because he treated disagreement as unacceptable.","answer":true,"why":"Peremptory also means offensively self-assured or dictatorial."},{"word":"polemic","statement":"His ess  read newspaper accounts of the ongoing trial.","answers":["explicitly"],"why":"Explicitly is the packet adverb modifying the verb warned."},{"word":"implicit","tier":"core","prompt":"[implicit] The editorial did not mention the senator by name, but the negative ___ was unmistakable.","answers":["implication"],"why":"Implication is the packet noun meaning an unstated suggestion or hint."},{"word":"supplicant","tier":"core","prompt":"[supplicant] The monarch was moved to tears by the desperate ___ of the impoverished farmers.","answers":["supplications"],"why":"Supplications is the packet plural noun meaning earnest pleas or humble requests."}]},"7":{"words":[{"word":"auspices","part":"noun","definition":"sponsorship, support, or protection","forms":[{"word":"auspices","part":"noun","level":"packet"},{"word":"auspice","part":"noun","level":"extended"}],"example":"The scientific expedition was conducted under the auspices of the university's research foundation, which provided grants and equipment.","cloze":"The international cultural summit was held under the ___ of the United Nations Educational, Scientific and Cultural Organization.","answer":["auspices"],"options":["auspices","auspicious","spectacle","circumspection"]},{"word":"auspicious","part":"adjective","definition":"favorable; promising success","forms":[{"word":"auspicious","part":"adjective","level":"packet"},{"word":"inauspicious","part":"adjective","level":"packet"},{"word":"auspiciously","part":"adverb","level":"extended"},{"word":"inauspiciously","part":"adverb","level":"extended"}],"example":"A clear blue sky and an enthusiastic turnout of supporters marked an auspicious beginning for the governor's reelection campaign.","cloze":"Signing their first major corporate client within days of opening was an ___ start for the fledgling tech startup.","answer":["auspicious"],"options":["auspicious","auspices","specious","perspicuous"]},{"word":"circumspect","part":"adjective","definition":"cautious and mindfu ion.","cloze":"By screaming vulgar insults at the flight attendant before takeoff, the irate traveler made a mortifying ___ of himself.","answer":["spectacle"],"options":["spectacle","specter","spectrum","auspices"]},{"word":"specter","part":"noun","definition":"a ghost; also a haunting or disturbing possibility","forms":[{"word":"specter","part":"noun","level":"packet"},{"word":"specters","part":"noun","level":"packet"},{"word":"spectral","part":"adjective","level":"packet"}],"example":"As trade disputes deepened and factory orders plummeted, the haunting specter of another economic depression troubled financial analysts.","cloze":"After the catastrophic failure of the municipal dam, the looming ___ of contaminated drinking water terrified local residents.","answer":["specter"],"options":["specter","spectacle","spectrum","auspices"]},{"word":"spectrum","part":"noun","definition":"a range of related qualities or an ordered band of wavelengths","forms":[{"word":"spectrum","part":"noun","level":"packet"},{"word":"spectra","part":"noun","level":"packet"},{"word":"spectrums","part":"noun","level":"packet"},{"word":"spectral","part":"adjective","level":"extended"}],"example":"The comprehensive survey engaged citizens across the entire political spectrum, from staunch libertarians to ardent social democrats.","cloze":"When white light passes through a triangular glass prism, it disperses into the visible ___ of radiant colors.","answer":["spectrum"],"options":["spectrum","specter","spectacle","auspices"]}],"usage":[{"word":"spectacle","statement":"The Fourth of July fireworks bursting over the bay formed a breathtaking spectacle that drew cheers from thousands of spectators.","answer":true,"why":"Spectacle correctly refers to an impressive public performance or display."},{"word":"auspicious","statement":"Mild breezes and clear skies offered an auspicious beginning for the sailors setting out on their cross-Atlantic voyage.","answer":true,"why":"Auspicious correctly describes conditions that are favorable and promise success."},{"word":"introspective","statement":"Sitting in the quiet library after hours, the introspective student contemplated her private motivations and long-term values.","answer":true,"why":"Introspective correctly describes someone who contemplates or examines their own inner thoughts and feelings."},{"word":"spectrum","statement":"Passing a narrow beam of sunlight through a glass prism separated the beam into a brilliant spectrum of colored wavelengths.","answer":true,"why":"Spectrum correctly identifies an ordered band of wavelengths and colors."},{"word":"specter","statement":"As winter approached and fuel reserves dwindled, the grim specter of widespread famine loomed over the besieged province.","answer":true,"why":"Specter correctly refers to a haunting or disturbing possibility or threat."},{"word":"despicable","statement":"Diverting charitable donations intended for earthquake survivors into personal bank accounts was a despicable crime.","answer":true,"why":"Despicable correctly describes an act deserving severe contempt, scorn, and moral condemnation."},{"word":"auspices","statement":"The pediatric medical study was conducted under the auspices of the county health department, which provided funding and clinical oversight.","answer":true,"why":"Auspices correctly refers to sponsorship, support, or protection (commonly in 'under the auspices of')."},{"word":"circumspect","statement":"Aware that a casual comment could derail the delicate peace talks, the circumspect diplomat weighed every syllable before answering reporters.","answer":true,"why":"Circumspect correctly describes someone who is cautious, prudent, and mindful of possible consequences."},{"word":"specious","statement":"The sales pitch relied on specious arguments that sounded convincing to buyers at first but were completely refuted by laboratory testing.","answer":true,"why":"Specious correctly describes reasoning that appears true or plausible on the surface but is actually false."},{"word":"perspicuous","statement":"The engineer's perspicuous presentation outlined the bridge repair plan so clearly that even city council members without technical training understood it.","answer":true,"why":"Perspicuous correctly describes expression that is clear, lucid, and easy to understand."},{"word":"specter","statement":"An archaeologist who suddenly came face-to-face with what appeared to be a glowing specter in the catacombs would likely scream in terror.","answer":true,"why":"A specter is a ghost or spirit; encountering one would provoke fear or a scream."},{"word":"spectrum","statement":"A natural rainbow arching across the sky after an afternoon thunderstorm is a textbook example of a visible spectrum.","answer":true,"why":"A rainbow is an ordered spectrum of color wavelengths formed by the refraction of sunlight through raindrops."},{"word":"auspices","statement":"A scientific researcher conducting cancer trials with grant funding from a university laboratory is working under the auspices of that institution.","answer":true,"why":"Working under an institution's sponsorship, authority, or financial backing is working under its auspices."},{"word":"spectacle","statement":"A customer who stands on a table in a quiet, formal dining room and sings loudly is making an embarrassing spectacle of himself.","answer":true,"why":"Spectacle can denote a conspicuous public display of bad, disorderly, or embarrassing behavior."},{"word":"introspective","statement":"Poets, novelists, and philosophical essayists frequently engage in introspection to examine their internal emotions and psychological insights.","answer":true,"why":"Introspection is self-examination, a natural activity for reflective writers and philosophers."},{"word":"circumspect","statement":"A circumspect bicyclist wears a helmet, uses reflective gear, and stays on marked bike paths rather than weaving recklessly through highway traffic.","answer":true,"why":"A circumspect person is cautious, prudent, and mindful of dangers and consequences."},{"word":"despicable","statement":"Cheating on an academic honors exam and deliberately framing an innocent classmate for the infraction is a despicable act.","answer":true,"why":"Cheating and framing another is contemptible, scornful, and universally condemned as despicable."},{"word":"perspicuous","statement":"Technical instructions for assembling emergency medical ventilators should be as perspicuous as possible so operators make no mistakes.","answer":true,"why":"Perspicuous means clearly expressed and easy to understand, which is vital for emergency instructions."},{"word":"auspicious","statement":"Opening a high-stakes business negotiation with a genuine compliment and an agreed-upon goal represents an auspicious start.","answer":true,"why":"An auspicious beginning is one that is favorable and promises a successful outcome."},{"word":"specious","statement":"Late-night television infomercials promising effortless wealth through secret real estate loopholes typically rely on specious claims.","answer":true,"why":"Infomercials that deceive customers with seemingly plausible but false claims are specious."},{"word":"spectrum","statement":"The classroom teacher observed the full spectrum of student reading habits, from avid bookworms to reluctant beginners.","answer":true,"why":"Spectrum can mean a broad range of related qualities, habits, or behaviors."},{"word":"auspicious","statement":"In ancient Rome, augurs interpreted the flight patterns of eagles to confirm that an upcoming undertaking would have an auspicious beginning.","answer":true,"why":"Augurs looked for signs that an event would be auspicious (favorable and marked by success)."},{"word":"despicable","statement":"Spitting on an elderly bus passenger who asked someone to lower their music is an abhorrent and despicable deed.","answer":true,"why":"Despicable applies to contemptible actions that deserve severe scorn tary monk spent thirty years in his mountain hermitage engaged in circumspect meditation, examining solely his spiritual identity.","answer":false,"why":"False swap: meditating on one's own spiritual thoughts and inner feelings is introspective, not circumspect."},{"word":"introspective","statement":"The defensive driver was extraordinarily introspective, continually scanning blind spots, monitoring side mirrors, and watching for icy patches.","answer":false,"why":"False swap: watching outward surroundings cautiously to prevent accidents is being circumspect, not introspective."},{"word":"spectacle","statement":"Throughout the Cold War, the horrifying spectacle of global nuclear devastation haunted military planners and civilian populations alike.","answer":false,"why":"False swap: specter should replace spectacle. A haunting or disturbing possibility or threat is a specter; a spectacle is an impressive public display or scene."},{"word":"specter","statement":"Crowds lined the boulevard to marvel at the Thanksgiving parade, applauding the colorful floats and giant balloons that created an unforgettable specter.","answer":false,"why":"False swap: spectacle should replace specter. A dazzling, colorful public parade display is a spectacle, not a specter (ghost/haunting threat)."},{"word":"specter","statement":"The Olympic opening ceremony was a magnificent specter featuring thousands of coordinated dancers, acrobats, and laser effects.","answer":false,"why":"False swap: spectacle should replace specter. An elaborate public performance is a spectacle."},{"word":"spectacle","statement":"Following consecutive years of catastrophic drought, the haunting spectacle of mass starvation hung over the sub-Saharan villages.","answer":false,"why":"False swap: specter should replace spectacle. A looming, haunting threat or fear is a specter."},{"word":"spectrum","statement":"The superstitious villagers bolted their heavy wooden shutters at sundown, terrified that a spectral spectrum would rise from the old cemetery.","answer":false,"why":"False swap: specter should replace spectrum. A ghostly apparition is a specter; a spectrum is an ordered band of colors or range."},{"word":"specter","statement":"Sunlight reflected through the morning dew on the spiderweb, scattering into a vivid specter of red, orange, green, and violet.","answer":false,"why":"False swap: spectrum should replace specter. The band of colors produced by light refraction is a spectrum."},{"word":"spectrum","statement":"During the pandemic, the dark spectrum of widespread unemployment and bankruptcies caused deep anxiety among small business owners.","answer":false,"why":"False swap: specter should replace spectrum. A looming fear or haunting threat is a specter, not a spectrum."},{"word":"specter","statement":"The political candidate appealed to voters across the ideological specter, securing votes from centrists as well as progressives.","answer":false,"why":"False swap: spectrum should replace specter. A broad range of political or social viewpoints is an ideological spectrum."},{"word":"spectrum","statement":"By drunkenly knocking over the banquet centerpiece and berating the wedding party, the guest made a ridiculous spectrum of himself.","answer":false,"why":"False swap: spectacle should replace spectrum. Making a foolish public display of bad behavior is making a spectacle of oneself."},{"word":"spectacle","statement":"The psychologist classified human emotions along a broad spectacle ranging from extreme joy to profound sorrow.","answer":false,"why":"False swap: spectrum should replace spectacle. A continuous range of related qualities or emotions is a spectrum."},{"word":"specious","statement":"Kicking an injured stray dog on the street is universally decried as a specious act of cruelty.","answer":false,"why":"False swap: despicable should replace specious. An action deserving moral contempt and scorn is despicable; specious refers to deceptively plausible reasoning. d sorrow."},{"word":"ambivalence","statement":"Facing two contradictory career opportunities, the undecided graduate confessed, 'I can't decide which path to follow,' admitting her lingering ambivalence.","answer":true,"why":"Ambivalence encompasses indecisiveness and uncertainty between opposing courses of action."},{"word":"avail","statement":"The determined student availed herself of every academic opportunity, attending office hours, study groups, and writing center workshops.","answer":true,"why":"Avail oneself of is a critical idiom meaning to make use of or take advantage of an opportunity or resource."},{"word":"avail","statement":"The hikers tried repeatedly to start a campfire with damp kindling, but their shivering efforts were to no avail.","answer":true,"why":"To no avail correctly means without success, uselessly, or in vain."},{"word":"avail","statement":"During the long winter blockade, the isolated villagers had to avail themselves of all available root crops stored in cellars.","answer":true,"why":"Avail oneself of correctly denotes taking advantage of or utilizing existing resources."},{"word":"avail","statement":"The physician warned that expensive medication would be of little avail unless the patient also adopted necessary lifestyle changes.","answer":true,"why":"As a noun, avail correctly signifies benefit, use, or help."},{"word":"countervailing","statement":"Reinforced retaining walls on either side of the excavation provided a countervailing force that offset the pressure of shifting mud.","answer":true,"why":"Countervailing correctly describes an opposing force acting against another so as to cancel or offset its effect."},{"word":"countervailing","statement":"During regional planning debates, pressing economic needs often countervail long-term environmental protection priorities.","answer":true,"why":"The verb countervail correctly means to act against something to offset or counteract its influence."},{"word":"countervailing","statement"  toward strangers.","answer":true,"why":"Evinces correctly describes exhibiting or clearly demonstrating a virtuous disposition."},{"word":"evince","statement":"Consumer advocacy groups lamented that pharmaceutical companies evinced little interest in developing treatments for rare disorders.","answer":true,"why":"Evinced correctly signifies showing or manifesting little concern or engagement."},{"word":"invaluable","statement":"A lone surviving photograph of a beloved deceased grandparent is an invaluable family treasure that insurance money could never replace.","answer":true,"why":"Invaluable correctly means priceless, possessing worth far too great to be calculated in money."},{"word":"invaluable","statement":"Discovering an effective, universally accessible cure for malaria would be an invaluable breakthrough for global public health.","answer":true,"why":"Invaluable correctly describes an achievement of immeasurable, priceless benefit."},{"word":"invaluable","statement":"Satellite communications technology proved invaluable for coordinating first responders during the massive hurricane recovery.","answer":true,"why":"Invaluable correctly denotes assistance or technology whose high utility and worth cannot be overstated."},{"word":"prevail","statement":"Philosophers throughout history have argued that ethical truth and human dignity will ultimately prevail over injustice and tyranny.","answer":true,"why":"Prevail correctly means to triumph, win out, or be greater in strength and moral influence."},{"word":"prevail","statement":"Despite rapid globalization, the ancient custom of taking an afternoon siesta still prevails in small Mediterranean towns.","answer":true,"why":"Prevail correctly means to be current, in active use, or widespread in a society."},{"word":"prevail","statement":"After hours of patient persuasion, the weary travelers prevailed upon the innkeeper to let them shelter in the barn for the night.","answer":true,"why":"Prevail upon someone is a crucial idiom meaning to persuade or convince someone successfully."},{"word":"prevail","statement":"During the heated city council debate, the prevailing opinion among residents strongly favored constructing a new public library.","answer":true,"why":"Prevailing correctly functions as an adjective meaning dominant, current, or widely accepted."},{"word":"prevail","statement":"When fatigue tempted Zach to abandon the grueling mountain trek, his trail companions prevailed upon him to finish the final mile.","answer":true,"why":"Prevailed upon correctly describes successfully urging or persuading someone to take action."},{"word":"valedictorian","statement":"Having earned the highest cumulative grade point average over four rigorous years, Julian was chosen as the senior class valedictorian.","answer":true,"why":"Valedictorian correctly names the graduating student with the highest academic rank in a class."},{"word":"valedictorian","statement":"Before handing over executive authority, the outgoing university president delivered an eloquent valedictory address to the assembled faculty.","answer":true,"why":"Valedictory correctly functions as an adjective meaning relating to a farewell or closing speech."},{"word":"valedictorian","statement":"A high school valedictorian would normally possess exemplary study habits, stellar grades, and strong intellectual discipline.","answer":true,"why":"Valedictorian correctly designates the top-ranked student in a graduating cohort."},{"word":"valiant","statement":"A courageous paramedic who plunges into an icy river to extricate a trapped passenger acts valiantly in the face of imminent danger.","answer":true,"why":"Valiantly correctly describes acting bravely and courageously under peril."},{"word":"valiant","statement":"Despite suffering multiple equipment failures, the search-and-rescue squad made a valiant effort to reach the stranded climbers.","answer":true,"why":"Valiant correctly describes an endeavor showing courage, determination, and boldness."},{"word":"valiant","statement":"City leaders awarded commemorative medals to the firefighters who demonstrated extraordinary valiance during the chemical plant blaze.","answer":true,"why":"Valiance is the noun form naming courage, bravery, and boldness."},{"word":"valiant","statement":"In historic battle records, the infantry unit was commended for performing valiantly while holding the defensive perimeter against superior numbers.","answer":true,"why":"Valiantly is the adverb form meaning bravely and boldly."},{"word":"vanquish","statement":"Relying on superior leverage and relentless physical stamina, Seth vanquished his heavyweight opponent in the championship wrestling final.","answer":true,"why":"Vanquished correctly means defeated, conquered, or subdued an opponent."},{"word":"vanquish","statement":"During antiquity, the legions of the Roman Empire were trained to vanquish hostile invaders and establish imperial order.","answer":true,"why":"Vanquish correctly means to conquer, subdue, or defeat completely in military conflict."},{"word":"vanquish","statement":"Through steady encouragement from her vocal coach, the young soprano finally managed to vanquish the stage fright that had once silenced her.","answer":true,"why":"Vanquish can be used figuratively to mean overcoming, subduing, or conquering fear, doubt, or difficulty."},{"word":"evaluate","statement":"The senior inspector carefully evinced the damaged airplane turbine to judge whether the metal had suffered structural fatigue.","answer":false,"why":"False swap: evaluate should replace evince. Evaluate means to judge or assess the condition or quality of something; evince means to show or demonstrate clearly."},{"word":"evince","statement":"When the verdict was announced, the defendant's sudden pallor and trembling hands evaluated profound panic.","answer":false,"why":"False swap: evinced should replace evaluated. Evince means to display or demonstrate clearly; evaluate means to judge, assess, or grade."},{"word":"evaluate","statement":"The human resources director conducted formal interviews to evince each candidate's suitability and technical qualifications for the position.","answer":false,"why":"False swap: evaluate should replace evince. Evaluating is appraising or determining value and competence, whereas evincing is merely revealing or showing."},{"word":"evince","statement":"A medical examiner evaluates sadness when observing tears roll down a family member's cheeks.","answer":false,"why":"False swap: evinces should replace evaluates. Tears show or evince sadness; they do not perform an appraisal or evaluation of sadness."},{"word":"prevail","statement":"After hours of patient explanation, the counselor vanquished upon the troubled teenager to return to his family.","answer":false,"why":"False swap: prevailed should replace vanquished. The fixed idiom is 'prevail upon' meaning to persuade successfully; vanquish means to defeat or conquer."},{"word":"prevail","statement":"Zach's close friends vanquished upon him to complete the arduous final leg of the Appalachian trail hike.","answer":false,"why":"False swap: prevailed should replace vanquished. Prevailed upon means successfully persuaded; vanquished means subdued or conquered."},{"word":"vanquish","statement":"The ancient custom of lighting hilltop bonfires at the winter solstice still vanquishes across several isolated Scandinavian islands.","answer":false,"why":"False swap: prevails should replace vanquishes. Prevail means to be current, widespread, or in practice; vanquish means to conquer or subdue."},{"word":"avail","statement":"The stranded motorists tried pushing their sedan out of the snowbank for nearly two hours, but their freezing efforts were to no prevail.","answer":false,"why":"False swap: avail should replace prevail. The fixed packet phrase is 'to no avail' meaning without success; prevail means to triumph or be widespread."},{"word":"avail","statement":"During orient onjure","tier":"core","prompt":"Some people say magician David Copperfield is one of the greatest ___ of all time.","answers":["conjurers"],"why":"The plural noun conjurers designates magicians or illusionists."},{"word":"fealty","tier":"core","prompt":"Fulfilling an oath of ___, the Japanese samurai fought loyally for his lord.","answers":["fealty"],"why":"The noun fealty denotes faithfulness and allegiance to a feudal lord."},{"word":"fealty","tier":"core","prompt":"Nicholas Chauvin was a legendary French soldier famous for his ___ to Napoleon.","answers":["fealty"],"why":"The noun fealty names loyalty and allegiance to a leader."},{"word":"fiancé","tier":"core","prompt":"My ___ proposed to me at a romantic restaurant overlooking the ocean.","answers":["fiancé","fiance"],"why":"The masculine noun fiancé designates an engaged man who proposes marriage to his intended bride."},{"word":"fiancé","tier":"core","prompt":"His ___ just picked out a gorgeous dress to wear on the day of their wedding.","answers":["fiancée","fiancee"],"why":"The feminine noun fiancée designates an engaged woman who wears a wedding dress."},{"word":"fidelity","tier":"core","prompt":"Showing great ___, the dog refused to abandon the side of its injured master.","answers":["fidelity"],"why":"The noun fidelity names faithfulness and steadfast loyalty."},{"word":"fidelity","tier":"core","prompt":"The sound quality and ___ of this compact disc makes me feel as if I were actually at the live concert.","answers":["fidelity"],"why":"The noun fidelity denotes the degree of accuracy with which sound or images are reproduced."},{"word":"infidel","tier":"core","prompt":"Because his speech was critical of their religious practices, the congregation denounced him as an ___.","answers":["infidel"],"why":"The noun infidel refers to a person who does not accept a particular religion."},{"word":"infidel","tier":"core","prompt":"That family may not agree with every part of the church's doctrine, but that hardly makes them ___.","answers":["infidels"],"why":"The plural noun infidels designates people rejecting orthodox religious doctrine."},{"word":"jurisprudence","tier":"core","prompt":"My knowledge of ___ is limited to cases involving civil rights.","answers":["jurisprudence"],"why":"The noun jurisprudence denotes the philosophy or a specific division of law."},{"word":"perjure","tier":"core","prompt":"Because the witness ___ himself, he now faces severe criminal charges.","answers":["perjured"],"why":"The past-tense reflexive verb perjured means deliberately lied under oath."},{"word":"perjure","tier":"core","prompt":"He had a running feud with the archbishop and accused him of an act equivalent to ___.","answers":["perjury"],"why":"The noun perjury designates the criminal offense of deliberately lying under oath."}]},"10":{"words":[{"word":"perquisite","part":"noun","definition":"A fringe benefit; an exclusive right; a tip or gratuity.","forms":[{"word":"perquisite","part":"","level":"packet"},{"word":"perquisites","part":"","level":"packet"}],"note":"Perquisite = benefit, claimed exclusive right, or gratuity. Requisite = requirement. Political power can be described as a perquisite claimed by a group."},{"word":"requisite","part":"adjective; noun","definition":"Required or essential; a requirement.","forms":[{"word":"requisite","part":"","level":"packet"},{"word":"requisites","part":"","level":"packet"}],"note":"As an adjective, requisite means required. As a noun, a requisite is a requirement. It does not mean a fringe benefit."},{"word":"presage","part":"noun; verb","definition":"An omen or warning; an intuition of what will happen; to predict or indicate beforehand.","forms":[{"word":"presage","part":"","level":"packet"},{"word":"presages","part":"","level":"packet"},{"word":"presaged","part":"","level":"packet"}],"note":"A presage can be an omen or intuition. As a verb, presage means predict or indicate beforehand. Abrogate means repeal, not predict."},{"word":"sagacity","part":"noun","definition":"Wisdom; sound judgment.","forms":[{"word":"sagacity","part":"","level":"packet"},{"word":"sagacious","part":"","level":"packet"}],"note":"Sagacity is the noun; sagacious is the adjective. A sagacious decision shows wisdom, not a legal requirement."},{"word":"surrogate","part":"noun; adjective","definition":"A substitute; taking another’s place.","forms":[{"word":"surrogate","part":"","level":"packet"},{"word":"surrogates","part":"","level":"packet"}],"note":"Surrogate can name a substitute or describe something taking another’s place: a surrogate parent. It does not mean a conqueror."},{"word":"inquisitive","part":"adjective","definition":"Eager for knowledge or investigation; excessively curious or nosy.","forms":[{"word":"inquisitive","part":"","level":"packet"},{"word":"inquisitiveness","part":"","level":"packet"}],"note":"Both senses count: positively curious OR annoyingly nosy. Inquisitiveness is the noun. Interrogate is the act of formal questioning."},{"word":"interrogate","part":"verb","definition":"To question formally or officially.","forms":[{"word":"interrogate","part":"","level":"packet"},{"word":"interrogated","part":"","level":"packet"},{"word":"interrogation","part":"","level":"packet"},{"word":"interrogations","part":"","level":"packet"}],"note":"Interrogate is the verb; interrogation and interrogations are nouns. It is more specific than simply being inquisitive."},{"word":"abrogate","part":"verb","definition":"To abolish, repeal, or cancel, especially by authority.","forms":[{"word":"abrogate","part":"","level":"packet"},{"word":"abrogated","part":"","level":"packet"},{"word":"abrogation","part":"","level":"packet"}],"note":"Abrogate is the verb; abrogation is the noun. Repealing a treaty is abrogation; predicting an event is presaging it."},{"word":"quest","part":"noun; verb","definition":"A search or pursuit; to seek or pursue.","forms":[{"word":"quest","part":"","level":"packet"},{"word":"quested","part":"","level":"packet"}],"note":"Quest can be a noun (a quest for truth) or a verb (a knight quested for treasure)."},{"word":"conquistador","part":"noun","definition":"A conqueror, especially a Spanish conqueror of Indigenous American civilizations in the 1500s.","forms":[{"word":"conquistador","part":"","level":"packet"},{"word":"conquistadors","part":"","level":"packet"}],"note":"Conquistador names a conqueror; conquistadors is plural. A surrogate is a substitute, not a conqueror."}],"usage":[{"word":"perquisite","statement":"Use of the company jet could be considered a perquisite of an executive position.","answer":true,"why":"Use of the jet is an additional benefit of the position: a perquisite."},{"word":"requisite","statement":"Reduced-rate travel offered to airline employees is a requisite of the job because it is an additional benefit.","answer":false,"why":"Perquisite is the correct word for an additional benefit. Requisite means required or essential, or a requirement."},{"word":"interrogate","statement":"An investigator who formally questions a suspected smuggler is interrogating the suspect.","answer":true,"why":"Interrogate means to question formally or officially."},{"word":"inquisitive","statement":"A detective who is inquisitive must necessarily be annoyingly nosy rather than genuinely interested in finding information.","answer":false,"why":"Inquisitive can mean eager for knowledge OR excessively curious. It is not necessarily negative."},{"word":"abrogate","statement":"A government that officially repeals an old treaty has abrogated it.","answer":true,"why":"Abrogated means abolished, repealed, or canceled by authority."},{"word":"presage","statement":"A sudden drop in barometric pressure may presage an approaching storm.","answer":true,"why":"As a verb, presage means to predict or indicate beforehand."},{"word":"sagacity","statement":"The phrase “the sagacity of her decision” refers to the legal requirement behind the decision.","answer":false,"why":"Sagacity means wisdom or sound judgment. A requirement is a requisite."},{"word":"surrogate","statement":"A teacher temporarily taking the place of a parent can be described as a surrogate parent.","answer":true,"why":"Surrogate is an adjective here: taking another’s place."},{"word":"conquistador","statement":"A conquistador is specifically associated in this lesson with the Spanish conquerors of Indigenous civilizations in the Americas.","answer":true,"why":"That is the lesson’s specific use of conquistador."},{"word":"requisite","statement":"Equipment described as requisite for rock climbing is merely optional but convenient.","answer":false,"why":"Requisite means required or essential, not optional."},{"word":"presage","statement":"The Romans' belief that birds' flight patterns foretold battle outcomes treats those patterns as presages.","answer":true,"why":"Presages is a plural noun meaning omens or warnings of what will happen."},{"word":"quest","statement":"If a knight quested for a hidden treasure, he abandoned the search before beginning it.","answer":false,"why":"Quested means sought or pursued; it does not mean abandoned the search."},{"word":"sagacity","statement":"Someone displaying sagacity is demonstrating sound judgment.","answer":true,"why":"Sagacity means wisdom or sound judgment."},{"word":"perquisite","statement":"A gratuity left for a waiter can be called a perquisite under one of the packet's meanings.","answer":true,"why":"Perquisite can mean a tip or gratuity, not only an employment benefit."},{"word":"perquisite","statement":"If political power is described as the perquisite of the wealthy, the sentence means political power is an essential requirement for wealthy people.","answer":false,"why":"Here perquisite means something claimed as an exclusive right. It does not mean a requirement."}],"derivatives":[{"word":"surrogate","prompt":"The regent served as a __________ parent to the underage monarch, especially when making political decisions.","answers":["surrogate"],"why":"Surrogate describes someone taking the place of another; here it is an adjective modifying parent."},{"word":"abrogate","prompt":"The government's sudden __________ of the agreement angered citizens who believed their rights had been violated.","answers":["abrogation"],"why":"A noun is required after sudden: abrogation, the act of abolishing or canceling."},{"word":"quest","prompt":"What began as a quick trip to the store became an exhausting all-day __________ for the perfect pair of shoes.","answers":["quest"],"why":"Quest is a noun here: an extended search or pursuit."},{"word":"inquisitive","prompt":"The child's constant questions demonstrated an intense __________ about everything around her.","answers":["inquisitiveness"],"why":"The noun inquisitiveness names the curiosity; inquisitive is an adjective."},{"word":"perquisite","prompt":"One of the major __________ of working for the airline was discounted travel.","answers":["perquisites"],"why":"One of the major requires a plural noun. Discounted travel is a benefit: perquisites."},{"word":"sagacity","prompt":"The committee preferred an experienced and __________ leader whose judgment had proved reliable.","answers":["sagacious"],"why":"Sagacious is the adjective describing a wise leader. Sagacity is the noun."},{"word":"conquistador","prompt":"Spanish __________ came from a variety of social backgrounds before traveling to the Americas.","answers":["conquistadors"],"why":"The plural subject requires conquistadors."},{"word":"requisite","prompt":"Applicants had to complete all the __________ forms before the insurance company would process the claim.","answers":["requisite"],"why":"Requisite is an adjective modifying forms: required or essential."},{"word":"presage","prompt":"Yesterday's sudden fall in atmospheric pressure __________ the severe storm that arrived that evening.","answers":["presaged"],"why":"The past-tense verb presaged means indicated beforehand."},{"word":"interrogate","prompt":"Suspects in serious criminal investigations are often subjected to formal __________.","answers":["interrogations"],"why":"Interrogations is the plural noun for formal questionings."},{"word":"interrogate","prompt":"Before the detective could determine what happened, she had to __________ several witnesses officially.","answers":["interrogate"],"why":"Had to takes the base verb interrogate: question formally."},{"word":"abrogate","prompt":"The government eventually __________ the outdated law after years of public criticism.","answers":["abrogated"],"why":"The past-tense verb abrogated means repealed or abolished."},{"word":"quest","prompt":"The philosopher spent his life on a __________ for truth and wisdom.","answers":["quest"],"why":"A quest is a search or pursuit; here it is a noun."},{"word":"surrogate","prompt":"The substitute instructor served as a capable __________ for the professor while she was away.","answers":["surrogate"],"why":"Surrogate is a noun here: a substitute taking the professor’s place."},{"word":"presage","prompt":"The strange dark clouds were regarded as a __________ of the violent weather that followed.","answers":["presage"],"why":"Presage is a noun here: an omen or warning."}]},"11":{"words":[{"word":"adhere","part":"verb","definition":"To stick tightly to a surface; to be loyal or devoted to something; to carry out a plan or program without straying from it.","forms":[{"word":"adhere","part":"verb","level":"packet"},{"word":"adheres","part":"verb","level":"packet"},{"word":"adhered","part":"verb","level":"packet"},{"word":"adhering","part":"verb","level":"packet"},{"word":"adherence","part":"noun","level":"packet"},{"word":"adherent","part":"noun","level":"packet"},{"word":"adherents","part":"noun","level":"packet"}],"note":"From Latin ad- (“to”) + here (“stick”). Derivatives: adherence (noun), adherent (noun).","example":"The bandage adhered to my skin and was difficult to remove."},{"word":"aggregate","part":"adjective, noun, verb","definition":"Total; amounting to a whole (adj.); a total composed of different parts (noun); to add up, gather into a mass or sum (verb).","forms":[{"word":"aggregate","part":"adj/noun/verb","level":"packet"},{"word":"aggregates","part":"verb/noun","level":"packet"},{"word":"aggregated","part":"verb","level":"packet"},{"word":"aggregation","part":"noun","level":"packet"}],"note":"From Latin ad- (“to”) + greg (“flock”). Can also mean materials (sand, stone) used to make concrete.","example":"Aggregate sales were up for the holiday season."},{"word":"cohere","part":"verb","definition":"To stick together in a mass that resists separation; to be internally consistent and have logically linked parts.","forms":[{"word":"cohere","part":"verb","level":"packet"},{"word":"coheres","part":"verb","level":"packet"},{"word":"cohered","part":"verb","level":"packet"},{"word":"cohesion","part":"noun","level":"packet"},{"word":"cohesive","part":"adjective","level":"packet"},{"word":"coherent","part":"adjective","level":"packet"},{"word":"cohesiveness","part":"noun","level":"packet"},{"word":"coherence","part":"noun","level":"packet"}],"note":"From Latin co- (“together”) + here (“stick”). Coherent = internal consistency; cohesive = sticking together.","example":"The crumbly dough will cohere if you press it into a ball."},{"word":"dissimulate","part":"verb","definition":"To disguise under a fake appearance; to conceal feelings or intentions.","forms":[{"word":"dissimulate","part":"verb","level":"packet"},{"word":"dissimulates","part":"verb","level":"packet"},{"word":"dissimulated","part":"verb","level":"packet"},{"word":"dissimulation","part":"noun","level":"packet"}],"note":"From Latin dis- (“apart”) + sim (“similar”). Disguise under a fake appearance or conceal feelings.","example":"He dissimulated his disappointment over not being elected class president."},{"word":"egregious","part":"adjective","definition":"Conspicuously bad or offensive.","forms":[{"word":"egregious","part":"adjective","level":"packet"},{"word":"egregiously","part":"adverb","level":"packet"}],"note":"From Latin e- (“out”) + greg (“flock”) — noticeably standing out in a negative way.","example":"The student’s paper was filled with egregious misspellings and punctuation errors."},{"word":"ensemble","part":"noun","definition":"A whole unit or group composed of complementary or coordinated parts.","forms":[{"word":"ensemble","part":"noun","level":"packet"},{"word":"ensembles","part":"noun","level":"packet"}],"note":"From Latin in- (“in”) + sim (“similar”). Can be an outfit, set of furniture, or group of performers.","example":"An orchestra is an ensemble made up of many musicians and a variety of instruments."},{"word":"facsimile","part":"noun","definition":"An exact copy or reproduction.","forms":[{"word":"facsimile","part":"noun","level":"packet"},{"word":"facsimiles","part":"noun","level":"packet"}],"note":"From Latin facere (“to make”) + sim (“similar”). A fax is an abbreviation of facsimile.","example":"The facsimile of the Declaration of Independence appeared on the inside cover of the history book."},{"word":"gregarious","part":"adjective","definition":"Sociable; seeking and enjoying the company of others.","forms":[{"word":"gregarious","part":"adjective","level":"packet"},{"word":"gregariousness","part":"noun","level":"packet"}],"note":"From Latin greg (“flock”). Sociable; seeking and enjoying the company of others.","example":"Gregarious people often enjoy attending parties."},{"word":"inherent","part":"adjective","definition":"Inborn; naturally a part of something; intrinsic.","forms":[{"word":"inherent","part":"adjective","level":"packet"},{"word":"inherently","part":"adverb","level":"packet"}],"note":"From Latin in- (“in”) + here (“stick”). Inborn, intrinsic, naturally part of something.","example":"The photographer has an inherent ability to capture her subject’s emotion."},{"word":"semblance","part":"noun","definition":"An outward or a token appearance; a very small amount; the barest trace.","forms":[{"word":"semblance","part":"noun","level":"packet"},{"word":"semblances","part":"noun","level":"packet"}],"note":"From Latin sim (“similar”). An outward appearance, or the barest trace.","example":"Despite feeling hurt, Mary tried to keep a semblance of dignity."}],"usage":[{"word":"adhere","statement":"Duct tape adheres firmly to almost any surface.","answer":true,"why":"Adhere means to stick tightly to a surface."},{"word":"aggregate","statement":"When calculating annual profit, an accountant will aggregate the quarterly revenues.","answer":true,"why":"Aggregate means to add up or gather into a total."},{"word":"cohere","statement":"A disjointed essay full of unrelated thoughts is considered to cohere effectively.","answer":false,"why":"Cohere means to be internally consistent and logically linked; a disjointed essay does not cohere."},{"word":"dissimulate","statement":"To dissimulate means to express one’s genuine emotions openly without disguise.","answer":false,"why":"Dissimulate means to disguise under a fake appearance or conceal true feelings."},{"word":"egregious","statement":"A student paper filled with egregious errors contains noticeably bad mistakes.","answer":true,"why":"Egregious means conspicuously bad or offensive."},{"word":"ensemble","statement":"An orchestra composed of diverse musicians and instruments is an ensemble.","answer":true,"why":"An ensemble is a whole unit composed of complementary or coordinated parts."},{"word":"facsimile","statement":"A facsimile of the Constitution is an original manuscript penned by the framers.","answer":false,"why":"A facsimile is an exact copy or reproduction, not the original manuscript."},{"word":"gregarious","statement":"Gregarious individuals typically seek out and enjoy the company of others at social gatherings.","answer":true,"why":"Gregarious means sociable and fond of company."},{"word":"inherent","statement":"An inherent ability is acquired strictly through adult vocational training.","answer":false,"why":"Inherent means inborn or intrinsic, not learned later in life."},{"word":"semblance","statement":"Maintaining a semblance of order means preserving at least an outward token appearance of control.","answer":true,"why":"Semblance refers to an outward or token appearance."},{"word":"adhere","statement":"Identical twins raised together often have parents who adhere to consistent daily routines.","answer":true,"why":"Adhere can mean to follow or stick to a plan without straying."},{"word":"ensemble","statement":"Cole and Dylan Sprouse formed a twin ensemble when sharing an acting role.","answer":true,"why":"Twin ensembles share roles in productions."},{"word":"facsimile","statement":"Identical twins are exact facsimiles in all prenatal aspects, including birth weight and fingerprints.","answer":false,"why":"The passage notes identical twins are not simply facsimiles; their birth weight and fingerprints differ."},{"word":"gregarious","statement":"Studies show that identical twins frequently share gregarious personality traits.","answer":true,"why":"Twin studies show identical twins often share traits like gregariousness and optimism."},{"word":"egregious","statement":"King Louis XIV’s treatment of his imprisoned twin was described as egregious because it was conspicuously cruel.","answer":true,"why":"Egregious means conspicuously bad or offensive."}],"derivatives":[{"word":"facsimile","prompt":"Some __________ can be very difficult to distinguish from the originals.","answers":["facsimiles"],"why":"Plural noun needed: facsimiles."},{"word":"cohere","prompt":"The argument lacked __________ and fell apart like a house of cards in an earthquake.","answers":["cohesion","coherence"],"why":"Noun form required: cohesion (or coherence)."},{"word":"inherent","prompt":"Many philosophers have argued about whether people are __________ good or evil.","answers":["inherently"],"why":"Adverb modifying adjectives 'good or e
