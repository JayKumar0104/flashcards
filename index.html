zation Act, which increased the waiting period for an immigrant to become a citizen from 5 to 14 years; the Alien Act, which empowered the president to arrest and deport dangerous aliens; the Alien Enemy Act, which allowed for the arrest and deportation of citizens of countries at was with the US; and the Sedition Act, which made it illegal to publish defamatory statements about the federal government or its officials. The first 3 were enacted in response to the XYZ Affair, and were aimed at French and Irish immigrants, who were considered subversives. The Sedition Act was an attempt to stifle Democratic-Republican opposition, although only 25 people were ever arrested, and only 10 convicted, under the law. The Kentucky and Virginia Resolutions, which initiated the concept of \"nullification\" of federal laws were written in response to the Acts."},{"number":271,"term":"Virginia and Kentucky Resolutions","definition":"Written anonymously by Jefferson and Madison in response to the Alien and Sedition Acts, they declared that states could nullify federal laws that the states considered unconstitutional."},{"number":272,"term":"Doctrine of Nullification","definition":"Expressed in the Virginia and Kentucky Resolutions, it said that states could nullify federal laws."},{"number":273,"term":"Election of 1800","definition":"The two Democratic-Republicans Thomas Jefferson and Aaron Burr defeated Federalist John Adams but tied with each other. The final decision went the House of Representatives, where there was another tie. After a long series of ties in the House, Jefferson was finally chosen as president. Burr became vice-president. This led to the 12th Amendment, which requires the president and vice-president of the same party to run on the same ticket."},{"number":274,"term":"Revolution of 1800","definition":"Jefferson’s election changed the direction of the government from Federalist to Democratic-Republican, so it was called a \"revolution.\""},{"number":275,"term":"Jefferson’s Inaugural Address","definition":"Continued Washington’s policy of avoiding foreign alliances. Also sought to bridge the partisan divide which had manifested during the 1800 campaign by declaring, “We are all republicans, we are all federalists.”"},{"number":276,"term":"12th Amendment","definition":"Brought about by the Jefferson/Burr tie, stated that presidential and vice-presidential nominees would run on the same party ticket. Before that time, all of the candidates ran against each other, with the winner becoming president and second place becoming vice-president."},{"number":277,"term":"Second Great Awakening","definition":"A series of religious revivals starting in 1801, based on Methodism and Baptism. Stressed a religious philosophy of salvation through good deeds and tolerance for all Protestant sects. The revivals attracted women, Blacks, and Native Americans."},{"number":278,"term":"Gilbert Stuart (1755-1828)","definition":"American painter, most famous for painting the portrait of Washington which was copied for the one-dollar bill."},{"number":279,"term":"Charles Wilson Peale (1741-1827)","definition":"An American naturalist painter. Famous for portraits of George Washington, John Hancock, Benjamin Franklin, Thomas Jefferson, and Alexander Hamilton."},{"number":280,"term":"Franco-American Alliance of 1778","definition":"France aided the U.S. in the American Revolution, and the U.S. agreed to aid France if the need ever arose. Although France could have used American aid during the French Revolution, the U.S. did not do anything to help. The U.S. did not fulfill their part of the agreement until World War I."},{"number":281,"term":"French Revolution","definition":"The second great democratic revolution, taking place in the 1790s, after the American Revolution had been proven to be a success. The U.S. did nothing to aid either side. The French people overthrew the king and his government, and then instituted a series of unsuccessful democratic governments until Napoleon took over as dictator in 1799."},{"number":282,"term":"Citizen Genêt","definition":"Edmond Charles Genêt. A French diplomat who came to the U.S. 1793 to ask the American government to send money and troops to aid the revolutionaries in the French Revolution. President Washington asked France to recall Genêt after Genêt began recruiting men and arming ships in U.S. ports. However, Washington later relented and allowed Genêt U.S. citizenship upon learning that the new French government planned to arrest Genêt."},{"number":283,"term":"Neutrality Proclamation","definition":"Washington’s declaration that the U.S. would not take sides after the French Revolution touched off a war between France and a coalition consisting primarily of England, Austria and Prussia. Washington's Proclamation was technically a violation of the Franco-American Treaty of 1778."},{"number":284,"term":"XYZ Affair, Talleyrand","definition":"1798 - A commission had been sent to France in 1797 to discuss the disputes that had arisen out of the U.S.'s refusal to honor the Franco-American Treaty of 1778. President Adams had also criticized the French Revolution, so France began to break off relations with the U.S. Adams sent delegates to meet with French foreign minister Talleyrand in the hopes of working things out. Talleyrand’s three agents told the American delegates that they could meet with Talleyrand only in exchange for a very large bribe. The Americans did not pay the bribe, and in 1798 Adams made the incident public, substituting the letters \"X, Y and Z\" for the names of the three French agents in his report to Congress."},{"number":285,"term":"Undeclared Naval War with France","definition":"Beginning in 1794, the French had began seizing American vessels in retaliation for Jay's Treaty, so Congress responded by ordering the navy to attack any French ships on the American coast. The conflict became especially violent after the XYZ Affair. A peace convention in 1800 with the newly installed dictator, Napoleon, ended the conflict."},{"number":286,"term":"Convention of 1800","definition":"A conference between the U.S. and France which ended the naval hostilities."},{"number":287,"term":"British seizure of American ships","definition":"France blocked English ports during the Napoleonic Wars of the early 1800s; England responded by blocking French ports. The British seized neutral American merchant ships which tried to trade at French ports."},{"number":288,"term":"\"Rule of 1756\"","definition":"A British proclamation that said that neutral countries could not trade with both of two warring nations; they had to chose sides and only trade with one of the nations. This justified Britain’s seizure of neutral American ships during the war between Britain and France in the early 1800s."},{"number":289,"term":"Northwest posts","definition":"British fur-trading posts in the Northwest Territory. Their presence in the U.S. led to continued British-American conflicts."},{"number":290,"term":"Jay’s Treaty (1794)","definition":"Signed in the hopes of settling the growing conflicts between the U.S. and Britain. It dealt with the Northwest posts and trade on the Mississippi River. It was unpopular with most Americans because it did not punish Britain for the attacks on neutral American ships. It was particularly unpopular with France, because the U.S. also accepted the British restrictions on the rights of neutrals."},{"number":291,"term":"Washington’s Farewell Address","definition":"He warned against the dangers of political parties and foreign alliances."},{"number":292,"term":"Pickney’s Treaty","definition":"1795 - Treaty between the U.S. and Spain which gave the U.S. the right to transport goods on the Mississippi river and to store goods in the Spanish port of New Orleans."},{"number":293,"term":"Spanish intrigue in the Southwest","definition":"During the late 1700s/early 1800s Spain was exploring and settling the region which is now the Southwest U.S. The Spanish used the Indians of Florida and Georgia as spies and encouraged the tribes to raid U.S. settlements, which contributed to the outbreak of the War of 1812. Zebulon Pike used his expedition to the West as an opportunity to spy on the Spanish and map out their land."},{"number":294,"term":"James Wilkinson (1759-1825)","definition":"Wilkinson had been an officer in the Continental Army, and later held several positions relating to the Army, such as secretary of the board of war and clothier general to the army. He was one of the Commissioners appointed to receive the Purchase Louisiana from the French and served as Governor of Louisiana from 1805-1806. He informed Pres. Jefferson of Burr's conspiracy to take over Louisiana and was the primary witness against Burr at his treason trial, even though Wilkinson was himself implicated in the plot."},{"number":295,"term":"\"Mad\" Anthony Wayne, Battle of Fallen Timbers","definition":"Wayne had been one of the leading generals of the Continental Army and had played a crucial role in the defeat of Cornwallis at Yorktown. In the early 1790's, the British held trading posts in the Ohio Valley and encouraged the local Indian tribes to attack the Americans. Led by Wayne, the Americans defeated the Miami Indians in the Battle of Fallen Timbers on August 20, 1794 near what is today Toledo, Ohio. This paved the way for American settlement of the Ohio Valley."},{"number":296,"term":"Treaty of Greenville, 1795","definition":"Drawn up after the Battle of Fallen Timbers. The 12 local Indian tribes gave the Americans the Ohio Valley territory in exchange for a reservation and $10,000."},{"number":297,"term":"Barbary Pirates","definition":"The name given to several renegade countries on the Mediterranean coast of North Africa who demanded tribute in exchange for refraining from attacking ships in the Mediterranean. From 1795-1801, the U.S. paid the Barbary states for protection against the pirates. Jefferson stopped paying the tribute, and the U.S. fought the Barbary Wars (1801-1805) against the countries of Tripoli and Algeria. The war was inconclusive, and the U.S. went back to paying the tribute."},{"number":298,"term":"Rutgers v. Waddington (1784)","definition":"In 1783, the New York State Legislature passed the Trespass Act, which allowed landowners whose property had been occupied by the British during the Revolution to sue for damages. Rutgers sued in the Mayor’s Court over the seizure of her brewery, and the Mayor, James Duane, declared the Act void because it conflicted with a provision of the Treaty of Paris. It was the first time a U.S. court had declared a law unconstitutional and was an important precedent for the later U.S. Supreme Court decision in Marbury v. Madison."},{"number":299,"term":"Trevett v. Weeden (1787)","definition":"Occurred under the Articles of Confederation, when each state had a different type of currency. Acts passed by the Rhode Island Legislature imposed heavy fines on those who refused to accept the state’s depreciated currency at face value. Weeden was acquitted on the grounds that the acts were unconstitutional."},{"number":300,"term":"Bayard v. Singleton (1787)","definition":"First court decision in which a law was found unconstitutional based on a written constitution."},{"number":301,"term":"Chisholm v. Georgia (1793)","definition":"The heirs of Alexander Chisholm (a citizen of South Carolina) sued the state of Georgia. The Supreme Court upheld the right of citizens of one state to sue another state and decided against Georgia."},{"number":302,"term":"Ware v. Hylton (1796)","definition":"A treaty between the U.S. and Great Britain required that all debts owed by the U.S. to Britain had to be paid in full. However, a Virginia statute said that American debts to Britain could be paid in depreciated currency. The Supreme Court upheld the treaty, proving that federal laws take precedence over state laws."},{"number":303,"term":"War of 1812 (1812-1814)","definition":"A war between the U.S. and Great Britain caused by American outrage over the impressment of American sailors by the British, the British seizure of American ships, and British aid to the Indians attacking the Americans on the western frontier. Also, a war against Britain gave the U.S. an excuse to seize the British northwest posts and to annex Florida from Britain’s ally Spain, and possibly even to seize Canada from Britain. The War Hawks (young westerners led by Henry Clay and John C. Calhoun) argued for war in Congress. The war involved several sea battles and frontier skirmishes. U.S. troops led by Andrew Jackson seized Florida and at one point the British managed to invade and burn Washington, D.C. The Treaty of Ghent (December 1814) restored the status quo and required the U.S. to give back Florida. Two weeks later, Andrew Jackson’s troops defeated the British at the Battle of New Orleans, not knowing that a peace treaty had already been signed. The war strengthened American nationalism and encouraged the growth of industry."},{"number":304,"term":"Clay’s American System","definition":"Proposed by Henry Clay after the War of 1812, it included using federal money for internal improvements (roads, bridges, industrial improvements, etc.), enacting a protective tariff to foster the growth of American industries, and strengthening the national bank."},{"number":305,"term":"Was Jacksonianism an attack on privilege?","definition":"To some extent, it was. Jackson opposed monopolies and the privileged class of society; he attacked the national bank for this reason. He advocated increased popular participation in government and greater opportunity for the common man."},{"number":306,"term":"Bank war: its enemies and defenders","definition":"During Jackson’s presidency, this was a struggle between those who wanted to keep the national bank in operation and those who wanted to abolish it. Jackson and states’ rights advocates opposed the national bank, which they felt imposed discriminatory credit restrictions on local banks, making it more difficult for farmers and small businessmen to obtain loans. The bank was defended by Nicholas Biddle and Henry Clay, the National Republicans, the wealthy, and larger merchants, who felt that local banks credit policies were irresponsible and would lead to a depression."},{"number":307,"term":"Bank war: Veto message by Andrew Jackson","definition":"1832 - President Jackson vetoed the bill to re-charter the national bank."},{"number":308,"term":"Bank war: laws from 1800 to 1865 on banking","definition":"These laws moved away from favoring the national bank towards favoring state banks."},{"number":309,"term":"Changes in federal land laws and policies","definition":"The Land Acts of 1800 and 1820, and the Preemptive Acts of the 1830s and 1840s lowered the price of land and made it easier for prospective settlers to acquire it. This encouraged people to move west."},{"number":310,"term":"Changes and improvements in transportation and its effect","definition":"These included canals in the Great Lakes region, toll roads, steamboats, and clipper ships. The result was faster trade and easier access to the western frontier. It aided the growth of the nation."},{"number":311,"term":"President Jefferson","definition":"He believed in a less aristocratic presidency. He wanted to reduce federal spending and government interference in everyday life. He was a Democratic-Republican (originally an Anti- Federalist), so he believed in strict interpretation of the Constitution."},{"number":312,"term":"Vice-President Burr","definition":"Aaron Burr was one of the leading Democratic-Republicans of New York and served as a U.S. Senator from New York from 1791-1797. He was the principal opponent of Alexander Hamilton’s Federalist policies. In the election of 1800, Burr tied with Jefferson in the Electoral College. The House of Representatives awarded the Presidency to Jefferson and made Burr Vice- President."},{"number":313,"term":"Sec. of Treasury Gallatin","definition":"Albert Gallatin was a Swiss immigrant who was a financial genius and served as U.S. Secretary of the Treasury from 1801 - 1814 under Presidents Jefferson and Madison. He advocated free trade and opposed the Federalists’ economic policies. Gallatin was a member of the U.S. delegation that negotiated the Treaty of Ghent, and later served as Ambassador to France and to Britain."},{"number":314,"term":"Federalist control of courts and judges, midnight judges","definition":"On his last day in office, President Adams appointed a large number of Federalist judges to the federal courts in an effort to maintain Federalist control of the government. (The Federalists had lost the presidency and much of Congress to the Republicans.) These newly appointed Federalist judges were called midnight judges because John Adams had stayed up until midnight signing the appointments."},{"number":315,"term":"Justice Samuel Chase","definition":"A Federalist judge appointed by Washington to the Supreme Court. Chase had been a Revolutionary War hero and was a signer of the Declaration of Independence. Jefferson disagreed with his rulings and had him impeached for publicly criticizing the Jefferson administration to the Maryland grand jury. Chase was acquitted by the Senate, and the impeachment failed. (This is the only attempt in history to impeach a U.S. Supreme Court Justice.)"},{"number":316,"term":"Tripolitan War (1801-1805)","definition":"Also called the Barbary Wars, this was a series of naval engagements launched by President Jefferson in an effort to stop the attacks on American merchant ships by the Barbary pirates. The war was inconclusive, afterwards, the U.S. paid a tribute to the Barbary states to protect their ships from pirate attacks."},{"number":317,"term":"Treaty of Sam Ildefonso","definition":"1800 - In this treaty, Spain gave the Louisiana territory back to France (France had lost it to Spain in the Seven Years War)."},{"number":318,"term":"Louisiana Purchase: reasons, Jefferson, loose construction","definition":"1803 - The U.S. purchased the land from the Mississippi River to the Rocky Mountains from Napoleon for $15 million. Jefferson was interested in the territory because it would give the U.S. the Mississippi River and New Orleans (both were valuable for trade and shipping) and room to expand. Napoleon wanted to sell because he needed money for his European campaigns and because a rebellion against the French in Haiti had soured him on the idea of New World colonies. The Constitution did not give the federal government the power to buy land, so Jefferson used loose construction to justify the purchase."},{"number":319,"term":"Toussaint L’Overture","definition":"1803 - Led a slave rebellion which took control of Haiti, the most important island of France’s Caribbean possessions. The rebellion led Napoleon to feel that New World colonies were more trouble than they were worth, and encouraged him to sell Louisiana to the U.S."},{"number":320,"term":"Federalist opposition to the Louisiana Purchase","definition":"Federalists opposed it because they felt Jefferson overstepped his Constitutional powers by making the purchase."},{"number":321,"term":"Hamilton-Burr duel","definition":"After Burr lost to Jefferson as a Republican, he switched to the Federalist party and ran for governor of New York. When he lost, he blamed Hamilton (a successful Federalist politician) of making defamatory remarks that cost him the election. Burr challenged Hamilton to a duel, in which Hamilton threw away his shot and was killed on July 11, 1804."},{"number":322,"term":"Burr expedition, treason trial","definition":"After the duel, Burr fled New York and joined a group of mercenaries in the southern Louisiana territory region. The U.S. arrested them as they moved towards Mexico. Burr claimed that they had intended to attack Mexico, but the U.S. believed that they were actually trying to get Mexican aid to start a secession movement in the territories. Burr was tried for treason, and although Jefferson advocated Burr’s punishment, the Burr was acquitted."},{"number":323,"term":"Lewis and Clark expedition and its findings","definition":"1804-1806 - Meriwether Lewis and William Clark were commissioned by Jefferson to map and explore the Louisiana Purchase region. Beginning at St. Louis, Missouri, the expedition travelled up the Missouri River to the Great Divide, and then down the Columbia River to the Pacific Ocean. It produced extensive maps of the area and recorded many scientific discoveries, greatly facilitating later settlement of the region and travel to the Pacific coast."},{"number":324,"term":"Pike, Major Long, their observations","definition":"Zebulon Pike explored (1805-1807) Minnesota and the Southwest, mapped the region, and spied on the Spanish whenever his exploration took him into their territory. (He was eventually captured by the Spanish, but the U.S. arranged for his release.) Major Long explored the middle of the Louisiana Purchase region (Nebraska, Kansas, Colorado) and concluded that it was a worthless \"Great American Desert.\""},{"number":325,"term":"Berlin Decree (1806), Milan Decree (1807)","definition":"These decrees issued by Napoleon dealt with shipping and led to the War of 1812. The Berlin Decree initiated the Continental System, which closed European ports to ships which had docked in Britain. The Milan Decree authorized French ships to seize neutral shipping vessels trying to trade at British ports."},{"number":326,"term":"Orders-in-council","definition":"British laws which led to the War of 1812. Orders-in-council passed in 1807 permitted the impressment of sailors and forbade neutral ships from visiting ports from which Britain was excluded unless they first went to Britain and traded for British goods."},{"number":327,"term":"Impressment","definition":"British seamen often deserted to join the American merchant marines. The British would board American vessels in order to retrieve the deserters, and often seized any sailor who could not prove that he was an American citizen and not British."},{"number":328,"term":"Chesapeake-Leopard Affair","definition":"1807 - The American ship Chesapeake refused to allow the British on the Leopard to board to look for deserters. In response, the Leopard fired on the Chesapeake. As a result of the incident, the U.S. expelled all British ships from its waters until Britain issued an apology. They surrendered the colony to the English on Sept. 8, 1664."},{"number":329,"term":"Embargo of 1807","definition":"This act issued by Jefferson forbade American trading ships from leaving the U.S. It was meant to force Britain and France to change their policies towards neutral vessels by depriving them of American trade. It was difficult to enforce because it was opposed by merchants and everyone else whose livelihood depended upon international trade. It also hurt the national economy, so it was replaced by the Non-Intercourse Act."},{"number":330,"term":"Non-Intercourse Act (1809)","definition":"Replaced the Embargo of 1807. Unlike the Embargo, which forbade American trade with all foreign nations, this act only forbade trade with France and Britain. It did not succeed in changing British or French policy towards neutral ships, so it was replaced by Macon’s Bill No. 2."},{"number":331,"term":"Erskine Agreement (1809)","definition":"The U.S. offered to cease all trade with France and resume trade with Britain if the British would stop the impressment of American sailors. The British did not agree to this, so this proposal never went into effect."},{"number":332,"term":"Macon’s Bill No. 2 (1810)","definition":"Forbade trade with Britain and France but offered to resume trade with whichever nation lifted its neutral trading restrictions first. France quickly changed its policies against neutral vessels, so the U.S. resumed trade with France, but not Britain."},{"number":333,"term":"Tecumseh (1763-1813)","definition":"A Shawnee chief who, along with his brother, Tenskwatawa, a religious leader known as The Prophet, worked to unite the Northwestern Indian tribes. The league of tribes was defeated by an American army led by William Henry Harrison at the Battle of Tippecanoe in 1811. Tecumseh was killed fighting for the British during the War of 1812 at the Battle of the Thames in 1813."},{"number":334,"term":"War Hawks","definition":"Western settlers who advocated war with Britain because they hoped to acquire Britain’s northwest posts (and also Florida or even Canada) and because they felt the British were aiding the Indians and encouraging them to attack the Americans on the frontier. In Congress, the War Hawks were Henry Clay and John C. Calhoun."},{"number":335,"term":"Causes of the War of 1812","definition":"These included: British impressment of sailors, British seizure of neutral American trading ships, and the reasons given by the War Hawks (the British were inciting the Indians on the frontier to attack the Americans, and the war would allow the U.S. to seize the northwest posts, Florida, and possibly Canada)."},{"number":336,"term":"Why war against Britain rather than against France?","definition":"Britain practiced impressment and was believed to be supplying weapons to the Indians on the frontier and encouraging them to attack the U.S. Also, Britain held land near the U.S. which the Americans hoped to acquire, and a war with Britain would allow the U.S. to seize Florida from Britain’s ally Spain. Although France had also seized American ships, France had agreed to lift its neutral trading restrictions, and the U.S. had resumed trade with France."},{"number":337,"term":"Federalist opposition to the War of 1812","definition":"The Federalist party was mainly composed of New England merchants, who wanted good relations with Britain and free trade. New England merchants met at the Hartford Convention in protest of the war and the U.S. government’s restrictions on trade."},{"number":338,"term":"Naval engagements in the War of 1812","definition":"The U.S. navy won some important battles on the Great Lakes but failed to break the British blockade of the U.S."},{"number":339,"term":"Fort McHenry, Francis Scott Key, \"Star Spangled Banner\"","definition":"Francis Scott Key saw Fort McHenry hold out during the night against a British attack. He wrote the poem \"Star Spangled Banner\" about the experience of seeing the U.S. flag still flying above the fort in the morning, and the poem was later set to the tune of an old English bar song."},{"number":340,"term":"Events of the War of 1812: Key Battles","definition":"Oliver Perry led an 1813 naval victory against the British on Lake Erie. Washington D.C. was captured and burned by the British in 1814. The Battle of New Orleans was a great victory for the U.S. in January 1815, but it took place two weeks after the signing of the Treaty of Ghent had ended the war."},{"number":341,"term":"Battle of New Orleans (1815)","definition":"A large British invasion force was repelled by Andrew Jackson’s troops at New Orleans. Jackson had been given the details of the British army’s battle plans by the French pirate, Jean Laffite. About 2500 British soldiers were killed or captured, while in the American army only 8 men were killed. Neither side knew that the Treaty of Ghent had ended the War of 1812 two weeks before the battle. This victory inspired American nationalism."},{"number":342,"term":"New England’s merchants, critics of the War of 1812, Essex Junto","definition":"New England’s merchants opposed the War of 1812 because it cut off trade with Great Britain. Critics of the war were mainly Federalists who represented New England. The Essex Junto was a group of extreme Federalists led by Aaron Burr who advocated New England’s secession from the U.S."},{"number":343,"term":"Hartford Convention (1814)","definition":"A convention of New England merchants who opposed the Embargo and other trade restriction, and the War of 1812. They proposed some Amendments to the Constitution and advocated the right of states to nullify federal laws. They also discussed the idea of seceding from the U.S. if their desires were ignored. The Hartford Convention turned public sentiment against the Federalists and led to the demise of the party."},{"number":344,"term":"Treaty of Ghent (1814)","definition":"John Quincy Adamas, Albert Gallatin, and Henry Clay led the American delegation which negotiated the Treaty of Ghent. The treaty ended the War of 1812 and restored the status quo. For the most part, territory captured in the war was returned to the original owner. It also set up a commission to determine the disputed Canada/U.S. border."},{"number":345,"term":"War of 1812 increased nationalism and economic independence","definition":"The U.S.’s success in the War of 1812 gave Americans a feeling of national pride. The War of 1812 had cut off America’s access to British manufactured goods and forced the U.S. to develop the means to produce those goods on its own."},{"number":346,"term":"Second Bank of the U.S., a reversal of Jeffersonian ideas","definition":"As a Democratic-Republican, Jefferson opposed the National Bank. The Second Bank of the U.S. was established in 1816 and was given more authority than the First Bank of the U.S. Bank loans were used to finance the American industrial revolution in the period after the War of 1812."},{"number":347,"term":"Tariff of 1816","definition":"This protective tariff helped American industry by raising the prices of British manufactured goods, which were often cheaper and of higher quality than those produced in the U.S."},{"number":348,"term":"Bonus Bill veto","definition":"March 1817 - Madison vetoed John C. Calhoun’s Bonus Bill, which would have used the bonus money paid to the government by the Second National Bank to build roads and canals. Madison believed in strict interpretation and using federal money for internal improvements is not a power granted to the federal government in the Constitution."},{"number":349,"term":"Rush-Bagot Treaty (1817)","definition":"This treaty between the U.S. and Great Britain (which controlled Canada) provided for the mutual disarmament of the Great Lakes. This was later expanded into an unarmed Canada/U.S. border."},{"number":350,"term":"Convention of 1818","definition":"Set the border between the U.S. and Canada at the 49th parallel (or latitude). Also affirmed U.S. rights to fisheries along Newfoundland and Labrador."},{"number":351,"term":"Panic of 1819","definition":"A natural post-war depression caused by overproduction and the reduced demand for goods after the war. However, it was generally blamed on the National Bank."},{"number":352,"term":"West Florida, 1810","definition":"The U.S. wanted this region, which now forms the southern parts of the states of Alabama and Mississippi, because it bordered the Mississippi River. The U.S. seized West Florida after an uprising by American settlers in the region."},{"number":353,"term":"Jackson in Florida","definition":"1817 - The Seminole Indians in Florida, encouraged by the Spanish, launched a series of raids into the U.S. President J. Q. Adams ordered Andrew Jackson, whose troops were on the U.S./Florida border, to seize Spanish forts in northern Florida. Jackson’s successful attacks convinced the Spanish that they could not defend Florida against the U.S."},{"number":354,"term":"Purchase of Florida (1819)","definition":"Under the Adams-Onis Treaty, Spain sold Florida to the U.S., and the U.S. gave up its claims to Texas."},{"number":355,"term":"Adams-Onis Treaty (1819)","definition":"Spain gave up Florida to the U.S. and the U.S./Mexico border was set so that Texas and the American Southwest would be part of Mexico."},{"number":356,"term":"George Canning (1770-1829)","definition":"Led the House of Commons in Parliament. First leader to recognize the independence of the Spanish colonies in America and support the Monroe Doctrine, which helped restore good relations between the U.S. and Great Britain."},{"number":357,"term":"Monroe Doctrine (1823)","definition":"Declared that Europe should not interfere in the affairs of the Western Hemisphere and that any attempt at interference by a European power would be seen as a threat to the U.S. It also declared that a New World colony which has gained independence may not be re-colonized by Europe. (It was written at a time when many South American nations were gaining independence). Only England, in particular George Canning, supported the Monroe Doctrine. Mostly just a show of nationalism, the doctrine had no major impact until later in the 1800s."},{"number":358,"term":"Era of Good Feelings","definition":"A name for President Monroe’s two terms, a period of strong nationalism, economic growth, and territorial expansion. Since the Federalist party dissolved after the War of 1812, there was only one political party and no partisan conflicts."},{"number":359,"term":"Chief Justice John Marshall","definition":"Justice Marshall was a Federalist whose decisions on the U.S. Supreme Court promoted federal power over state power and established the judiciary as a branch of government equal to the legislative and executive. In Marbury v. Madison he established the Supreme Court’s power of judicial review, which allows the Supreme Court to declare laws unconstitutional."},{"number":360,"term":"Missouri: Tallmadge Amendment, Thomas Amendment","definition":"When Missouri applied for statehood, there was a dispute over whether it would be admitted as a slave state or a free state. The Tallmadge Amendment was a bill which would have admitted Missouri with its existing slave population but would forbid the introduction of additional slaves and free all slave children at age 25. The Thomas Amendment was a bill which would have admitted Missouri as a slave state but forbid slavery north of the 36°30\" latitude in the Louisiana Purchase region. Neither bill was put into effect."},{"number":361,"term":"Missouri Compromise (1820)","definition":"Admitted Missouri as a slave state and at the same time admitted Maine as a free state. Declared that all territory north of the 36°30\" latitude would become free states, and all territory south of that latitude would become slave states."},{"number":362,"term":"Growth of industry in New England, textiles","definition":"The industrial revolution had occurred in England in the 1700s, but it was not until the period industrial growth after the War of 1812 that the U.S. began to manufacture goods with the aid of factories and machines. New England, rather than the South, emerged as a manufacturing center because New England had many rivers to supply waterpower, plus a better system of roads and canals. The first major industry in New England was textiles."},{"number":363,"term":"Samuel Slater (1768-1835)","definition":"When he emigrated from England to America in the 1790s, he brought with him the plans to an English factory. With these plans, he helped build the first factory in America."},{"number":364,"term":"Robert Fulton, Clermont","definition":"A famous inventor, Robert Fulton designed and built America’s first steamboat, the Clermont in 1807. He also built the Nautilus, the first practical submarine."},{"number":365,"term":"Eli Whitney: cotton gin (short for \"engine\")","definition":"1798 - He developed the cotton gin, a machine which could separate cotton form its seeds. This invention made cotton a profitable crop of great value to the Southern economy. It also reinforced the importance of slavery in the economy of the South."},{"number":366,"term":"Interchangeable parts","definition":"1799-1800 - Eli Whitney developed a manufacturing system which uses standardized parts which are all identical and thus, interchangeable. Before this, each part of a given device had been designed only for that one device; if a single piece of the device broke, it was difficult or impossible to replace. With standardized parts, it was easy to get a replacement part from the manufacturer. Whitney first put used standardized parts to make muskets for the U.S. government."},{"number":367,"term":"Boston Associates, Lowell, Massachusetts","definition":"The Boston Associates were a group of Boston businessmen who built the first power loom. In 1814 in Waltham, Massachusetts, they opened a factory run by Lowell. Their factory-made cloth so cheaply that women began to buy it rather than make it themselves."},{"number":368,"term":"Daniel Webster (1782-1852)","definition":"A great American orator. He gave several important speeches, first as a lawyer, then as a Congressman. He was a major representative of the North in pre-Civil War Senate debates, just as Sen. John C. Calhoun was the representative of the South in that time."},{"number":369,"term":"National Road (also called Cumberland Road)","definition":"The first highway built by the federal government. Constructed during 1825-1850, it stretched from Pennsylvania to Illinois. It was a major overland shipping route and an important connection between the North and the West."},{"number":370,"term":"Internal improvements","definition":"The program for building roads, canals, bridges, and railroads in and between the states. There was a dispute over whether the federal government should fund internal improvements since it was not specifically given that power by the Constitution."},{"number":371,"term":"Erie Canal, Dewitt Clinton","definition":"1825 - The Erie canal was opened as a toll waterway connecting New York to the Great Lakes. The canal was approved in 1817 with the support of New York’s Governor, Dewitt Clinton. Along with the Cumberland Road, it helped connect the North and the West."},{"number":372,"term":"New states, 1815-1840","definition":"The government tried to maintain a balance between slave states and free states. The new states admitted were: Indiana (1816, free), Mississippi (1817, slave), Illinois (1818, free), Alabama (1819, slave), Maine (1820, free), Missouri (1821, slave), Arkansas (1836, slave), and Michigan (1837, free)."},{"number":373,"term":"Federal government’s land policy: 1796, 1800, 1804, 1820","definition":"In 1796, land was sold in 640-acre tracts or more for no less than $2 per acre. In 1800, the minimum lot size was reduced to 320 acres. In 1804, the minimum lot size was 160 acres, and the minimum price $1.64 per acre. In 1804, the minimum lot size was 80 acres, and the minimum price $1.25 per acre."},{"number":374,"term":"New England’s opposition to cheap land","definition":"New England was opposed to the federal government’s liberal land policy because they did not feel that their region was benefiting from the money made off the land sales."},{"number":375,"term":"John Quincy Adams as Sec. of State: Florida, Monroe Doctrine","definition":"He served under President Monroe. In 1819, he drew up the Adams-Onis Treaty in which Spain gave the U.S. Florida in exchange for the U.S. dropping its claims to Texas. The Monroe Doctrine was mostly Adams’ work."},{"number":376,"term":"Election of 1824","definition":"Popular vote: Jackson - 152,933 (42%), Adams - 115,626 (32%), Clay - 47,136 (13%), Crawford - 46,979 (13%). Electoral vote: Jackson - 99, Adams - 84, Crawford - 41, Clay - 37. House vote: Adams - 13, Jackson - 7, Crawford - 4, Clay - dropped. Jackson did not have a majority in the electoral vote, so the election went to the House of Representatives, where Adams won."},{"number":377,"term":"\"Corrupt Bargain\"","definition":"The charge made by Jacksonians in 1825 that Clay had supported John Quincy Adams in the House presidential vote in return for the office of Secretary of State. Clay knew he could not win, so he traded his votes for an office."},{"number":378,"term":"Panama Conference (aka Panama Congress aka Amphictyonic Congress)","definition":"Summoned by the Venezuelan revolutionary leader, Simon Bolivar, in 1826 to discuss commercial treaties, adopt a code of international law, and arrive at a common Latin American policy toward Spain. President JQA & Secretary of State Henry Clay wanted the US to participate; but because most of the invited nations had outlawed slavery, Southern congressmen held up funding for the delegation’s travel expenses. Eventually the delegation departed for the conference; however, one US delegate died enroute and the other arrived after the conference has concluded."},{"number":379,"term":"Tariff of 1828 (aka Tariff of Abominations)","definition":"Raised the tariff on imported manufactured goods. The tariff protected the North but harmed the South; South said that the tariff was economically discriminatory and unconstitutional because it violated state's rights. It passed because New England favored high tariffs."},{"number":380,"term":"South Carolina Exposition and Protest","definition":"Vice-President Calhoun anonymously published the essay South Carolina Exposition, which proposed that each state in the union counter the tyranny of the majority by asserting the right to nullify an unconstitutional act of Congress. It was written in reaction to the Tariff of 1828, which he said placed the Union in danger and stripped the South of its rights. South Carolina had threatened to secede if the tariff was not revoked; Calhoun suggested state nullification as a more peaceful solution."},{"number":381,"term":"Jacksonian Revolution of 1828","definition":"Andrew Jackson became president after a campaign which depicted him as the representative of the “common man;” even to the extent of hyping his birth in a log cabin. Jackson appointed more diverse (class/education/income) people to government positions than had been done in prior administrations. Jefferson's emphasis on farmers’ welfare gave way to Jackson's appeal to city workers, small businessmen, and farmers. Jackson's election was the billed as the revolution of the \"Common Man\"."},{"number":382,"term":"Age of the Common Man","definition":"Jackson's presidency was the called the Age of the Common Man. An idea that government should be run by common people - a democracy based on self-sufficient middle class with ideas formed by liberal education and a free press. All white men could now vote, and the increased voting rights helped Jackson to be elected."},{"number":383,"term":"Jacksonian Democracy","definition":"The Jacksonian era (1829-1841) included many reforms: free public schools, more women's rights, better working conditions in factories, and the rise of the Abolition movement. In the election, Jackson was portrayed as a common man and his opponent, J.Q. Adams, was attacked for his aristocratic principles. Electors in the electoral college were also chosen by popular vote. Common man, nationalism, National Nominating Conventions."},{"number":384,"term":"Franchise extended, spoils system","definition":"Franchise extended - more people were given the right to vote, even men who owned no land. Spoils system - \"To the victor go the spoils\" - the winner of the election may do whatever they want with the staff. Jackson made more staff changes than any previous president, firing many people and replacing them with his own."},{"number":385,"term":"National Republicans","definition":"After the 1824 election, part of the Democratic-Republican party joined John Q. Adams, Clay, and Daniel Webster to oppose Andrew Jackson. They favored nationalistic measures like re-charter of the Bank of the United States, high tariffs, and internal improvements at national expense. They were supported mainly by Northwesterners and were not very successful. They were conservatives alarmed by Jackson's radicalness; they joined with the Whigs in the 1830's."},{"number":386,"term":"Caucus System, Nation Nominating Conventions","definition":"In the National Nominating Convention, delegates voted on the results of a primary. In the Caucus System, candidates were elected by small, secretive party groups and the public had little say in the process."},{"number":387,"term":"Kitchen Cabinet","definition":"A small group of Jackson's friends and advisors who were especially influential in the first years of his presidency. Jackson conferred with them instead of his regular cabinet. Many people didn't like Jackson ignoring official procedures and called it the \"Kitchen Cabinet\" or \"Lower Cabinet\"."},{"number":388,"term":"Cherokee Indian removal, \"Trail of Tears\"","definition":"A minority of the Cherokee tribe, despite the protest of the majority, had surrendered their Georgia land in the 1835 Treaty of New Echota. During the winter of 1838 - 1839, troops under General Winfield Scott evicted them from their homes in Georgia and moved them to Oklahoma Indian country. Many died on the trail; the journey became known as the \"Trail of Tears\"."},{"number":389,"term":"Cherokee Nation v. Georgia (1831); Worcester v. Georgia (1832)","definition":"Worcester v. Georgia: 1832 - The Supreme Court decided Georgia had no jurisdiction over Cherokee reservations. Georgia refused to enforce decision and President Jackson did not support the Court. Cherokee Nation v. Georgia: 1831 - The Supreme Court ruled that Indians were not independent nations but dependent domestic nations which could be regulated by the federal government. From then until 1871, treaties were formalities with the terms dictated by the federal government."},{"number":390,"term":"Whigs: origins, policies","definition":"Whigs were conservatives and popular with pro-Bank people and plantation owners. They mainly came from the National Republican Party, which was once largely Federalists. They took their name from the British political party that had opposed King George during the American Revolution. Among the Whigs were Henry Clay, Daniel Webster, and, for a while, Calhoun. Their policies included support of industry, protective tariffs, and Clay's American System. They were generally upper class in origin."},{"number":391,"term":"Maysville Road Veto (1830)","definition":"The Maysville Road Bill proposed building a road in Kentucky (Henry Clay's state) at federal expense. Jackson vetoed it because he did not like Clay, and Martin Van Buren pointed out that New York and Pennsylvania paid for their transportation improvements with state money. Applied strict interpretation of the Constitution by saying that the federal government could not pay for internal improvements."},{"number":392,"term":"Election of 1832, Anti-Masonic Party","definition":"Andrew Jackson (Democrat) ran for re-election with V.P. Martin Van Buren. The main issue was his veto of the re-charter of the U.S. Bank, which he said was a monopoly. Henry Clay (Whig), who was pro-Bank, ran against him The Anti-Masonic Party nominated William Wirt. This was the first election with a national nominating convention. Jackson won - 219 to Clay's 49 and Wirt's 1. The Masons were a semi-secret society devoted to libertarian principles to which most educated or upper-class men of the Revolutionary War era belonged. The Anti-Masons sprang up as a reaction to the perceived elitism of the Masons, and the new party took votes from the Whigs, helping Jackson to win the election."},{"number":393,"term":"Clay, Bank Re-charter Bill, Nicholas Biddle","definition":"The Bank of the United States was chartered by Congress in 1791; it held government funds and was also commercial. It was not re-chartered in 1811, but a second bank was established in 1816 (1/5 government owned). Jackson opposed it, saying it drove other banks out of business and favored the rich, but Clay favored it. Nicholas Biddle became the bank's president. He made the bank's loan policy stricter and testified that, although the bank had enormous power, it did not destroy small banks. The bank went out of business in 1836 amid controversy over whether the National Bank was constitutional and should be re-chartered."},{"number":394,"term":"Jackson Bank Veto Message (1832)","definition":"Jackson, in his veto message of the re-charter of the Second Bank of the U.S., said that the bank was a monopoly that catered to the rich, and that it was owned by the wealthy and by foreigners."},{"number":395,"term":"Jackson's removal of deposits, Roger B. Taney, pet bank, Loco Focos","definition":"Angry because Biddle used bank funds to support anti-Jacksonian candidates, Jackson removed federal deposits from the bank in 1833, firing the secretaries of treasury who wouldn't comply, and was charged with abuse of power. Roger B. Taney was Chief Justice of the Supreme Court and helped Jackson crush the Bank of the U.S. Pet banks were state banks into which Jackson deposited federal funds in 1833, after he vetoed the re-charter of the Second Bank of the U.S., so called because people thought they were chosen on political grounds. Loco Focos (1835) were Democrats who wanted reform and opposed tariffs, banks, monopolies, and other places of special privilege."},{"number":396,"term":"Foote Resolution, Webster-Hayne debate","definition":"The Webster-Hayne debate in 1830 was over an 1830 bill by Samuel A. Foote to limit the sale of public lands in the west to new settlers. Daniel Webster, in a dramatic speech, showed the danger of the states' rights doctrine, which permitted each state to decide for itself which laws were unconstitutional, claiming it would lead to civil war. States' rights (South) vs. nationalism (North)."},{"number":397,"term":"Peggy Eaton Affair","definition":"Social scandal (1829-1831) - John Eaton, Secretary of War, stayed with the Timberlakes when in Washington, and there were rumors of his affair with Peggy Timberlake even before her husband died in 1828. Many cabinet members snubbed the socially unacceptable Mrs. Eaton. Jackson sided with the Eatons, and the affair helped to dissolve the cabinet - especially those members associated with John C. Calhoun (V.P.), who was against the Eatons and had other problems with Jackson."},{"number":398,"term":"Calhoun resigns as vice-president","definition":"1832 - Calhoun, from South Carolina, wrote the doctrine of nullification, expressing his views in support of states' rights. His views were so disputed and so different from Jackson's that Calhoun resigned and was appointed senator in South Carolina to present their case to Congress."},{"number":399,"term":"South opposes protective tariffs (Tariff of Abominations)","definition":"The North wanted tariffs that protected new industries, but the agricultural Southern states depended on cheap imports of manufactured goods and only wanted tariffs for revenue. The South strongly opposed protective tariffs like the Tariffs of 1828 and 1832 and protested by asserting that enforcement of the tariffs could be prohibited by individual states, and by refusing to collect tariff duties."},{"number":400,"term":"Nullification crisis, South Carolina Exposition and Protest","definition":"When faced with the protective Tariff of 1828, John Calhoun presented a theory in the South Carolina Exposition and Protest (1828) that federal tariffs could be declared null and void by individual states and that they could refuse to enforce them. South Carolina called a convention in 1832, after the revised Tariff of 1828 became the Tariff of 1832, and passed an ordinance forbidding collection of tariff duties in the state. This was protested by Jackson."},{"number":401,"term":"Jefferson Day Dinner: toasts and quotes","definition":"April 13, 1830 - At the Jefferson anniversary dinner, President Jackson toasted, \"Our federal union! It must and shall be preserved!\" making it clear to the nullifiers that he would resist the states' rights supporters' claim to nullify the tariff law. V.P. Calhoun's response to the toast was, \"The union, next to our liberty, most dear. May we always remember that it can only be preserved by distributing evenly the benefits and burdens of the Union.\" Calhoun had wanted Jackson to side with him (for states' rights) in public, but he did not succeed."},{"number":402,"term":"Clay: Compromise Tariff of 1833","definition":"Henry Clay devised the Compromise Tariff of 1833 which gradually reduced the rates levied under the Tariffs of 1828 and 1832. It caused South Carolina to withdraw the ordinance nullifying the Tariffs of 1828 and 1832. Both protectionists and anti-protectionists accepted the compromise."},{"number":403,"term":"Force Bill (1833)","definition":"The Force Bill authorized President Jackson to use the army and navy to collect duties on the Tariffs of 1828 and 1832. South Carolina's ordinance of nullification had declared these tariffs null and void, and South Carolina would not collect duties on them. The Force Act was never invoked because it was passed by Congress the same day as the Compromise Tariff of 1833, so it became unnecessary. South Carolina also nullified the Force Act."},{"number":404,"term":"Calhoun splits with Jackson","definition":"1832 - Calhoun resigned as vice-president when his views on states' rights were disputed by Jackson. Calhoun wanted each section of the country to share federal power equally, and he wanted independence for the South if they were to be controlled by the majority."},{"number":405,"term":"Martin Van Buren, the Albany Regency","definition":"Martin Van Buren, a Democratic-Republican Senator from New York, rallied the factory workers of the North in support of Jackson. He became Jackson's V.P. after Calhoun resigned. New York politics at that time was controlled by a clique of wealthy landowners known as the Albany Regency, of which Van Buren became the leader."},{"number":406,"term":"Specie Circular","definition":"1836 - The Specie Circular, issued by President Jackson July 11, 1836, was meant to stop land speculation caused by states printing paper money without proper specie (gold or silver) backing it. The Circular required that the purchase of public lands be paid for in specie. It stopped the land speculation and the sale of public lands went down sharply. The panic of 1837 followed."},{"number":407,"term":"Charles River Bridge Decision, Chief Justice Roger B. Taney, General Incorporation Laws","definition":"1837 - The Charles River Bridge Decision, delivered by Roger B. Taney, modified C.J. Marshall's ruling in the Dartmouth College Case of 1819, which said that a state could not make laws infringing on the charters of private organizations. Taney ruled that a charter granted by a state to a company cannot work to the disadvantage of the public. The Charles River Bridge Company protested when the Warren Bridge Company was authorized in 1828 to build a free bridge where it had been chartered to operate a toll bridge in 1785. The court ruled that the Charles River Company was not granted a monopoly right in their charter, and the Warren Company could build its bridge. Began the legal concept that private companies cannot injure the public welfare."},{"number":408,"term":"Panic of 1837","definition":"When Jackson was president, many state banks received government money that had been withdrawn from the Bank of the U.S. These banks issued paper money and financed wild speculation, especially in federal lands. Jackson issued the Specie Circular to force the payment for federal lands with gold or silver. Many state banks collapsed as a result. A panic ensued (1837). Bank of the U.S. failed, cotton prices fell, businesses went bankrupt, and there was widespread unemployment and distress."},{"number":409,"term":"Dorr's Rebellion","definition":"In 1841, Rhode Island was governed by a 1663 charter which said that only property holders and their eldest sons could vote (1/2 the adult male population). Thomas Dorr led a group of rebels who wrote a new constitution and elected him governor in 1842. The state militia was called in to stop the rebellion. Dorr was sentenced to life imprisonment, but the sentence was withdrawn. Dorr's Rebellion caused conservatives to realize the need for reform. A new constitution in 1843 gave almost all men the right to vote."},{"number":410,"term":"Election of 1840: candidates, characteristics","definition":"William Henry Harrison and V.P. John Tyler - Whig - 234 votes. Martin Van Buren - Democrat - 60 votes. James G. Birney - Liberty Party - 0 votes. Panic of 1837 and a coming depression kept Van Buren from being reelected. Whigs rejected Clay, nominated military hero Harrison with the slogan \"Tippecanoe and Tyler too\". They depicted Van Buren as living in luxury and Harrison as a \"log cabin and hard cider\" guy, which wasn't entirely true."},{"number":411,"term":"Rise of the Second Party System","definition":"Since the 1840's, two major political parties have managed to eliminate all competition. Democrats and Republicans have controlled nearly all government systems since the 1840's."},{"number":412,"term":"Pre-emption Act, 1841","definition":"This was to help settlers who occupied land and improved it before surveys were done. Without it, settlers could be outbid for the land. Some speculators used \"floaters\" to pre-empt land for them."},{"number":413,"term":"Tariff of 1842","definition":"A protective tariff signed by President John Tyler. Known as the “Black Tariff” by its opponents, it raised the general level of duties from 20% to 40%, which was about where they had been before the Compromise Tariff of 1833."},{"number":414,"term":"Transcendentalism","definition":"A philosophy pioneered by Ralph Waldo Emerson in the 1830's and 1840's, in which each person has direct communication with God and Nature, and there is no need for organized churches. It incorporated the ideas that mind goes beyond matter, intuition is valuable, that each soul is part of the Great Spirit, and each person is part of a reality where only the invisible is truly real. Promoted individualism, self-reliance, and freedom from social constraints, and emphasized emotions."},{"number":415,"term":"Transcendentalists","definition":"Believed in Transcendentalism, they included Emerson (who pioneered the movement) and Thoreau. Many of them formed cooperative communities such as Brook Farm and Fruitlands, in which they lived and farmed together with the philosophy as their guide. \"They sympathize with each other in the hope that the future will not always be as the past.\" It was more literary than practical - Brook Farm lasted only from 1841 to 1847."},{"number":416,"term":"Ralph Waldo Emerson (1803-1882)","definition":"Essayist, poet. A leading transcendentalist, emphasizing freedom and self-reliance in essays which still make him a force today. He had an international reputation as a first-rate poet. He spoke and wrote many works on the behalf of the Abolitionists."},{"number":417,"term":"Henry David Thoreau, Walden (1817-1862), \"On Civil Disobedience\"","definition":"A transcendentalist and friend of Emerson. He lived alone on Walden Pond with only $8 a year from 1845-1847 and wrote about it in Walden. In his essay, \"On Civil Disobedience,\" he inspired social and political reformers because he had refused to pay a poll tax in protest of slavery and the Mexican American War, and had spent a night in jail. He was an extreme individualist and advised people to protest by not obeying laws (passive resistance)."},{"number":418,"term":"Orestes Brownson (1803-1876)","definition":"Presbyterian layman, Universalist minister, Unitarian preacher, and founder of his own church in Boston. Spent his life searching for his place and supporting various causes. As an editor, he attacked organized Christianity and won a large intellectual New England following. Then turned Roman Catholic and became a strong defender of Catholicism in Brownson's Quarterly Review, from 1844 until his death."},{"number":419,"term":"Margaret Fuller (1810-1815), The Dial","definition":"Social reformer, leader in women's movement and a transcendentalist. Edited The Dial (1840-1842), which was the publication of the transcendentalists. It appealed to people who wanted \"perfect freedom\", \"progress in philosophy and theology . . . and hope that the future will not always be as the past.\""},{"number":420,"term":"James Fenimore Cooper (1789-1851), The Spy, The Pioneers","definition":"American novelist. The Spy (1821) was about the American Revolution. The Pioneers (1823) tells of an old scout returning to his boyhood home and is one of the Leatherstocking Tales, a series of novels about the American frontier, for which Cooper was famous. (Leatherstocking is the scout.) Cooper later stayed in Europe for seven years, and when he returned, he was disgusted by American society because it didn't live up to his books. Cooper emphasized the independence of individuals and importance of a stable social order."},{"number":421,"term":"James Fenimore Cooper, Last of the Mohicans","definition":"1826 - It is about a scout named Hawkeye during the French and Indian War, while he was in his prime. It is one of the Leatherstocking Tales, about a frontiersman and a noble Indian, and the clash between growing civilization and untamed wilderness."},{"number":422,"term":"Herman Melville (1819-1891), Moby Dick","definition":"Wrote Moby Dick (1851) about a Captain Ahab who seeks revenge on the white whale that crippled him but ends up losing his life, his ship, and his crew. Was not popular at the time but now highly regarded. Melville rejected the optimism of the transcendentalists and felt that man faced a tragic destiny. His views were not popular at the time but were accepted by later generations."},{"number":423,"term":"Nathaniel Hawthorne (1804-1864), The Scarlet Letter","definition":"Originally a transcendentalist; later rejected them and became a leading anti-transcendentalist. He was a descendant of Puritan settlers. The Scarlet Letter shows the hypocrisy and insensitivity of New England puritans by showing their cruelty to a woman who has committed adultery and is forced to wear a scarlet \"A\"."},{"number":424,"term":"Edgar Allen Poe (1809-1849)","definition":"Author who wrote many poems and short stories including \"The Raven,\" \"The Bells,\" \"The Tell-Tale Heart,\" and \"The Gold Bug.\" He was the originator of the detective story and had a major influence on symbolism and surrealism. Best known for macabre stories."},{"number":425,"term":"Washington Irving (1783-1859)","definition":"Author, diplomat. Wrote The Sketch Book, which included \"Rip Van Winkle\" and \"The Legend of Sleepy Hollow.\" He was the first American to be recognized in England (and elsewhere) as a writer."},{"number":426,"term":"Henry Wadsworth Longfellow (1807-1882)","definition":"Internationally recognized poet. Emphasized the value of tradition and the impact of the past on the present."},{"number":427,"term":"Walt Whitman (1819-1892), Leaves of Grass","definition":"Leaves of Grass (1855) was his first volume of poetry. He broke away from the traditional forms and content of New England poetry by describing the life of working Americans and using words like \"I reckon\", \"duds\", and \"folks\". He loved people and expressed the new democracy of a nation finding itself. He had radical ideas and abolitionist views - Leaves of Grass was considered immoral. Patriotic."},{"number":428,"term":"Hudson River School of Art","definition":"In about 1825, a group of American painters, led by Thomas Cole, used their talents to do landscapes, which were not highly regarded. They painted many scenes of New York's Hudson River. Mystical overtones."},{"number":429,"term":"Alexis de Tocqueville, Democracy in America","definition":"De Tocqueville came from France to America in 1831. He observed democracy in government and society. His book (written in two parts in 1835 and 1840) discusses the advantages of democracy and consequences of the majority's unlimited power. First to raise topics of American practicality over theory, the industrial aristocracy, and the conflict between the masses and individuals."},{"number":430,"term":"Millennialism, Millerites","definition":"Millerites were Seventh Day Adventists who followed William Miller. They sold their possessions because they believed the Second Coming would be in 1843 or 1844 and waited for the world to end. The Millennial Dawnists, another sect of the Seventh Day Adventists, believed the world was under Satan's rule and felt it their obligation to announce the Second Coming of Christ and the battle of Armageddon."},{"number":431,"term":"\"The Burned-Over District\"","definition":"Term applied to the region of western New York along the Erie Canal, and refers to the religious fervor of its inhabitants. In the 1800's, farmers there were susceptible to revivalist and tent rallies by the Pentecostals (religious groups)."},{"number":432,"term":"Charles G. Finney (1792-1875)","definition":"An immensely successful revivalist of the 1800's. He helped establish the \"Oberlin Theology\". His emphasis on \"disinterested benevolence\" helped shape the main charitable enterprises of the time."},{"number":433,"term":"Mormons: Joseph Smith (1805-1844)","definition":"Founded Mormonism in New York in 1830 with the guidance of an angel. In 1843, Smith's announcement that God sanctioned polygamy split the Mormons and let to an uprising against Mormons in 1844. He translated the Book of Mormon and died a martyr."},{"number":434,"term":"Brigham Young, Great Salt Lake, Utah","definition":"1847 - Brigham Young let the Mormons to the Great Salt Lake Valley in Utah, where they founded the Mormon republic of Deseret. Believed in polygamy and strong social order. Others feared that the Mormons would act as a block, politically and economically."},{"number":435,"term":"Brook Farm","definition":"An experiment in Utopian socialism, it lasted for six years (1841-1847) in New Roxbury, Massachusetts."},{"number":436,"term":"New Harmony","definition":"A utopian settlement in Indiana lasting from 1825 to 1827. It had 1,000 settlers, but a lack of authority caused it to break up."},{"number":437,"term":"Oneida Community","definition":"A group of socio-religious perfectionists who lived in New York. Practiced polygamy, communal property, and communal raising of children."},{"number":438,"term":"Shakers","definition":"A millennial group who believed in both Jesus and a mystic named Ann Lee. Since they were celibate and could only increase their numbers through recruitment and conversion, they eventually ceased to exist."},{"number":439,"term":"Amana Community","definition":"A German religious sect set up this community with communist overtones. Still in existence."},{"number":440,"term":"Lyceum Movement","definition":"Developed in the 1800's in response to growing interest in higher education. Associations were formed in nearly every state to give lectures, concerts, debates, scientific demonstrations, and entertainment. This movement was influential for the increase in the number of institutions of higher learning."},{"number":441,"term":"Dorothea Dix","definition":"A reformer and pioneer in the movement to treat the insane as mentally ill, beginning in the 1820's, she was responsible for improving conditions in jails, poorhouses and insane asylums throughout the U.S. and Canada. She succeeded in persuading many states to assume responsibility for the care of the mentally ill. She served as the Superintendent of Nurses for the Union Army during the Civil War."},{"number":442,"term":"Rise of labor leaders","definition":"During the 1800's, labor unions became more and more common. Their leaders sought to achieve the unions' goals through political actions. Their goals included reduction in the length of the workday, universal education, free land for settlers, and abolition of monopolies. Labor unions were the result of the growth of factories."},{"number":443,"term":"National Trade Union","definition":"Unions formed by groups of skilled craftsmen."},{"number":444,"term":"Commonwealth v. Hunt (1842)","definition":"Case heard by the Massachusetts supreme court. The case was the first judgment in the U.S. that recognized that the conspiracy law is inapplicable to unions and that strikes for a closed shop are legal. Also decided that unions are not responsible for the illegal acts of their members."},{"number":445,"term":"Criminal Conspiracy Laws and early unions","definition":"For a time in the 1700's and 1800's, these laws were directed at early labor unions. The organized stoppage of work by a group of employees in a strike could be judged a criminal restraint of trade. This approach largely ended after Commonwealth v. Hunt."},{"number":446,"term":"Oberlin, 1833; Mt. Holyoke, 1836","definition":"Oberlin: founded by a New England Congregationalist at Oberlin, Ohio. First coed facility at the college level. The first to enroll Blacks in 1835. Mt. Holyoke: founded in 1837 in South Hadley, Massachusetts. Became the model for later liberal arts institutions of higher education for women. Liberal colleges."},{"number":447,"term":"Public education, Horace Mann","definition":"Secretary of the newly formed Massachusetts Board of Education, he created a public-school system in Massachusetts that became the model for the nation. Started the first American public schools, using European schools (Prussian military schools) as models. Now you know who to blame."},{"number":448,"term":"American Temperance Union","definition":"The flagship of the temperance movement in the 1800's. Opposed alcohol."},{"number":449,"term":"\"Ten Nights in a Bar-Room,\" Timothy Shay Arthur","definition":"A melodramatic story, published in 1856, which became a favorite text for temperance lecturers. In it, a traveler visits the town of Cedarville occasionally for ten years, notes the changing fortunes of the citizens and blames the saloon."},{"number":450,"term":"Maine Law, Neal Dow","definition":"In 1838, Dow founded the Maine Temperance Union. As mayor of Portland, Maine, Dow secured in 1851 the state's passage the Maine Law, which forbade the sale or manufacture of liquor."},{"number":451,"term":"Irish, German immigration","definition":"Irish: arriving in immense waves in the 1800's, they were extremely poor peasants who later became the manpower for canal and railroad construction. German: also came because of economic distress, German immigration had a large impact on America, shaping many of its morals. Both groups of immigrants were heavy drinkers and supplied the labor force for the early industrial era."},{"number":452,"term":"Nativism","definition":"An anti-foreign feeling that arose in the 1840's and 1850's in response to the influx of Irish and German Catholics."},{"number":453,"term":"Samuel F.B. Morse, Imminent Dangers to the Free Institutions of the U.S. Through Foreign Immigration, and the Present State of the Naturalization Laws","definition":"He was briefly involved in Nativism and anti-Catholic movements, asserting that foreign immigration posed a threat to the free institutions of the U.S., as immigrants took jobs from Americans and brought dangerous new ideas."},{"number":454,"term":"Lucretia Mott (1803-1880)","definition":"An early feminist, she worked constantly with her husband in liberal causes, particularly slavery abolition and women's suffrage. Her home was a station on the underground railroad. With Elizabeth Cady Stanton, she helped organize the first women's rights convention, held in Seneca Falls, New York in 1848."},{"number":455,"term":"Elizabeth Cady Stanton","definition":"A pioneer in the women's suffrage movement, she helped organize the first women's rights convention in Seneca Falls, New York in 1848. She later helped edit the militant feminist magazine Revolution from 1868 - 1870."},{"number":456,"term":"Seneca Falls Convention (1848)","definition":"The first modern women's right convention. At the gathering, Elizabeth Cady Stanton read a Declaration of Sentiment listing the many discriminations against women, and adopted eleven resolutions, one of which called for women's suffrage."},{"number":457,"term":"Emma Willard (1787-1870)","definition":"Early supporter of women's education, in 1818 she published Plan for Improving Female Education, which became the basis for public education of women in New York. In 1821, she opened her own girls’ school, the Troy Female Seminary, designed to prepare women for college."},{"number":458,"term":"Catherine Beecher (1800-1878)","definition":"A writer and lecturer, she worked on behalf of household arts and education of the young. She established two schools for women and emphasized better teacher training. She opposed women's suffrage."},{"number":459,"term":"\"Cult of True Womanhood\": piety, domesticity, purity and submissiveness","definition":"While many women were in favor of the women's movement, some were not. Some of these believed in preserving the values of \"true womanhood\": piety, domesticity, purity and submissiveness. These opponents of the women’s movement referred to their ideas as the \"Cult of True Womanhood.\""},{"number":460,"term":"Women's movement, like others, overshadowed by anti-slavery movement","definition":"In the 1800's, the women's movement was often overshadowed by the anti-slavery movement. Many men who had been working on behalf of the women's movement worked for the abolition of slavery once it became a major issue."},{"number":461,"term":"American Peace Society","definition":"Founded in 1828 by William Laddit. Formally condemned all wars, though it supported the U.S. government during the Civil War, WWI, and WWII. It was dissolved after the United Nations was formed in 1945."},{"number":462,"term":"Prison reform: Auburn system, Pennsylvania system","definition":"Prison reform in the U.S. began with the Pennsylvania system in 1790, based on the concept that solitary confinement would induce meditation and moral reform. However, this led to many mental breakdowns. The Auburn system, adopted in 1816, allowed the congregation of prisoners during the day."},{"number":463,"term":"Supreme Court: Marbury v. Madison (1803)","definition":"The case arose out of Jefferson’s refusal to deliver the commissions to the judges appointed by Adams’ Midnight Appointments. One of the appointees, Marbury, sued the Sect. of State, Madison, to obtain his commission. The Supreme Court held that Jefferson need not deliver the commissions because the Congressional act that had created the new judgeships violated the judiciary provisions of the Constitution and was therefore unconstitutional and void. This case established the Supreme Court's right to judicial review. Chief Justice John Marshall presided."},{"number":464,"term":"Supreme Court: Fletcher v. Peck (1810)","definition":"A state had tried to revoke a land grant on the grounds that it had been obtained by corruption. The Court ruled that a state cannot arbitrarily interfere with a person’s property rights. Since the land grant was a legal contract, it could not be repealed, even if corruption were involved."},{"number":465,"term":"Supreme Court: Martin v. Hunters Lessee (1816)","definition":"This case upheld the right of the Supreme Court to review the decisions of state courts."},{"number":466,"term":"Supreme Court: Dartmouth College v. Woodward (1819)","definition":"This decision declared private corporation charters to be contracts and immune form impairment by states' legislative action. It freed corporations from the states which created them."},{"number":467,"term":"Supreme Court: McCulloch v. Maryland (1819)","definition":"This decision upheld the power of Congress to charter a bank as a government agency and denied the state the power to tax that agency."},{"number":468,"term":"Supreme Court: Gibbons v. Ogden (1824)","definition":"This case ruled that only the federal government has authority over interstate commerce."},{"number":469,"term":"Supreme Court: Cherokee Nation v. Georgia (1831)","definition":"Supreme Court refused to hear a suit filed by the Cherokee Nation against a Georgia law abolishing tribal legislature. Court said Indians were not foreign nations, and U.S. had broad powers over tribes but a responsibility for their welfare."},{"number":470,"term":"Supreme Court: Worchester v. Georgia (1832)","definition":"Expanded tribal authority by declaring tribes sovereign entities, like states, with exclusive authority within their own boundaries. President Jackson and the state of Georgia ignored the ruling."},{"number":471,"term":"Supreme Court: River Bridge v. Warren Bridge (1837)","definition":"1837 - Supreme Court ruled that a charter granted by a state to a company cannot work to the disadvantage of the public. The Charles River Bridge Company protested when the Warren Bridge Company was authorized in 1828 to build a free bridge where it had been chartered to operate a toll bridge in 1785. The court ruled that the Charles River Company was not granted a monopoly right in their charter, and the Warren Company could build its bridge."},{"number":472,"term":"Supreme Court: Commonwealth v. Hunt (1842)","definition":"1842 - Case heard by the Massachusetts supreme court. The case was the first judgment in the U.S. that recognized that the conspiracy law is inapplicable to unions and that strikes for a closed shop are legal. Also decided that unions are not responsible for the illegal acts of their members."},{"number":473,"term":"Great American Desert","definition":"Region between the Missouri River and the Rocky Mountains. Vast domain became accessible to Americans wishing to settle there. This region was called the \"Great American Desert\" in atlases published between 1820 and 1850, and many people were convinced this land was a Sahara habitable only to Indians. The phrase had been coined by Major Long during his exploration of the middle of the Louisiana Purchase region."},{"number":474,"term":"Manifest Destiny","definition":"Phrase commonly used in the 1840's and 1850's. It expressed the inevitableness of continued expansion of the U.S. to the Pacific."},{"number":475,"term":"Horace Greeley (1811-1873)","definition":"Founder and editor of the New York Tribune. He popularized the saying \"Go west, young man.\" He said that people who were struggling in the East could make the fortunes by going west."},{"number":476,"term":"Stephen Austin (1793-1836)","definition":"In 1822, Austin founded the first settlement of Americans in Texas. In 1833 he was sent by the colonists to negotiate with the Mexican government for Texan independence and was imprisoned in Mexico until 1835, when he returned to Texas and became the commander of the settlers’ army in the Texas Revolution."},{"number":477,"term":"Texas War for Independence","definition":"After a few skirmishes with Mexican soldiers in 1835, Texas leaders met and organized a temporary government. Texas troops initially seized San Antonio but lost it after the massacre of the outpost garrisoning the Alamo. In response, Texas issued a Declaration of Independence. Santa Ana tried to swiftly put down the rebellion, but Texan soldiers surprised him and his troops on April 21, 1836. They crushed his forces and captured him in the Battle of San Jacinto and forced him to sign a treaty granting Texan independence. U.S. lent no aid."},{"number":478,"term":"Antonio López de Santa Anna","definition":"As dictator of Mexico, he led the attack on the Alamo in 1836. He was later defeated by Sam Houston at San Jacinto."},{"number":479,"term":"The Alamo","definition":"A Spanish mission converted into a fort; it was besieged by Mexican troops in 1836. The Texas garrison held out for thirteen days, but in the final battle, all the Texans were killed by the larger Mexican force."},{"number":480,"term":"San Jacinto","definition":"A surprise attack by Texas forces on Santa Ana's camp on April 21, 1836. Santa Ana's men were surprised and overrun in
