 twenty minutes. Santa Ana was taken prisoner and signed an armistice securing Texas independence. Mexicans - 1,500 dead, 1,000 captured. Texans - 4 dead."},{"number":481,"term":"Sam Houston (1793-1863)","definition":"Former Governor of Tennessee and an adopted member of the Cherokee Indian tribe, Houston settled in Texas after being sent there by Pres. Jackson to negotiate with the local Indians. Appointed commander of the Texas army in 1835, he led them to victory at San Jacinto, where they were outnumbered 2 to 1. He was President of the Republic of Texas (1836-1838 & 1841-1845) and advocated Texas joining the Union in 1845. He later served as U.S. Senator and Governor of Texas but was removed from the governorship in 1861 for refusing to ratify Texas joining the Confederacy."},{"number":482,"term":"Republic of Texas","definition":"Created March 1836 but not recognized until the next month after the battle of San Jacinto. Its second president attempted to establish a sound government and develop relations with England and France. However, rapidly rising public debt, internal conflicts and renewed threats from Mexico led Texas to join the U.S. in 1845."},{"number":483,"term":"Annexation of Texas, Joint Resolution under President Tyler","definition":"U.S. made Texas a state in 1845. Joint resolution - both houses of Congress supported annexation under Tyler, and he signed the bill shortly before leaving office."},{"number":484,"term":"Election of 1844: Candidates","definition":"James K. Polk - Democrat. Henry Clay - Whig. James G. Birney - Liberty Party."},{"number":485,"term":"Election of 1844: Issues","definition":"Manifest Destiny Issues: The annexation of Texas and the reoccupation of Oregon. Tariff reform."},{"number":486,"term":"Election of 1844: Third party's impact","definition":"Third party's impact was significant. James G. Birney drew enough votes away from Clay to give Polk New York, and thus the election."},{"number":487,"term":"Election 1844: Liberty Party","definition":"The first abolitionist party - believed in ending slavery."},{"number":488,"term":"Reoccupation of Texas and re-annexation of Oregon","definition":"Texas was annexed by Polk in 1845. Oregon was explored by Lewis and Clark from 1804 to 1806 and American fur traders set up there, but during the War of 1812, the British essentially took control of Oregon and held it jointly with the U.S. The land was returned to the U.S. with the Oregon Treaty of 1846, supported by Polk."},{"number":489,"term":"54º40' or Fight!","definition":"An aggressive slogan adopted in the Oregon boundary dispute, a dispute over where the border between Canada and Oregon should be drawn. This was also Polk's slogan - the Democrats wanted the U.S. border drawn at the 54º40' latitude. Polk settled for the 49º latitude in 1846."},{"number":490,"term":"James K. Polk","definition":"President known for promoting Manifest Destiny."},{"number":491,"term":"Slidell Mission to Mexico","definition":"Appointed minister to Mexico in 1845, John Slidell went to Mexico to pay for disputed Texas and California land. But the Mexican government was still angry about the annexation of Texas and refused to talk to him."},{"number":492,"term":"Rio Grande, Nueces River, disputed territory","definition":"Texas claimed its southern border was the Rio Grande; Mexico wanted the border drawn at the Nueces River, about 100 miles north of the Rio Grande. U.S. and Mexico agreed not to send troops into the disputed territory between the two rivers, but President Polk later reneged on the agreement."},{"number":493,"term":"General Zachary Taylor","definition":"Commander of the Army of Occupation on the Texas border. On President Polk’s orders, he took the Army into the disputed territory between the Nueces and Rio Grande Rivers and built a fort on the north bank of the Rio Grande River. When the Mexican Army tried to capture the fort, Taylor’s forces engaged in is a series of engagements that led to the Mexican War. His victories in the war and defeat of Santa Ana made him a national hero."},{"number":494,"term":"Mexican War: causes, results","definition":"Causes: annexation of Texas, diplomatic ineptness of U.S./Mexican relations in the 1840's and particularly the provocation of U.S. troops on the Rio Grande. The first half of the war was fought in northern Mexico near the Texas border, with the U.S. Army led by Zachary Taylor. The second half of the war was fought in central Mexico after U.S. troops seized the port of Veracruz, with the Army being led by Winfield Scott. Results: U.S. captured Mexico City, Zachary Taylor was elected president, Santa Ana abdicated, and Mexico ceded large parts of the West, including New Mexico, Colorado, Utah, Arizona, Nevada and California, to the U.S."},{"number":495,"term":"Spot Resolutions","definition":"Congressman Abraham Lincoln supported a proposition to find the exact spot where American troops were fired upon, suspecting that they had illegally crossed into Mexican territory."},{"number":496,"term":"John C. Fremont","definition":"Civil governor of California, led the Army exploration to help Kearny. Heard that a war with Mexico was coming, thought he could take California by himself before the war began and become a hero. He failed, so he joined forces with Kearny."},{"number":497,"term":"General Winfield Scott","definition":"Led the U.S. forces' march on Mexico City during the Mexican War. He took the city and ended the war."},{"number":498,"term":"Treaty of Guadeloupe Hidalgo (1848)","definition":"This treaty required Mexico to cede the American Southwest, including New Mexico, Colorado, Utah, Arizona, Nevada and California, to the U.S. U.S. gave Mexico $15 million in exchange, so that it would not look like conquest."},{"number":499,"term":"All Mexico Movement","definition":"Benito Juarez overthrew Mexican dictator Santa Ana. Mexico began blocking American immigration (Mexico for Mexicans only)."},{"number":500,"term":"Mexican Cession","definition":"Some of Mexico's territory was added to the U.S. after the Mexican War: Arizona, New Mexico, California, Utah, Nevada & Colorado. (Treaty of Guadeloupe Hidalgo)"},{"number":501,"term":"Webster-Ashburton Treaty","definition":"1842 - Established Maine's northern border and the boundaries of the Great Lake states."},{"number":502,"term":"Carolina and Creole Affairs","definition":"A group of Canadian malcontents determined to free Canada from British rule made looting forays into Canada from an island being supplied by a ship from Carolina. The Canadians burned the vessel and killed an American on board. The Creole Affair involved slaves who mutinied and killed a crewman, then sailed to the Bahamas, where the British let them all go. The U.S. wanted the slaves back, but Britain refused. The ship stolen by the slaves was the Creole."},{"number":503,"term":"Aroostook War","definition":"Maine lumberjacks camped along the Aroostook Rive in Maine in 1839 tried to oust Canadian rivals. Militia were called in from both sides until the Webster Ashburn Treaty was signed. Took place in disputed territory."},{"number":504,"term":"John Jacob Astor (1763-1848)","definition":"His American fur company (est. 1808) rapidly became the dominant fur trading company in America. Helped finance the War of 1812. First millionaire in America (in cash, not land)."},{"number":505,"term":"Oregon Fever","definition":"1842 - Many Eastern and Midwestern farmers and city dwellers were dissatisfied with their lives and began moving up the Oregon trail to the Willamette Valley. This free land was widely publicized."},{"number":506,"term":"Willamette Valley","definition":"The spot where many settlers traveling along the Oregon trailed stopped."},{"number":507,"term":"Oregon Territory","definition":"The territory comprised what are now the states of Oregon and Washington, and portions of what became British Columbia, Canada. This land was claimed by both the U.S. and Britain and was held jointly under the Convention of 1818."},{"number":508,"term":"49th Parallel","definition":"The Oregon Treaty of 1846 established an U.S./Canadian (British) border along this parallel. The boundary along the 49th parallel extended from the Rocky Mountains to the Pacific Ocean."},{"number":509,"term":"Election of 1848","definition":"Zachary Taylor - Whig. Lewis Cass - Democrat. Martin Van Buren - Free Soil Party (Oregon issues). Taylor side-stepped the issue of slavery and allowed his military reputation to gain him victory. Cass advocated states' rights in the slavery issue. Free Soil Party wanted no slavery in Oregon."},{"number":510,"term":"Wilmot Proviso","definition":"When President Polk submitted his Appropriations Bill of 1846 requesting Congress' approval of the $2 million indemnity to be paid to Mexico under the Treaty of Guadeloupe Hidalgo, Pennsylvania Representative David Wilmot attached a rider which would have barred slavery from the territory acquired. The South hated the Wilmot Proviso and a new Appropriations Bill was introduced in 1847 without the Proviso. It provoked one of the first debates on slavery at the federal level, and the principles of the Proviso became the core of the Free Soil, and later the Republican, Party."},{"number":511,"term":"Gadsden Purchase (1853)","definition":"After the Treaty of Guadeloupe Hidalgo was signed, the U.S. realized that it had accidentally left portions of the southwestern stagecoach routes to California as part of Mexico. James Gadsden, the U.S. Minister to Mexico, was instructed by President Pierce to draw up a treaty that would provide for the purchase of the territory through which the stage lines ran, along which the U.S. hoped to also eventually build a southern continental railroad. This territory makes up the southern parts of Arizona and New Mexico."},{"number":512,"term":"Hegemony","definition":"Domination or leadership - especially the predominant influence of one state over others. Northern states seemed to be dominating Southern states."},{"number":513,"term":"\"Transportation Revolution\"","definition":"By the 1850s railroad transportation was fairly cheap and widespread. It allowed goods to be moved in large quantities over long distances, and it reduced travel time. This linked cities' economies together."},{"number":514,"term":"Commonwealth v. Hunt (1842)","definition":"Case heard by the Massachusetts supreme court. The case was the first judgment in the U.S. that recognized that the conspiracy law is inapplicable to unions and that strikes for a closed shop are legal. Also decided that unions are not responsible for the illegal acts of their members."},{"number":515,"term":"Boston Associates","definition":"The Boston Associates were a group of Boston businessmen who built the first power loom. In 1814 in Waltham, Massachusetts, they opened a factory run by Lowell. Their factory produced cloth so cheaply that women began to buy it rather than make it themselves."},{"number":516,"term":"Lowell Factory","definition":"Francis Cabot Lowell established a factory in 1814 at Waltham, Massachusetts. It was the first factory in the world to manufacture cotton cloth by power machinery in a building."},{"number":517,"term":"Factory girls","definition":"Lowell opened a chaperoned boarding house for the girls who worked in his factory. He hired girls because they could do the job as well as men (in textiles, sometimes better), and he did not have to pay them as much. He hired only unmarried women because they needed the money and would not be distracted from their work by domestic duties."},{"number":518,"term":"Cyrus McCormick, mechanical reaper","definition":"McCormick built the reaping machine in 1831, and it make farming more efficient. Part of the industrial revolution, it allowed farmers to substantially increase the acreage that could be worked by a single family; also made corporate farming possible."},{"number":519,"term":"Elias Howe (1819-1869)","definition":"Invented the sewing machine in 1846, which made sewing faster and more efficient."},{"number":520,"term":"Ten-Hour Movement","definition":"Labor unions advocated a 10-hour workday. Previously workers had worked from sunup to sundown."},{"number":521,"term":"Clipper ships","definition":"Long, narrow, wooden ships with tall masts and enormous sails. They were developed in the second quarter of the 1800s. These ships were unequalled in speed and were used for trade, especially for transporting perishable products from distant countries like China and between the eastern and western U.S."},{"number":522,"term":"Cyrus Field (1819-1892)","definition":"An American financier who backed the first telegraph cable across the Atlantic. After four failed attempts in 1857, 1858 and 1865, a submarine cable was successfully laid between Newfoundland and Ireland in July 1866."},{"number":523,"term":"Robert Fulton, steamships","definition":"A famous inventor, Robert Fulton designed and built America’s first steamboat, the Clermont in 1807. He also built the Nautilus, the first practical submarine."},{"number":524,"term":"Samuel F.B. Morse, telegraph","definition":"Morse developed a working telegraph which improved communications."},{"number":525,"term":"Walker Tariff","definition":"1846 - Sponsored by Polk's Secretary of Treasury, Robert J. Walker, it lowered the tariff. It introduced the warehouse system of storing goods until duty is paid."},{"number":526,"term":"Independent Treasury System, Van Buren and Polk","definition":"Meant to keep government out of banking. Vaults were to be constructed in various cities to collect and expand government funds in gold and silver. Proposed after the National Bank was destroyed as a method for maintaining government funds with minimum risk. Passed by Van Buren and Polk."},{"number":527,"term":"American Colonization Society","definition":"Created in 1817 to encourage the voluntary migration of free African Americans to Africa. Between 1821 and 1847 the group sponsored several thousand migrants to what would become Liberia. Group was criticized by prominent abolitionists and many African Americans."},{"number":528,"term":"Abolitionism","definition":"The militant effort to do away with slavery rooted in the North in the 1700s. It became a major issue in the 1830s and dominated politics after 1840. Congress became a battleground between pro and anti-slavery forces from the 1830's to the Civil War."},{"number":529,"term":"Sectionalism","definition":"Different parts of the country developing unique and separate cultures (as the North, South and West). This can lead to conflict."},{"number":530,"term":"William Lloyd Garrison (1805-1879)","definition":"A militant abolitionist, he came editor of the Boston publication, The Liberator, in 1831. Under his leadership, The Liberator gained national fame and notoriety due to his quotable and inflammatory language, attacking everything from slave holders to moderate abolitionists, and advocating northern secession."},{"number":531,"term":"The Liberator","definition":"A militantly abolitionist weekly, edited by William Garrison from 1831 to 1865. Despite having a relatively small circulation, it achieved national notoriety due to Garrison's strong arguments."},{"number":532,"term":"American Anti-slavery Society","definition":"Formed in 1833, a major abolitionist organization in the North."},{"number":533,"term":"Theodore Weld (1802-1895)","definition":"Weld was devoted to the abolitionism movement. He advised the breakaway anti-slavery Whigs in Congress and his anonymous tract \"American Slavery as It Is\" (1839) was the inspiration for Uncle Tom's Cabin."},{"number":534,"term":"Theodore Parker (1810-1860)","definition":"A leading transcendentalist radical, he became known as \"the keeper of the public's conscience\". His advocating for social reform often put him in physical danger, though his causes later became popular."},{"number":535,"term":"The Grimke sisters","definition":"Angelina and Sarah Grimke wrote and lectured vigorously on reform causes such as prison reform, the temperance movement, and the abolitionist movement."},{"number":536,"term":"Elijah Lovejoy (1802-1837)","definition":"An abolitionist and editor. The press he used was attacked four time and Lovejoy was killed defending it. His death was an example of violence against abolitionists."},{"number":537,"term":"Nat Turner's Insurrection (1831)","definition":"Slave uprising. A group of 60 enslaved people led by Nat Turner, who believed he was a divine instrument sent to free his people, killed almost 60 white residents in South Hampton, Virginia. This led to a sensational manhunt in which 100 black people (both enslaved and free) were killed. As a result, slave states strengthened measures against the enslaved and became more united in their support of fugitive slave laws."},{"number":538,"term":"David Walker (1785-1830), \"Walker's Appeal\"","definition":"A Boston free black man who published papers against slavery."},{"number":539,"term":"Sojourner Truth","definition":"Name used by Isabelle Baumfree, one of the best-known abolitionists of her day. She was the first black woman orator to speak out against slavery."},{"number":540,"term":"Gabriel Prosser (1775-1800)","definition":"A slave, he planned a revolt to make Virginia a state for Blacks. He organized about 1,000 slaves who met outside Richmond the night of August 30, 1800. They had planned to attack the city, but the roads leading to it were flooded. The attack was delayed, and a slave owner found out about it. Twenty-five men were hanged, including Gabriel."},{"number":541,"term":"Denmark Vesey","definition":"A former slave who inspired a group of slaves to seize Charleston, South Carolina in 1822, but one of them betrayed him and he and his thirty-seven followers were hanged before the revolt started."},{"number":542,"term":"Frederick Douglass (1817-1895)","definition":"A self-educated slave who escaped in 1838, Douglas became the best-known abolitionist speaker. He edited an anti-slavery weekly, the North Star."},{"number":543,"term":"Tredegar Iron Works, Richmond, Virginia","definition":"An iron mill in Richmond. It was run by skilled slave labor and was among the best iron foundry in the nation. It kept the Confederacy alive until 1863 as its only supplier of cannons. It was also the major munitions supplier of the South and was directly responsible for the capitol of the Confederacy being moved to Richmond."},{"number":544,"term":"Prigg v. Pennsylvania (1842)","definition":"A slave had escaped from Maryland to Pennsylvania, where a federal agent captured him and returned him to his owner. Pennsylvania indicted the agent for kidnapping under the fugitive slave laws. The Supreme Court ruled it was unconstitutional for bounty hunters or anyone but the owner of an escaped slave to apprehend that slave, thus weakening the fugitive slave laws."},{"number":545,"term":"\"King Cotton\"","definition":"Expression used by Southern authors and orators before the Civil War to indicate the economic dominance of the Southern cotton industry, and that the North needed the South's cotton. In a speech to the Senate in 1858, James Hammond declared, \"You daren't make war against cotton! ...Cotton is king!\"."},{"number":546,"term":"Free Soil Party","definition":"Formed in 1847 - 1848, dedicated to opposing slavery in newly acquired territories such as Oregon and ceded Mexican territory."},{"number":547,"term":"John Sutter (1803-1880)","definition":"A German immigrant who was instrumental in the early settlement of California by Americans, he had originally obtained his lands in Northern California through a Mexican grant. Gold was discovered by workmen excavating to build a sawmill on his land in the Sacramento Valley in 1848, touching off the California gold rush."},{"number":548,"term":"Forty-Niners","definition":"Easterners who flocked to California after the discovery of gold there. They established claims all over northern California and overwhelmed the existing government. Approximately 90,000 arrived in California in 1849. Later won five Superbowls."},{"number":549,"term":"California applies for admission as a state","definition":"Californians were so eager to join the union that they created and ratified a constitution and elected a government before receiving approval from Congress. California was split down the middle by the Missouri Compromise line, so there was a conflict over whether it should be slave or free."},{"number":550,"term":"Compromise of 1850","definition":"Called for the admission of California as a free state, organizing Utah and New Mexico without restrictions on slavery, adjustment of the Texas/New Mexico border, abolition of slave trade in District of Columbia, and tougher fugitive slave laws. Its passage was hailed as a solution to the threat of national division."},{"number":551,"term":"Fugitive Slave Law","definition":"Enacted by Congress in 1793 and 1850, these laws provided for the return of escaped slaves to their owners. The North was lax about enforcing the 1793 law, with irritated the South no end. The 1850 law was tougher and was aimed at eliminating the underground railroad."},{"number":552,"term":"Anthony Burns (1834-1862)","definition":"A slave who fled from Virginia to Boston in 1854. Attempts to return him led to unrest in Boston. He was successfully returned at a cost $100,000. He was bought a few months later by a Boston group intent on setting him free."},{"number":553,"term":"Ablemann v. Booth (1859)","definition":"Sherman Booth was sentenced to prison in a federal court for assisting in a fugitive slave's rescue in Milwaukee. He was released by the Wisconsin Supreme Court on the grounds that the Fugitive Slave Act was unconstitutional. The Supreme Court overturned this ruling. It upheld both the constitutionality of the Fugitive Slave Act and the supremacy of federal government over state government."},{"number":554,"term":"Webster's 7th of March Speech","definition":"Daniel Webster, a Northerner and opposed to slavery, spoke before Congress on March 7, 1850. During this speech, he envisioned that the legacy of the fugitive slave laws would be to divide the nation over the issue of slavery."},{"number":555,"term":"Nashville Convention","definition":"Meeting of representatives from nine slave states to determine a course of action if the Federal government banned slavery in the territories. Potential secession was discussed, but moderates held sway and the issue was tabled."},{"number":556,"term":"Henry Clay (1777-1852)","definition":"Possibly the most influential American politician who was not President, Clay was the author of the Compromise of 1850."},{"number":557,"term":"John C. Calhoun","definition":"Formerly Jackson's vice-president, later a South Carolina senator. He said the North should grant the South's demands and keep quiet about slavery to keep the peace. He was a spokesman for the South and states' rights."},{"number":558,"term":"Underground Railroad","definition":"A secret, shifting network which aided slaves escaping to the North and Canada, mainly after 1840."},{"number":559,"term":"Harriet Tubman (1821-1913)","definition":"A former escaped slave, she was one of the shrewdest conductors of the underground railroad, leading 300 slaves to freedom."},{"number":560,"term":"Uncle Tom's Cabin, Harriet Beecher Stowe","definition":"She wrote the abolitionist book, Uncle Tom's Cabin. It helped to crystallize the rift between the North and South. It has been called the greatest American propaganda novel ever written and helped to bring about the Civil War."},{"number":561,"term":"Election of 1852: end of the Whig party","definition":"By this time the Whig party was so weakened that the Democrats swept Franklin Pierce into office by a huge margin. Eventually the Whigs became part of the new Republican party."},{"number":562,"term":"Perry and Japan","definition":"Commodore Matthew Perry went to Japan to open trade between it and the U.S. In 1853, his armed squadron anchored in Tokyo Bay as a show of force (foreign ships were restricted by the Japanese to only land in Nagasaki). Facing internal indecision due to the illness of the ruling Shogun, the Japanese government accepted a letter from Perry indicating that the US fleet would open fire if any attempt to remove them was made, and demanding American access to Japanese harbors for trade. After delivering the letter, Perry left Japan and returned in 1854 with more ships and men. At that time the Convention of Kanagawa was signed, opening two ports to US trade."},{"number":563,"term":"Ostend Manifesto","definition":"The recommendation that the U.S. offer Spain $20 million for Cuba. It was not carried through in part because the North feared Cuba would become another slave state."},{"number":564,"term":"Kansas - Nebraska Act","definition":"1854 - This act repealed the Missouri Compromise and established a doctrine of congressional nonintervention in the territories. Popular sovereignty (vote of the people) would determine whether Kansas and Nebraska would be slave or free states."},{"number":565,"term":"Birth of the Republican Party","definition":"A coalition of the Free Soil Party, the Know-Nothing Party and renegade Whigs merged in 1854 to form the Republican Party, a liberal, anti-slavery party. The party's Presidential candidate, John C. Fremont, captured one-third of the popular vote in the 1856 election."},{"number":566,"term":"Stephen A. Douglas","definition":"A moderate, who introduced the Kansas-Nebraska Act in 1854 and popularized the idea of popular sovereignty."},{"number":567,"term":"Popular Sovereignty","definition":"The doctrine that stated that the people of a territory had the right to decide their own laws by voting. In the Kansas-Nebraska Act, popular sovereignty would decide whether a territory allowed slavery."},{"number":568,"term":"Thirty-Six, Thirty Line","definition":"According to the Missouri Compromise (1820), slavery was forbidden in the Louisiana territory north of the 36º30' N latitude. This was nullified by the Kansas-Nebraska Act."},{"number":569,"term":"Election of 1856: Republican Party, Know-Nothing Party","definition":"Democrat - James Buchanan (won by a narrow margin). Republican - John Fremont. Know-Nothing Party and Whig - Millard Fillmore. First election for the Republican Party. KnowNothings opposed immigration and Catholic influence. They answered questions from outsiders about the party by saying \"I know nothing\"."},{"number":570,"term":"\"Bleeding Kansas\"","definition":"Also known as the Kansas Border War. Following the passage of the Kansas-Nebraska Act, proslavery forces from Missouri, known as the Border Ruffians, crossed the border into Kansas and terrorized and murdered antislavery settlers. Antislavery sympathizers from Kansas carried out reprisal attacks, the most notorious of which was John Brown's 1856 attack on the settlement at Pottawatomie Creek. The war continued for four years before the antislavery forces won. The violence it generated helped precipitate the Civil War."},{"number":571,"term":"Lawrence, Kansas","definition":"Where the pro-slavery /anti-slavery war in Kansas began (\"Bleeding Kansas or Kansas Border War)."},{"number":572,"term":"\"Beecher's Bibles\"","definition":"During the Kansas border war, the New England Emigrant Aid Society sent rifles at the instigation of fervid abolitionists like the preacher Henry Beecher. These rifles became known as \"Beecher's Bibles\"."},{"number":573,"term":"Pottawatomie Massacre (1856)","definition":"Following the sacking of the free-state capital of Lawrence, Kansas by pro-slave militia, militant abolitionist John Brown led a party of seven in Kansas that killed 5 pro-slavery settlers. This action helped make the Kansas border war a national issue."},{"number":574,"term":"John Brown's Raid (1859)","definition":"In 1859, the militant abolitionist John Brown seized the U.S. arsenal at Harper's Ferry, Virginia. The raid was the first step in an attempt to spark a massive slave uprising and from which Brown hoped to form a rebel army that would harass and attack slaveholders throughout the South. Brown was captured by military forces commanded by then Colonel Robert E. Lee and executed for treason by the state of Virginia."},{"number":575,"term":"New England Emigrant Aid Company","definition":"Promoted anti-slavery migration to Kansas. The movement encouraged 2600 people to move."},{"number":576,"term":"Sumner-Brooks Affair (1856)","definition":"Charles Sumner gave a two day speech on the Senate floor. He denounced the South for crimes against Kansas and singled out Senator Andrew Butler of South Carolina for extra abuse. Preston Brooks, a relation of Butler and a Congressman from South Carolina, took offence at the remarks. Brooks entered the Senate chamber, while the Senate was in session, found Sumner and beat him severely over the head with his cane, severely crippling him. Brooks was feted by the South for upholding Southern honor, while Sumner was glorified as a martyr to the Republican cause in the North."},{"number":577,"term":"Lecompton Constitution","definition":"The pro-slavery constitution suggested for Kansas' admission to the union. It was rejected."},{"number":578,"term":"Dred Scott v. Sandford (1857)","definition":"A Missouri slave sued for his freedom, claiming that his four year stay in the northern portion of the Louisiana Territory made free land by the Missouri Compromise had made him a free man. The U.S. Supreme Court decided he could not sue in federal court because he was property, not a citizen."},{"number":579,"term":"Chief Justice Roger B. Taney (pronounced \"Tawny\")","definition":"As chief justice, he wrote the important decision in the Dred Scott case, upholding police power of states and asserting the principle of social responsibility of private property. He was Southern and upheld the fugitive slave laws."},{"number":580,"term":"Lincoln-Douglas debates of 1858 during Illinois Senatorial campaign","definition":"A series of seven debates. The two argued the important issues of the day like popular sovereignty, the Lecompton Constitution, and the Dred Scott decision. Douglas won these debates, but Lincoln's position in these debates helped him beat Douglas in the 1860 presidential election."},{"number":581,"term":"Freeport Doctrine","definition":"During the Lincoln-Douglas debates, Douglas said in his Freeport Doctrine that Congress could not force a territory to become a slave state against its will. This is the foundation for Douglas’ “popular sovereignty” for the territories argument."},{"number":582,"term":"Panic of 1857","definition":"Began with the failure of the Ohio Life Insurance Company and spread to the urban east. The depression affected the industrial east and the wheat belt more than the South."},{"number":583,"term":"George Fitzhugh, Sociology for the South, or the Failure of Free Society","definition":"The most influential propagandist in the decade before the Civil War. In his Sociology (1854), he said that the capitalism of the North was a failure. In another writing he argued that slavery was justified when compared to the cannibalistic approach of capitalism. Tried to justify slavery."},{"number":584,"term":"Hinton Helper, The Impending Crisis of the South","definition":"Hinton Helper of North Carolina spoke for poor, non-slave-owing Whites in his 1857 book, which was a violent attack on slavery. It was not written with sympathy for Blacks, who Helper despised, but with a belief that the economic system of the South was bringing ruin on the small farmer."},{"number":585,"term":"Lincoln's \"House Divided\" speech","definition":"In his acceptance speech for his nomination to the Senate in June 1858, Lincoln paraphrased from the Bible: \"A house divided against itself cannot stand.\" He continued, \"I do not believe this government can continue half slave and half free, I do not expect the Union to be dissolved - I do not expect the house to fall - but I do believe it will cease to be divided.\""},{"number":586,"term":"Election of 1860: candidates, parties, issues","definition":"Republican - Abraham Lincoln. Democrat - Stephan A. Douglas, John C. Breckenridge. Constitutional Union - John Bell. Issues were slavery in the territories (Lincoln opposed adding any new slave states)."},{"number":587,"term":"Democratic Party Conventions: Baltimore, Charleston","definition":"The Democratic Party split North and South. The Northern Democratic convention was held in Baltimore and the Southern in Charleston. Douglas was the Northern candidate and Breckenridge was the Southern (they disagreed on slavery)."},{"number":588,"term":"John Bell","definition":"He was a moderate and wanted the union to stay together. After Southern states seceded from the Union, he urged the middle states to join the North."},{"number":589,"term":"John Breckinridge (1821-1875)","definition":"Nominated by pro-slavers who had seceded from the Democratic convention, he was strongly for slavery and states' rights."},{"number":590,"term":"Republican Party: 1860 platform, supporter, leaders","definition":"1860 platform: free soil principles, a protective tariff. Supporters: anti-slavers, business, agriculture. Leaders: William M. Seward, Carl Shultz."},{"number":591,"term":"Buchanan and the Secession Crisis","definition":"After Lincoln was elected, but before he was inaugurated, seven Southern states seceded. Buchanan, the lame duck president, decided to leave the problem for Lincoln to take care of."},{"number":592,"term":"Crittenden Compromise proposal","definition":"A desperate measure to prevent the Civil War, introduced by John Crittenden, Senator from Kentucky, in December 1860. The bill offered a Constitutional amendment recognizing slavery in the territories south of the 36º30' line, noninterference by Congress with existing slavery, and compensation to the owners of fugitive slaves. Republicans, on the advice of Lincoln, defeated it."},{"number":593,"term":"Border states","definition":"States bordering the North: Delaware, Maryland, Kentucky, and Missouri. They were slave states but did not secede."},{"number":594,"term":"South's advantages in the Civil War","definition":"Large land areas with long coasts, could afford to lose battles, and could export cotton for money. They were fighting a defensive war and only needed to keep the North out of their states to win. Started with more of the nation’s experienced military commanders, and most of the existing military equipment and supplies."},{"number":595,"term":"North's advantages in the Civil War","definition":"Larger numbers of troops, superior navy, better transportation, overwhelming financial and industrial reserves to create munitions and supplies, which eventually outstripped the South's initial material advantage."},{"number":596,"term":"Fort Sumter","definition":"Site of the opening engagement of the Civil War. On December 20, 1860, South Carolina had seceded from the Union, and had demanded that all federal property in the state be surrendered to state authorities. Major Robert Anderson concentrated his units at Fort Sumter, and, when Lincoln took office on March 4, 1861, Sumter was one of only two forts in the South still under Union control. Learning that Lincoln planned to send supplies to reinforce the fort, on April 11, 1861, Confederate General Beauregard demanded Anderson's surrender, which was refused. On April 12, 1861, the Confederate Army began bombarding the fort, which surrendered on April 14, 1861. Congress declared war on the Confederacy the next day."},{"number":597,"term":"Bull Run","definition":"At Bull Run, a creek, Confederate soldiers charged Union men who were enroute to besiege Richmond. Union troops fled back to Washington. Confederates did not realize their victory in time to follow up on it. First major battle of the Civil War - both sides were ill-prepared."},{"number":598,"term":"Monitor and the Merrimac","definition":"First engagement ever between two iron-clad naval vessels. The two ships battled in a portion of the Chesapeake Bay known as Hampton Roads for five hours on March 9, 1862, ending in a draw. Monitor - Union. Merrimac - Confederacy. Historians use the name of the original ship Merrimac on whose hull the Southern ironclad was constructed, even though the official Confederate name for their ship was the CSS Virginia."},{"number":599,"term":"Generals Lee, Jackson","definition":"General Robert E. Lee and General Thomas \"Stonewall\" Jackson were the most noted generals in the Confederacy. Jackson was known for ability to maneuver armies quickly over large distances. Lee was given overall command of the Army of Northern Virginia, the CSA’s largest army and the one tasked with defending the capital at Richmond."},{"number":600,"term":"Generals Grant, McClellan, Sherman and Meade","definition":"McClellan: built and trained the Union army largely from scratch; unsuccessful as a field commander; run as candidate for president against Lincoln in 1864. Grant: Achieved success in the western theater (along the Mississippi); promoted to overall battle command of Union armies; defeated Lee during 13 month-long Overland Campaign; accepted Lee’s surrender at Appomattox Courthouse. Sherman: general under Grant; routed Confederacy from Tennessee; conducted infamous “March to the Sea” through Georgia."},{"number":601,"term":"Vicksburg, Gettysburg, Antietam, Appomattox","definition":"Battle sites of the Civil War. Gettysburg - 90,000 soldiers under Meade vs. 76,000 under Lee, lasted three days and the North won. Vicksburg - besieged by Grant and surrendered after six months. Antietam - turning point of the war and a much-needed victory for Lincoln. Appomattox - Lee surrendered to Grant."},{"number":602,"term":"Jefferson Davis, Alexander Stephens","definition":"Davis was chosen as president of the Confederacy in 1861. Stephens was vice-president."},{"number":603,"term":"Northern blockade","definition":"Starting in 1862, the North began to blockade the Southern coast in an attempt to force the South to surrender. The Southern coast was so long that it could not be completely blockaded."},{"number":604,"term":"Copperheads","definition":"Lincoln believed that anti-war Northern Democrats harbored traitorous ideas and he labeled them \"Copperheads\", poisonous snakes waiting to get him."},{"number":605,"term":"Congressman Clement L. Vallandigham","definition":"An anti-war Democrat who criticized Lincoln as a dictator, called him \"King Abraham\". He was arrested and exiled to the South."},{"number":606,"term":"Suspension of habeas corpus","definition":"Lincoln suspended this writ, which states that a person cannot be arrested without probable cause and must be informed of the charges against him and be given an opportunity to challenge them. Throughout the war, thousands were arrested for disloyal acts. Although the U.S. Supreme Court eventually held the suspension edict to be unconstitutional, by the time the Court acted the Civil War was nearly over."},{"number":607,"term":"Republican legislation passed in Congress after Southerners left","definition":"banking, tariff, homestead, transcontinental railroad -- With no Southerners to vote them down, the Northern Congressman passed all the bills they wanted to. Led to the industrial revolution in America."},{"number":608,"term":"New York City Draft Riots","definition":"Initially begun as anger over draft laws which allowed the wealthy to purchase exemptions ($300). Irish immigrant working class laborers protested violently against the law; ultimately turned in a race issue as white Irish attacked Black labors throughout the city, resentful over job competition. After two days the Army arrived to restore order. The official death toll was 120 people."},{"number":609,"term":"Emancipation Proclamation","definition":"September 22, 1862 - Lincoln freed all slaves in the states that had seceded, after the Northern victory at the Battle of Antietam. Also included promised of employment for any formerly enslaved who wished paying jobs with the US military."},{"number":610,"term":"Charles Francis Adams","definition":"Minister to Great Britain during the Civil War, he wanted to keep Britain from entering the war on the side of the South."},{"number":611,"term":"Election of 1864: candidates, parties","definition":"Lincoln ran against Democrat General McClellan. Lincoln won 212 electoral votes to 21, but the popular vote was much closer. (Lincoln had fired McClellan from his position in the war.)"},{"number":612,"term":"Financing of the war effort by North and South","definition":"The North was much richer than the South, and financed the war through loans, treasury notes, taxes, and duties on imported goods. The South had financial problems because they printed their Confederate notes without backing them with gold or silver."},{"number":613,"term":"Clara Barton","definition":"Launched the American Red Cross in 1881. An \"angel\" in the Civil War, she treated the wounded in the field."},{"number":614,"term":"Lincoln's Ten Percent Plan","definition":"Former Confederate states would be readmitted to the Union if 10% of their citizens took a loyalty oath and the state agreed to ratify the 13th Amendment which outlawed slavery. Not put into effect because Lincoln was assassinated."},{"number":615,"term":"Assassination of April 14, 1865","definition":"While sitting in his box at Ford's Theatre watching \"Our American Cousin\", President Lincoln was shot by John Wilkes Booth."},{"number":616,"term":"John Wilkes Booth","definition":"An actor, planned with others for six months to abduct Lincoln at the start of the war, but they were foiled when Lincoln did not arrive at the scheduled place. April 14, 1865, he shot Lincoln at Ford's Theatre and cried, \"Sic Semper Tyrannis!\" (\"Thus always to tyrants!\") When he jumped down onto the stage his spur caught in the American flag draped over the balcony and he fell and broke his leg. He escaped on a waiting horse and fled town. He was found several days later in a barn. He refused to come out; the barn was set on fire. Booth was shot, either by himself or a soldier."},{"number":617,"term":"Ex Parte Milligan (1866)","definition":"Supreme Court ruled that military trials of civilians were illegal unless the civil courts are inoperative, or the region is under marshal law."},{"number":618,"term":"Radical Republicans","definition":"After the Civil War, a group that believed the South should be harshly punished and thought that Lincoln was sometimes too compassionate towards the South."},{"number":619,"term":"Wade-Davis Bill, veto, Wade-Davis Manifesto","definition":"1864 - Bill declared that the Reconstruction of the South was a legislative, not executive, matter. It was an attempt to weaken the power of the president. Lincoln vetoed it. Wade-Davis Manifesto said Lincoln was acting like a dictator by vetoing the bill."},{"number":620,"term":"Reconstruction Acts (1867)","definition":"Pushed through congress over Johnson's veto, it gave radical Republicans complete military control over the South and divided the South into five military zones, each headed by a general with absolute power over his district."},{"number":621,"term":"State suicide theory","definition":"The Southern states had relinquished their rights when they seceded. This, in effect, was suicide. This theory was used to justify the North taking military control of the South."},{"number":622,"term":"Conquered territory theory","definition":"Stated that conquered Southern states were not part of the Union, but were instead conquered territory, which the North could deal with however they like."},{"number":623,"term":"The unreconstructed South","definition":"The South's infrastructure had been destroyed - manufacturing had almost ceased. Few banks were solvent and in some areas starvation was imminent. General Sherman had virtually destroyed large areas on his \"march to the sea\"."},{"number":624,"term":"Black codes","definition":"Restrictions on the freedom of former slaves, passed by Southern governments."},{"number":625,"term":"Texas v. White (1869)","definition":"Argued that Texas had never seceded because there is no provision in the Constitution for a state to secede, thus Texas should still be a state. Established the precedent that secession was definitively unconstitutional."},{"number":626,"term":"Thaddeus Stevens","definition":"A radical Republican who advocated for the abolition of slavery and for redistribution of wealth to freed African Americans. Was co-chair of the Committee of 15 (Joint Committee on Reconstruction) overseeing Congressional Reconstruction, authored the legislation dividing the South into military districts, and introduced the Tenure of Office Act leading to the impeachment of President Johnson."},{"number":627,"term":"Charles Sumner","definition":"The same Senator who had been caned by Brooks in 1856, Sumner returned to the Senate after the outbreak of the Civil War. He was the formulator of the state suicide theory, and supporter of emancipation. He was an outspoken radical Republican involved in the impeachment of Andrew Johnson."},{"number":628,"term":"Andrew Johnson (1808-1875)","definition":"A Southerner from Tennessee, as V.P. when Lincoln was killed, he became president. He opposed radical Republicans who passed Reconstruction Acts over his veto. The first U.S. president to be impeached, he survived the Senate removal by only one vote."},{"number":629,"term":"Freedmen's Bureau","definition":"Established in 1865, it was an agency set up to aid emancipated African Americans in adjusting themselves to freedom. First federal government welfare agency, the bureau provided food assistance, education, and job assistance to freedmen."},{"number":630,"term":"Ku Klux Klan","definition":"White-supremacist group formed by six former Confederate officers after the Civil War. Name is essentially Greek for \"Circle of Friends\". Group turned to terrorist attacks on Black people and white people in the South who advocated for Reconstruction. The original Klan was disbanded in 1869 after intensive targeting by the federal government at the direction of President Grant. The second incarnation of the KKK began in 1915 and the third incarnation emerged in the 1950s in response to the Civil Rights movement."},{"number":631,"term":"Civil Rights Act of 1866","definition":"Declared that all people born in the United States were citizens and possessed certain unalienable rights such as right to contract, own property, sue in court, and were fully protected by federal laws."},{"number":632,"term":"Thirteenth Amendment (1865)","definition":"Bans slavery within the United States (or anywhere under US control)."},{"number":633,"term":"Fourteenth Amendment (1868)","definition":"Inserted provisions of the Civil Rights Act into the Constitution; defines full citizenship for all native-born or naturalized Americans, including former slaves and immigrants. Also asserts requirement for states to follow due process and equal protection of the law."},{"number":634,"term":"Fifteenth Amendment (1870)","definition":"No one could be denied the right to vote on account of race, color or having been a slave. It was to prevent states from amending their constitutions to deny black suffrage."},{"number":635,"term":"Tenure of Office Act (1866)","definition":"Enacted by radical Congress, it forbade the president from removing civil officers without consent of the Senate. It was meant to prevent Johnson from removing radicals from office. Johnson broke this law when he fired a radical Republican from his cabinet, and he was impeached for this \"crime\"."},{"number":636,"term":"Impeachment Process","definition":"A process for removing an elected or appointed official from office. The Constitution asserts that the House of Representatives can impeach with a simple majority vote and the Senate then can remove the official with a 2/3 majority vote. Johnson was impeached by the House but avoided removal by one vote in the Senate."},{"number":637,"term":"Secretary of War Stanton","definition":"As Secretary of War, Edwin M. Stanton acted as a spy for the radicals in cabinet meetings. President Johnson asked him to resign in 1867. The dismissal of Stanton let to the impeachment of Johnson because Johnson had broken the Tenure of Office Law."},{"number":638,"term":"Scalawags","definition":"A derogatory term for Southerners who were working with the North to buy up land from desperate Southerners. Also refers to Southern whites who joined the Republican party."},{"number":639,"term":"Carpetbaggers","definition":"A derogatory term applied to Northerners who migrated south during the Reconstruction to take advantage of opportunities to advance their own fortunes by buying up land from desperate Southerners and by manipulating new black voters to obtain lucrative government contracts."},{"number":640,"term":"Purchase of Alaska","definition":"In December 1866, the U.S. offered to take Alaska from Russia. Russia was eager to give it up, as the fur resources had been exhausted, and, expecting friction with Great Britain, they preferred to see defenseless Alaska in U.S. hands. Called \"Seward's Folly\" and \"Seward's Icebox\", the purchase was made in 1867 for $7,200,000 and gave the U.S. Alaska's resources of fish, timber, oil, and gold."},{"number":641,"term":"Secretary of State William Seward","definition":"Served in both Lincoln’s and Johnson’s cabinets. An eager expansionist, he was the energetic supporter of the Alaskan purchase and negotiator of the deal often called \"Seward's Folly\" because Alaska was not fit for settlement or farming."},{"number":642,"term":"Napoleon III","definition":"Nephew of Napoleon Bonaparte, and elected emperor of France from 1852-1870, he invaded Mexico when the Mexican government could not repay loans from French bankers. He sent in an army and set up a new government under Maximillian. He refused Lincoln's request that France withdraw. After the Civil War, the U.S. sent an army to enforce the request and Napoleon withdrew."},{"number":643,"term":"Maximillian in Mexico","definition":"European prince appointed by Napoleon III of France to lead the new government set up in Mexico. After the Civil War, the U.S. invaded and he was executed, a demonstration of the enforcement of the Monroe Doctrine to European powers."},{"number":644,"term":"Monroe Doctrine (1823)","definition":"Declared that Europe should not interfere in the affairs of the Western Hemisphere and that any attempt at interference by a European power would be seen as a threat to the U.S. It also declared that a New World colony which has gained independence may not be re-colonized by Europe. (It was written at a time when many South American nations were gaining independence). Originally, it was England’s support of the doctrine which gave in credence. With the US unable to adequately enforce the doctrine in 1823, it was mostly just a show of nationalism, The doctrine had no major impact until later in the 1800s."},{"number":645,"term":"Ulysses S. Grant","definition":"U.S. president 1873-1877. Military hero of the Civil War, he led a corrupt administration, consisting of friends and relatives. Although Grant was personally a very honest and moral man, his administration was considered the most corrupt the U.S. had had at that time."},{"number":646,"term":"Treaty of Washington (1871)","definition":"Settled the Northern claims between the U.S. and Great Britain. Canada gave the U.S. permanent fishing rights on the St. Lawrence River."},{"number":647,"term":"Secretary of State Hamilton Fish","definition":"A member of the Grant administration, he was an able diplomat who peacefully settled conflicts with Great Britain through the Treaty of Washington."},{"number":648,"term":"Election of 1872: Liberal Republicans, Horace Greeley","definition":"Liberal Republicans sought honest government and nominated Greeley as their candidate. The Democratic Party had also chosen Greeley. Regular Republicans re-nominated Grant. The Republicans relied upon the Black vote to gain victory for Grant."},{"number":649,"term":"Election of 1876: Hayes and Tilden","definition":"Rutherford B. Hayes - liberal Republican, Civil War general, he received only 165 electoral votes. Samuel J. Tilden - Democrat, received 264,000 more popular votes that Hayes, and 184 of the 185 electoral votes needed to win. 20 electoral votes were disputed, and an electoral commission decided that Hayes was the winner - fraud was suspected."},{"number":650,"term":"Compromise of 1877","definition":"Hayes promised to show concern for Southern interests and end Reconstruction in exchange for the Democrats accepting the disputed election results. He took Union troops out of the South."},{"number":651,"term":"Solid South","definition":"Term applied to the one-party (Democratic) system of the South following the Civil War. For 100 years after the Civil War, the South voted Democratic in every presidential election."},{"number":652,"term":"Sharecropping, Crop Lien System","definition":"Sharecropping provided the necessities for Black farmers. Storekeepers granted credit until the farm was harvested. To protect the creditor, the storekeeper took a mortgage, or lien, on the tenant's share of the crop. The system was abused, and uneducated Black people were taken advantage of. The results, for African Americans, was not unlike slavery."},{"number":653,"term":"Segregation","definition":"Racial separation, mostly in the South, in public facilities, transportation, schools, etc."},{"number":654,"term":"Hiram R. Revels","definition":"Free black born in North Carolina. Elected to the Senate by the Mississippi state legislature in 1870. First African American to serve in Congress."},{"number":655,"term":"Prigg v. Pennsylvania (1842)","definition":"A slave had escaped from Maryland to Pennsylvania, where a federal agent captured him and returned him to his owner. Pennsylvania indicted the agent for kidnapping under the fugitive slave laws. The Supreme Court ruled it was unconstitutional for bounty hunters or anyone but the owner of an escaped slave to apprehend that slave, thus weakening the fugitive slave laws."},{"number":656,"term":"Ablemann v. Booth (1859)","definition":"Sherman Booth was sentenced to prison in a federal court for assisting in a fugitive slave's rescue in Milwaukee. He was released by the Wisconsin Supreme Court on the grounds that the Fugitive Slave Act was unconstitutional. The Supreme Court overturned this ruling. It upheld both the constitutionality of the Fugitive Slave Act and the supremacy of federal government over state government."},{"number":657,"term":"Mississippi v. Johnson (1867)","definition":"Mississippi wanted the president to stop enforcing the Reconstruction Acts because they were unconstitutional. The Supreme Court decided that the Acts were constitutional, and the states must obey them."},{"number":658,"term":"Whiskey Ring","definition":"During the Grant administration, a group of officials were importing whiskey and using their offices to avoid paying the taxes on it, cheating the treasury out of millions of dollars."},{"number":659,"term":"\"Waving the bloody shirt\"","definition":"The practice of reviving unpleasant memories from the past. Representative Ben F. Butler waved before the House a bloodstained nightshirt of a carpetbagger flogged by Klan members. Often applied to election campaigns, particularly by Republicans who had served during the Civil War."},{"number":660,"term":"Liberal Republicans: Carl Schurz, Horace Greeley","definition":"Schurz and Greeley were liberal republicans - they believed in civil service reform, opposed corruption, wanted lower tariffs, and were lenient toward the South."},{"number":661,"term":"Panic of 1873","definition":"Unrestrained speculation on the railroads let to disaster - inflation and strikes by railroad workers. 18,000 businesses failed and 3 million people were out of work."},{"number":662,"term":"Greenbacks","definition":"Name given to paper money issued by the government during the Civil War, so called because the back side was printed with green ink. They were not redeemable for gold, but $300 million were issued anyway. Farmers hit by the depression wanted to inflate the notes to cover losses, but Grant vetoed an inflation bill and greenbacks were added to permanent circulation. In 1879 the federal government finally made greenbacks redeemable for gold."},{"number":663,"term":"Ohio Idea","definition":"In 1867 Senator George H. Pendleton proposed an idea that Civil War bonds be redeemed with greenbacks. It was not adopted."},{"number":664,"term":"Legal Tender Cases","definition":"In a series of cases the US Supreme Court held that the federal government could issue paper currency (greenbacks)."},{"number":665,"term":"Species Resumption Act (1879)","definition":"Congress said that greenbacks were redeemable for gold, but no one wanted to redeem them for face gold value. Because paper money was much more convenient than gold, they remained in circulation."},{"number":666,"term":"Greenbacks - Labor Party","definition":"Founded in 1878, the party was primarily composed of prairie farmers who went into debt during the Panic of 1873. The Party fought for increased monetary circulation through issuance of paper currency and bimetallism (using both gold and silver as legal tender), supported inflationary programs in the belief that they would benefit debtors, and sought benefits for labor such as shorter working hours and a national labor bureau. They had the support of several labor groups and they wanted the government to print more greenbacks."},{"number":667,"term":"Pendleton Civil Service Act","definition":"1883 - The first federal regulatory commission. Office holders would be assessed on a merit basis to be sure they were fit for duty. Brought about by the assassination of Garfield by a man who was angry about being unable to get a government job. The assassination raised questions about how people should be chosen for civil service jobs."},{"number":668,"term":"Chester A. Arthur","definition":"Appointed customs collector for the port of New York - corrupt and implemented a heavy spoils system. He was chosen as Garfield's running mate. Garfield won but was shot, so Arthur became the 21st president."},{"number":669,"term":"Election of 1884: James G. Blaine, Grover Cleveland","definition":"Democrat - Cleveland - 219 electoral, 4,911,017 popular. Republican - Blaine - 182 electoral, 4,848,334 popular. Butler - 175,370 popular. St. John - 150,369 popular. Cleveland was the first Democrat to be president since Buchanan. He benefited from the split in the Republican Party."},{"number":670,"term":"Stalwarts","definition":"Republicans fighting for civil service reform during Garfield's term; they supported Cleveland."},{"number":671,"term":"Roscoe Conkling (1829-1888)","definition":"A Stalwart leader and part of the Republican political machine in New York."},{"number":672,"term":"Half-breeds","definition":"Favored tariff reform and social reform, major issues from the Democratic and Republican parties. They did not seem to be dedicated members of either party."},{"number":673,"term":"Mugwumps","definition":"Republicans who changed their vote during the 1884 election from Blaine to Cleveland. Mugwump is the Algonquin Indian word for \"chief\" and was used in a N.Y. Sun editorial to criticize the arrogance of the renegade Republicans."},{"number":674,"term":"\"Rum, Romanism, and Rebellion\"","definition":"James Gillespie Blaine said that the Irish Catholics were people of \"rum, Romanism, and rebellion.\" It offended many people and cost Blaine the election."},{"number":675,"term":"Gilded Age Tariffs","definition":"Starting with the Morrill Tariff (1861), high tariffs became a standard policy goal for the Republican party in the late 1800s. The high tariffs protected northern industries but were harmful on southern agriculture."},{"number":676,"term":"Treasury surplus","definition":"During the Reconstruction, the treasury was in deficit, so it cut back spending to build up the treasury and ended with a surplus."},{"number":677,"term":"Civil War Pensions (1887)","definition":"Congress granted pensions to any veterans with any disability for any reason who had served for 90 days or more. Cleveland vetoed it, which contributed to his not being reelected. He expressed concern about fraud and benefits for Confederate soldiers."},{"number":678,"term":"Secret ballot / Australian ballot","definition":"First used in Australia in the 1880s. All candidate names were to be printed on the same white piece of paper at the government's expense and polling was to be done in private. It was opposed by the party machines, who wanted to be able to pressure people into voting for their candidates, but it was implemented and is still in use."},{"number":679,"term":"Cleveland's 1887 Annual Address","definition":"Emphasized civil service reform and fought high tariffs."},{"number":680,"term":"Election of 1888: candidates, issues","definition":"Republican - Harrison - 233 electoral; 5,444,337 popular. Democrat - Cleveland - 168 electoral, 5,540,050 popular. Fisk - 250,125 popular. Harrison said he would protect American industry with a high tariff. Issues were civil service reform and tariffs."},{"number":681,"term":"Benjamin Harrison (1833-1901), Billion Dollar Congress, Czar Reed","definition":"Harrison: Republican, ran against Cleveland, became the 23rd president. Billion Dollar Congress: The first session where Congress spent over $1 billion. Czar Reed: The nickname of Thomas Braket, Speaker of the House 1889-1891. He tried to increase the power of the Speaker."},{"number":682,"term":"McKinley Tariff","definition":"A highly protective tariff passed in 1880. So high it caused a popular backlash which cost the Republicans votes."},{"number":683,"term":"Election of 1892: candidates, issues","definition":"Democrat - Grover Cleveland and V.P. Adlai E. Stevenson - 5,554,414 popular; 227 electoral votes. Republican - Benjamin Harrison and V.P. Whitecar Reed - 145 electoral votes. National Prohibition Convention - John Brownwell and V.P. James B. Cranfil. Socialist Labor Convention Simon Wing and V.P. Charles H. Machett. Republicans wanted a high protective tariff, but Democrats opposed it. Democrats secured a majority in both houses."},{"number":684,"term":"J.P. Morgan: Mergers & Acquisitions","definition":"John Pierpont Morgan took over the Susquehanna and Albany railroads. He won the confidence of European investors and used them for investment capital. He then took over steel companies and bought Carnegie's interests in steel. This was the largest personal financial transaction in U.S. history. Morgan combined the companies to form the U.S. Steel Company, the world's first billion dollar corporation. Eased the Panic of 1873."},{"number":685,"term":"Wilson - Gorman Tariff","definition":"Meant to be a reduction of the McKinley Tariff, it would have created a graduated income tax, which was ruled unconstitutional."},{"number":686,"term":"Pollock v. Farmer's Loan and Trust Company (1895)","definition":"The court ruled the income could not be taxed. In response, Congress passed the 16th Amendment which specifically allows taxation of income (ratified 1913)."},{"number":687,"term":"Dingley Tariff","definition":"Passed in 1897, then the highest protective tariff in U.S. history with an average duty of 57%. It replaced the Wilson - Gorman Tariff, and was replaced by the Payne - Aldrich Tariff in 1909. It was pushed through by big Northern industries and businesses."},{"number":688,"term":"Laissez-faire","definition":"A theory that the economy does better without government intervention in business."},{"number":689,"term":"Adam Smith, The Wealth of Nations","definition":"Promoted laissez-faire, free-market economy, and supply-and-demand economics."},{"number":690,"term":"Union Pacific Railroad, Central Pacific Railroad","definition":"Union Pacific: Began in Omaha in 1865 and went west. Central Pacific: Went east from Sacramento and met the Union Pacific Railroad at Promontory Point, Utah on May 10, 1869, where the golden spike ceremony was held. Transcontinental railroad overcharged the federal government and used substandard materials."},{"number":691,"term":"\"Credit Mobilier\"","definition":"A construction company owned by the larger stockholders of the Union Pacific Railroad. After Union Pacific received the government contract to build the transcontinental railroad, it \"hired\" Credit Mobilier to do the actual construction, charging the federal government nearly twice the actual cost of the project. When the scheme was discovered, the company tried to bribe Congress with gifts of stock to stop the investigation. This precipitated the biggest bribery scandal in U.S. history, and led to greater public awareness of government corruption."},{"number":692,"term":"\"Robber Barons\"","definition":"The owners of big businesses who made large amounts of money by using their wealth and power to lobby for business-friendly laws (land grants, tariffs, monopolies), and actively suppressed unions in order to exploit labor."},{"number":693,"term":"John D. Rockefeller","definition":"Joined his brother William in the formation of the Standard Oil Company in 1870 and became very wealthy. [This term explanation is filled with extraordinary understatement.]"},{"number":694,"term":"Standard Oil Company","definition":"Founded by John D. Rockefeller. Largest unit in the American oil industry in 1881. Known as A.D. Trust, it was outlawed by the Supreme Court of Ohio in 1899. Replaced by the Standard Oil Company of New Jersey."},{"number":695,"term":"Horizontal consolidation","definition":"A form of monopoly that occurs when one person or company gains control of one layer of an industry, such as controlling all the raw materials, or the manufacturing/refining, or the transportation."},{"number":696,"term":"Andrew Carnegie, Henry Clay Frick","definition":"Business tycoons, they made their money in the steel industry. Philanthropists. Frick eventually managed much of Carnegie’s steel operations. Frick was very aggressive in combatting unions."},{"number":697,"term":"Vertical consolidation","definition":"A form of monopoly that occurs when one person or company gains control of every step of the manufacturing process for a single product, such as an auto maker that also owns its own steel mills, rubber plantations, and other companies that supply its parts. This allows the company to lower its costs of production and drive its competition out of business."},{"number":698,"term":"Charles Schwab (1862-1939)","definition":"Began as an engineer in Andrew Carnegie’s company. At age 35 became president of Carnegie Steel and negotiated with J.P. Morgan to merge Carnegie steel into the mega-corporation US Steel. Was named the first president of US Steel. Accumulated a fortune (est. $25-40 million), and by 1929 had either spent or lost almost all of it. Ended his life in a small apartment with $300,000 in debt."},{"number":699,"term":"Thomas A. Edison","definition":"One of the most prolific inventors in U.S. history. He invented the phonograph, light bulb, electric battery, mimeograph and moving picture."},{"number":700,"term":"Alexander Graham Bell","definition":"Invented the telephone in 1835, co-founded American Telegraph and Telephone Company (ATT)."},{"number":701,"term":"Leland Stanford (1824-1893)","definition":"Multimillionaire railroad builder who founded Stanford University in memory of his only son, who died young. Was one of the “Big Four” who founded the Central Pacific Railroad. Later served one term as governor of California."},{"number":702,"term":"Cornelius Vanderbilt, New York Central Railroad","definition":"After starting out working for his father’s business, he became one of the wealthiest Americans in history by acquiring extensive control over railroad and shipping concerns."},{"number":703,"term":"Bessemer process","definition":"Bessemer invented a process for removing air pockets from iron, and thus allowed steel to be made. This made skyscrapers possible, advances in shipbuilding, construction, etc."},{"number":704,"term":"U.S. Steel","definition":"In 1901, financier J. P. Morgan arranged a merger of the National Steel Company, Federal Steel Company, and Carnegie Steel to create the U.S. Steel Corporation, the world's first billion dollar corporation. In 1901, US Steel produced 67% of all steel made in the United States. In 1911, the federal government attempted to break up the US Steel monopoly but failed."},{"number":705,"term":"Gustavus Swift","definition":"In the 1800s he enlarged fresh meat markets through branch slaughterhouses and refrigeration. He monopolized the meat industry."},{"number":706,"term":"Phillip Armour (1832-1901)","definition":"Pioneered the shipping of hogs to Chicago for slaughter, canning, and exporting of meat."},{"number":707,"term":"James B. Duke","definition":"Made tobacco a profitable crop in the modern South, he was a wealthy tobacco industrialist."},{"number":708,"term":"Andrew Mellon (1855-1937)","definition":"One of the wealthiest bankers of his era. Owned or financed numerous large businesses and was a major donor to the Republican Party. Served as Secretary of the Treasury under three consecutive Republican administrations (Harding, Coolidge, Hoover)."},{"number":709,"term":"\"Stock watering\"","definition":"Price manipulation by strategic stockbrokers of the late 1800s. The term for selling more stock than they actually owned in order to lower prices, then buying it back."},{"number":710,"term":"Jay Cooke Company","definition":"The Panic of 1873 was caused by the failure of this company, which had invested too heavily in railroads and lost money when the railroads cheated the federal government."},{"number":711,"term":"Jay Gould and Jim Fiske","definition":"Stock manipulators and brothers-in-law of President Grant, they made money selling gold."},{"number":712,"term":"Railroad Pools","definition":"Agreement between railroads to divide competition. Equalization was achieved by dividing traffic. Reduced or eliminated competition between railroad companies."},{"number":713,"term":"Rebates","definition":"Developed in the 1880s, a practice by which railroads would give money back to its favored customers, rather than charging them lower prices, so that it could appear to be charging a flat rate for everyone."},{"number":714,"term":"Trusts","definition":"Firms or corporations that combine for the purpose of reducing competition and controlling prices (establishing a monopoly). The Sherman and Clayton antitrust acts were eventually passed to try and restrict the trusts."},{"number":715,"term":"Holding Companies","definition":"Companies that hold a majority of another company's stock in order to control the management of that company. Can be used to establish a monopoly."},{"number":716,"term":"Fourteenth Amendment's \"Due Process Clause\"","definition":"No state shall deny a person life, liberty, or property without due process of law. (The accused must have a trial.)"},{"number":717,"term":"Munn v. Illinois (1877)","definition":"The Supreme Court ruled that an Illinois law that put a ceiling on warehousing rates for grain was a constitutional exercise of the state's power to regulate business. It said that the Interstate Commerce Commission could regulate prices."},{"number":718,"term":"Wabash, St. Louis and Pacific Railroad Company v. Illinois (1886)","definition":"Stated that individual states could control trade in their states but could not regulate railroads coming through them. Congress had exclusive jurisdiction over interstate commerce."},{"number":719,"term":"Interstate Commerce Act, Interstate Commerce Commission","definition":"The ICA created the ICC, a five member board that monitors the business operation of carriers transporting goods and people between states."},{"number":720,"term":"Long haul, short haul","definition":"Different railroad companies charged separate rates for hauling goods a long or short distance. The Interstate Commerce Act made it illegal to charge more per mile for a short haul than a long one."},{"number":721,"term":"Sherman Antitrust Act (1890)","definition":"Passed with the promise of countering monopolies. It gave the President authority to challenge existing monopolies in court and potentially break up the companies. For the decade of the laws existence it wasn’t used to break up companies; instead the federal government used the law to try and limit and break up unions."},{"number":722,"term":"U.S. v. E.C. Knight Company (1895)","definition":"The Supreme Court ruled that since the Knight Company's monopoly over the production of sugar had no direct effect on interstate commerce, the company could not be regulated by the federal government. It also ruled that mining and manufacturing weren't affected by interstate commerce laws and were beyond the regulatory power of Congress."},{"number":723,"term":"National Labor Union","definition":"Established 1866, the NLU was the first national labor union in the United States. It merged local unions and so-called “8-hour leagues” to form one national organization. Favored arbitration over strikes; campaigned for Chinese exclusion. Achieved early success advocating for 8-hour work days, but lost membership as it increasingly attempted to focus on monetary reform."},{"number":724,"term":"William Sylvis","definition":"A founder of the National Labor Union. Believing that neither the Democratic or Republican parties were true allies of labor, be attempted to mold the NLU into a national political party."},{"number":725,"term":"Knights of Labor","definition":"An American labor union originally established as a secret fraternal order and noted as the first union of all workers. It was founded in 1869 in Philadelphia by Uriah Smith Stephens. Terrence Powderly was its most significant leader of the Knights of Labor in 1883. By 1886, 20% of all workers were affiliated with the Knights of Labor (800,000 members at its peak)."},{"number":726,"term":"Terrence Powderly","definition":"He joined the Knights of Labor in 1874 and elected its head in 1879 when the Knights had 10,000 members. He oversaw the Great Southwest Railroad Strike of 1886 (involving more than 200,000 workers). The strike ended in violence and the intervention of the Pinkertons as Powderly called off the strike. As the Knights of Labor lost membership over the next several years, he was appointed Commissioner of General Immigration by President McKinley in 1897."},{"number":727,"term":"American Federation of Labor (AFL)","definition":"Began in 1886 as a faction splitting off from the Knights of Labor with about 140,000 members; by 1917 it had 2.5 million members. Goes on to become the largest union in the 20th century."},{"number":728,"term":"Samuel Gompers","definition":"Elected the first president of the AFL, he is re-elected every year until his death in 1924 (except for the year of 1894). In the political sphere, he urged members to “elect their friends… defeat their enemies. Mostly (but not exclusively) supported Democratic candidates. Strongly opposed socialists."},{"number":729,"term":"Collective bargaining","definition":"Discussions held between workers and their employers over wages, hours, and working conditions."},{"number":730,"term":"Injunction","definition":"A judicial order forcing a person or group to refrain from doing something."},{"number":731,"term":"Strikes","definition":"A tool for workers to put pressure on employers to meet their demands. Workers stop working until the conditions are met."},{"number":732,"term":"Boycotts","definition":"People refuse to buy a company's product until the company meets demands."},{"number":733,"term":"Closed shop","definition":"A working establishment where only people belonging to the union are hired. It was done by the unions to protect their workers from cheap labor."},{"number":734,"term":"Blacklist","definition":"A list of people who were identified as troublemakers, often union organizers. The lists were circulated among employers with the intent of preventing any of the named people from being hired."},{"number":735,"term":"Yellow Dog Contracts","definition":"A written contract between employers and employees in which the employees sign an agreement that they will not join a union while working for the company."},{"number":736,"term":"Company unions","definition":"Unions created and controlled by the company instead of the workers. Used by businesses to try and appear like they have unionized workers without having to give the workers an actual voice."},{"number":737,"term":"Great Railroad Strike","definition":"In July of 1877, a large number of railroad workers went on strike because of wage cuts. After a month of strikes, President Hayes sent troops to stop the rioting. The worst railroad violence was in Pittsburgh, with over 40 people killed by militia men."},{"number":738,"term":"Haymarket Square Riot","definition":"100,000 workers rioted in Chicago. After the police fired into the crowd, the workers met and rallied in Haymarket Square to protest police brutality. A bomb exploded, killing or injuring many of the police. The Chicago workers and the man who set the bomb were immigrants, so the incident promoted anti-immigrant feelings."},{"number":739,"term":"John Peter Altgeld","definition":"Governor of Illinois during the Haymarket riots, he pardoned three convicted bombers in 1893, believing them victims of the \"malicious ferocity\" of the courts."},{"number":740,"term":"Homestead Strike","definition":"The workers at a steel plant in Pennsylvania went on strike, forcing the owner to close down. Armed guards were hired to protect the building. The strikers attacked for five months, then gave in to peace demands."},{"number":741,"term":"Pinkertons Detective Agency","definition":"Founded as a private security and detective agency by Allan Pinkerton in 1850. During the Gilded Age, they were often hired by businessmen to infiltrate unions and act as a private army to break strikes."},{"number":742,"term":"American Railway Union","definition":"Founded in 1893, the ARU was briefly one of the largest unions in America. They won their first major action (Great Northern Railroad Strike of 1893). However, the Pullman Strike of 1894 was not as successful. The strike was broken and the union’s leadership (including Eugene V. Debs) was jailed for six months."},{"number":743,"term":"Pullman Strike, 1894","definition":"Started by enraged workers who were part of George Pullman's \"model town\", it began when Pullman fired three workers on a committee. Pullman refused to negotiate, and troops were brought in to ensure that trains would continue to run. When orders for Pullman cars slacked off, Pullman cut wages, but did not cut rents or store prices. At its peak the strike involved 250,000 workers. Rioting related to the strike resulted in 30 deaths and $80 million in damages. The strike ended with the US Army being deployed and the ARU leadership in jail."},{"number":744,"term":"Eugene V. Debs","definition":"A founder of the American Railway Union, he voted to aid workers in the Pullman strike. He was jailed for six months for disobeying a court order after the strike was over. He emerged from prison a dedicated socialist. He went on to found the Industrial Workers of the World (IWW) union and ran for
