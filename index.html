vil': inherently."},{"word":"semblance","prompt":"In order to infiltrate a gambling ring, the undercover agent had to maintain a convincing __________ of wealth.","answers":["semblance"],"why":"Noun form: semblance."},{"word":"adhere","prompt":"__________ to the rules of the camp was required of all the campers.","answers":["adherence"],"why":"Noun form: adherence."},{"word":"aggregate","prompt":"Cement is an __________ made of powdered lime, silica, and several other hard substances.","answers":["aggregate"],"why":"Noun form: aggregate."},{"word":"dissimulate","prompt":"Known for her __________, Linda rarely revealed her true feelings.","answers":["dissimulation"],"why":"Noun form: dissimulation."},{"word":"ensemble","prompt":"To complete his unusual __________, Harkness bought a striped shirt to go with his favorite pair of checkered pants.","answers":["ensemble"],"why":"Noun form: ensemble."},{"word":"egregious","prompt":"Monica was disappointed that she had performed __________ in her first recital.","answers":["egregiously"],"why":"Adverb modifying verb 'performed': egregiously."},{"word":"gregarious","prompt":"Ms. King’s __________ was a great advantage as she campaigned for mayor.","answers":["gregariousness"],"why":"Noun form: gregariousness."}]}},"apush":[{"number":1,"term":"Mayflower Compact","definition":"1620 agreement signed by 41 men aboard the Mayflower that established a system of self-government for Plymouth Colony."},{"number":2,"term":"William Bradford","definition":"Pilgrim who served as Plymouth Colony’s second governor from 1621 to 1657. He promoted private land ownership, helped reduce the colony’s debt, and guided Plymouth through droughts, crop failures, and Indian attacks."},{"number":3,"term":"Pilgrims and Puritans contrasted","definition":"Pilgrims were separatists who believed the Church of England could not be reformed, so they left England and settled at Plymouth. Puritans were non-separatists who wanted to reform and purify the Church of England and received permission to settle the Massachusetts Bay area."},{"number":4,"term":"Massachusetts Bay Colony","definition":"In 1629 King Charles granted the Puritans the right to settle and govern in the Massachusetts Bay area. The colony developed representative government and political freedom."},{"number":5,"term":"Cambridge Agreement","definition":"1629 agreement in which Puritan stockholders of the Massachusetts Bay Company agreed to move to New England only if they would control the colony’s government."},{"number":6,"term":"Puritan migration","definition":"Large numbers of Puritans moved from England to America during the 1630s and 1640s, causing the Massachusetts Bay Colony’s population to grow to about ten times its earlier size."},{"number":7,"term":"Church of England (Anglican Church)","definition":"England’s national church, established by King Henry VIII, combining elements associated with both Roman Catholicism and Protestantism."},{"number":8,"term":"John Winthrop (1588-1649), his beliefs","definition":"First governor of Massachusetts Bay, beginning in 1630 and serving through 1649. A strongly religious Puritan, he opposed complete democracy and favored rule by a small group of capable leaders; he also helped organize the New England Confederation in 1643 and became its first president."},{"number":9,"term":"Separatists, non-separatists","definition":"Non-separatists, including the Puritans, believed the Church of England could be purified through reform. Separatists, including the Pilgrims, believed it could not be reformed and therefore formed separate congregations."},{"number":10,"term":"Calvinism","definition":"Protestant movement founded by John Calvin that emphasized strict morality and predestination—the belief that a person’s salvation was decided by God from birth. The source also associates Calvinists with constitutional representative government and separation of church and state."},{"number":11,"term":"Congregational Church, Cambridge Platform","definition":"The Congregational Church was formed by separatists who believed the Church of England retained too many Roman Catholic practices; the Pilgrims belonged to it. The Cambridge Platform emphasized morality more than church dogma."},{"number":12,"term":"Contrast Puritan colonies with others","definition":"Puritan towns were largely self-governing and expected residents to follow strict Puritan beliefs. Voting and officeholding were limited to full church members who had achieved grace—the “elect” or “saints”—while other colonies used different governments and were more open to differing beliefs."},{"number":13,"term":"Anne Hutchinson, Antinomianism","definition":"Anne Hutchinson taught that God could communicate directly with individuals rather than only through church elders. She was expelled from Massachusetts in 1637; the source states that her Antinomian followers founded New Hampshire in 1639."},{"number":14,"term":"Roger Williams, Rhode Island","definition":"In 1635 Roger Williams left Massachusetts, bought land from a neighboring Indian tribe, and founded Rhode Island. The source describes Rhode Island as the only colony at that time offering complete religious freedom."},{"number":15,"term":"Covenant theology","definition":"Puritan teaching centered on biblical covenants, including God’s covenants with Adam and Noah and the covenant of grace between God and humanity through Christ."},{"number":16,"term":"Voting granted to church members - 1631","definition":"In 1631 the Massachusetts General Court restricted voting rights to church members."},{"number":17,"term":"Half-way Covenant","definition":"Applied to children of Puritan church members who had not personally achieved grace. It allowed them to take part in some church affairs without full membership."},{"number":18,"term":"Brattle Street Church","definition":"Founded by Thomas Brattle in 1698. Unlike stricter Puritan churches, it did not require people to prove they had achieved grace before becoming full church members."},{"number":19,"term":"Thomas Hooker","definition":"Clergyman and founder of Hartford, Connecticut. Called the “father of American democracy” in the source because he argued that people had the right to choose their magistrates."},{"number":20,"term":"Fundamental Orders of Connecticut","definition":"Created a unified government for Windsor, Hartford, and Wethersfield in Connecticut. The source identifies it as the first written constitution in America."},{"number":21,"term":"Saybrook Platform","definition":"Organized Connecticut town churches into county associations, which sent delegates to an annual assembly that governed the colony."},{"number":22,"term":"Massachusetts School Law","definition":"First public-education legislation in America according to the source. Towns with at least 50 families had to employ a schoolmaster, while towns with more than 100 families had to establish a grammar school."},{"number":23,"term":"Harvard founded","definition":"Harvard was founded in 1636 through a grant from the Massachusetts General Court and followed Puritan beliefs."},{"number":24,"term":"New England Confederation","definition":"Created in 1643 to coordinate defense among four New England colonies and to serve as a court for disputes between colonies."},{"number":25,"term":"King Philip’s War","definition":"1675 conflict in New England between colonists and the Wampanoag and allied tribes led by Metacomet, or King Philip. The source says it began after Massachusetts tried to impose court jurisdiction over local Indians; the colonists ultimately won with Mohawk assistance."},{"number":26,"term":"Dominion of New England","definition":"In 1686 Britain combined Massachusetts, Rhode Island, New Hampshire, and Connecticut into one province under royal governor Andros. The Dominion ended in 1692 after colonists revolted and removed him."},{"number":27,"term":"Sir Edmond Andros","definition":"Royal governor of the Dominion of New England from 1686 until 1692, when colonial rebellion forced him to return to England."},{"number":28,"term":"Joint stock company","definition":"Business owned by a group of shareholders who each invest money and receive a share of the company’s profits and debts."},{"number":29,"term":"Virginia: purpose, problems, failures, successes","definition":"The Virginia Company created Virginia as a profit-making venture, but starvation killed about 90% of the colonists in the first year and the colony struggled to retain and attract settlers. Private land ownership was offered as an incentive; the company eventually failed and the colony became royal, while tobacco production and export later made Virginia economically successful."},{"number":30,"term":"Headright system","definition":"System of roughly 50-acre land grants given to colonists who brought indentured servants to America. The Virginia Company used headrights to attract more settlers."},{"number":31,"term":"John Smith","definition":"Leader who helped found and govern Jamestown. His strict discipline and leadership helped the Virginia colony survive its difficult first winter."},{"number":32,"term":"John Rolfe, tobacco","definition":"Jamestown settler who married Pocahontas and developed a successful way to grow and cure tobacco for export. Tobacco helped make Virginia economically successful."},{"number":33,"term":"Slavery begins","definition":"1619—the source identifies this as the year the first African slaves arrived in the Virginia colony."},{"number":34,"term":"House of Burgesses","definition":"Formed in Virginia in 1619 as the first legislative body in colonial America. Other colonies later adopted similar houses of burgesses."},{"number":35,"term":"Bacon’s Rebellion","definition":"1676 uprising led by Nathaniel Bacon and western Virginia settlers angry with Governor Berkley’s response to Doeg Indian attacks. Bacon’s force fought the Indians, marched on Jamestown, and burned the city; the rebellion ended abruptly when Bacon died of illness."},{"number":36,"term":"Culpeper’s Rebellion (1677-79)","definition":"John Culpeper led northern Carolina farmers against the Lords Proprietor over enforcement of the Navigation Acts and the end of a tax exemption. The rebellion was suppressed, but Culpeper was acquitted."},{"number":37,"term":"Georgia: reasons, successes","definition":"Founded in 1733 as a buffer between the Carolinas and Spanish Florida and as an intended haven for debtors. It was planned around small farms with no more than ten indentured servants, and the source says the colony prospered after restrictions on land, liquor, and slavery were removed."},{"number":38,"term":"James Oglethorpe","definition":"Founder and governor of Georgia who ran the colony with strict, military-style discipline. He prohibited slavery, alcohol, and Catholicism; colonists’ resentment of his rule and the ban on slaveholding contributed to the colony’s difficulties and to his loss of office."},{"number":39,"term":"Carolinas","definition":"Granted by Charles II in 1665 to supporters as payment of a debt. Headrights and representative government were used to attract settlers; the southern area became wealthy through ties to the sugar islands, while the poorer north was dominated by farmers, and regional conflict eventually split the colony into North and South Carolina."},{"number":40,"term":"Charleston","definition":"Established in 1690 as the first permanent settlement in the Carolinas and named for King Charles II. A large portion of its population consisted of Huguenot, or French Protestant, refugees."},{"number":41,"term":"Staple crops in the South","definition":"Tobacco was important in Virginia, Maryland, and North Carolina; rice in South Carolina and Georgia; and indigo in South Carolina."},{"number":42,"term":"Pennsylvania, William Penn","definition":"In 1681 William Penn received a land grant from King Charles II and created Pennsylvania as a refuge for Quakers. The colony permitted religious freedom."},{"number":43,"term":"Liberal land laws in Pennsylvania","definition":"William Penn allowed broad immigration to Pennsylvania in order to make the colony a refuge for people facing religious persecution."},{"number":44,"term":"Holy experiment","definition":"William Penn’s name for Pennsylvania’s system of government, intended to serve everyone and protect freedom for all."},{"number":45,"term":"Charter of Liberties","definition":"1701 document establishing Pennsylvania’s government, including representative government. The source also says it allowed counties to form their own colonies."},{"number":46,"term":"New York: Dutch, 1664 English","definition":"New York was originally Dutch, but Charles II granted it to his brother, the Duke of York, in 1664. The Dutch quickly surrendered when the British arrived because they disliked Governor Stuyvesant; they retook the colony in 1673, but Britain regained it in 1674."},{"number":47,"term":"Peter Stuyvesant","definition":"Governor of Dutch New Amsterdam who was unpopular with colonists. They surrendered the colony to the English on September 8, 1664."},{"number":48,"term":"Five Nations","definition":"Federation in northern New York consisting of the Mohawk, Oneida, Seneca, Onondaga, and Cayuga, also called the Iroquois or League of Five Nations. The Tuscarora joined around 1720 as a sixth member; the source describes the federation as the most powerful and efficient North American Indian organization of the 1700s and says some constitutional ideas influenced the U.S. Constitution."},{"number":49,"term":"Crops in the Middle Colonies","definition":"The Middle Colonies produced staple crops, especially grain and corn."},{"number":50,"term":"New York and Philadelphia as urban centers","definition":"New York grew into a major trade center because of its harbor and rivers. Philadelphia became a center for trade, crafts, and immigration, reached about 10,000 people by 1720, served as Pennsylvania’s capital from 1683 to 1799, and—like New York—played an important role in American Independence."},{"number":51,"term":"Gove Rebellion","definition":"A brief 1683 uprising in New Hampshire against unpopular royal governor Edward Cranfield after he enforced mercantilist policies and dissolved the elected council. Former councilor Edward Gove gathered a small armed group, was arrested, sentenced to death, later pardoned, and returned to New Hampshire."},{"number":52,"term":"Leisler’s Rebellion","definition":"In 1689 New York colonists rebelled after James II was replaced by William. Militia officer Jacob Leisler became governor; when royal authority returned in 1691 he was executed for treason, though the representative assembly he created remained."},{"number":53,"term":"Benjamin Franklin","definition":"Printer, author, inventor, diplomat, statesman, and Founding Father who was highly respected in Europe, especially for his discoveries involving electricity."},{"number":54,"term":"John Bartram (1699-1777)","definition":"Often identified as America’s first botanist; he traveled through frontier regions collecting plant specimens."},{"number":55,"term":"Pennsylvania, Maryland, Rhode Island: Religious Freedom","definition":"Pennsylvania was founded by Quaker William Penn as a refuge for Quakers; Maryland was intended as a haven for Catholics; Rhode Island offered broad religious freedom to persecuted groups, including Christian denominations and Jews."},{"number":56,"term":"First Great Awakening (1739-1744)","definition":"A surge of religious revivalism that swept the colonies as Puritan piety declined. The packet describes it as one of the first major events to unify the colonies."},{"number":57,"term":"Jonathan Edwards, Sinners in the Hands of an Angry God, a Careful and Strict Inquiry Into...That Freedom of Will","definition":"Great Awakening preacher known for intense sermons emphasizing sin, divine judgment, and the danger of damnation."},{"number":58,"term":"George Whitefield","definition":"Anglican priest and charismatic orator credited in the packet with helping start the Great Awakening and leading the New Lights."},{"number":59,"term":"William Tennant","definition":"Influential Presbyterian minister during the Great Awakening who founded a school in 1726 to train Presbyterian ministers."},{"number":60,"term":"Gilbert Tennant","definition":"Son of William Tennant who developed a theology centered on religious revivalism."},{"number":61,"term":"Old Lights, New Lights","definition":"New Lights were revivalist religious movements that emerged during the Great Awakening and broke from established Congregational churches; Old Lights were the established Congregational churches."},{"number":62,"term":"Lord Baltimore","definition":"Founder of Maryland who offered religious freedom to Christian colonists, partly because Catholics like himself would be a minority there."},{"number":63,"term":"Maryland Act of Toleration (Act of Religious Toleration)","definition":"1649 law ordered by Lord Baltimore that guaranteed religious freedom to Christians after a Protestant governor took office in heavily Protestant Maryland."},{"number":64,"term":"Deism","definition":"Enlightenment-era belief that God created the world but then allowed it to operate according to natural laws without direct divine intervention or communication."},{"number":65,"term":"Mercantilism: features, rationale, impact on Great Britain, impact on the colonies","definition":"European economic policy emphasizing government control of trade, exports greater than imports, and colonies as sources of raw materials and markets. Britain used the colonies to support British production and trade."},{"number":66,"term":"Navigation Acts of 1650, 1660, 1663, and 1696","definition":"British trade regulations designed to protect British shipping. Colonial imports had to travel on British-owned vessels, with at least three-fourths of each crew British."},{"number":67,"term":"Admiralty Courts","definition":"British courts used for smuggling and Navigation Act cases and sometimes other colonial criminal cases. Judges, rather than juries, decided the cases."},{"number":68,"term":"Triangular Trade","definition":"Colonial trade network central to New England’s economy: New England rum went to Africa, enslaved Africans were transported through the Middle Passage to the Caribbean, and Caribbean sugar and molasses returned to New England for rum production."},{"number":69,"term":"Merchants / Markets","definition":"A market is an area or population that needs a product. Colonial merchants moved colonial goods to buyers elsewhere, while the colonies also served as markets for foreign goods."},{"number":70,"term":"Consignment System","definition":"Arrangement in which one company sells another company’s products, returns most of the proceeds to the producer, and keeps a percentage as commission."},{"number":71,"term":"Molasses Act, 1733","definition":"British tax on molasses, rum, and sugar imported by the colonies from non-British sources. It angered New England merchants involved in Caribbean trade and was widely evaded because enforcement was weak."},{"number":72,"term":"Woolens Act, 1699","definition":"Required wool produced in the colonies to be exported only to Britain."},{"number":73,"term":"Hat Act, 1732","definition":"Prohibited the export of hats made in the colonies."},{"number":74,"term":"Iron Act, 1750","definition":"Forbade the creation of new colonial iron forges or mills."},{"number":75,"term":"Currency Act, 1751","definition":"Measure applying only to Massachusetts that attempted to prohibit paper-money production there; according to the packet, it was defeated in Parliament."},{"number":76,"term":"Currency Act, 1764","definition":"Applied to all colonies and prohibited colonial paper money in response to inflation associated in the packet with Virginia issuing additional currency to reduce its debt."},{"number":77,"term":"Salem Witch Trials","definition":"Witchcraft accusations in Salem, Massachusetts led to sensational trials and executions. The packet states that 18 people were hanged and one was pressed to death, after which many participants admitted the proceedings had been a grave mistake."},{"number":78,"term":"Indentured Servants","definition":"People unable to pay for passage to the colonies could have another person pay in exchange for a fixed term of labor, usually four to seven years, after which they became free."},{"number":79,"term":"Poor Richard’s Almanack, first published 1732","definition":"Benjamin Franklin’s popular colonial almanac containing observations, humor, and practical advice, including the famous early-to-bed proverb."},{"number":80,"term":"Phillis Wheatly (1754-1784)","definition":"African domestic servant in the colonies who became a well-known colonial poet noted in the packet for ornate, elaborate verse."},{"number":81,"term":"Ann Bradstreet (1612-1692)","definition":"Puritan writer identified in the packet as the first published colonial poet; her poetry focused mainly on family, home, and religion."},{"number":82,"term":"Magna Carta, 1215","definition":"English document imposed on King John by nobles that limited royal power and later influenced constitutional traditions in Britain and America."},{"number":83,"term":"Petition of Right, 1628","definition":"Parliamentary document listing grievances against Charles I, strengthening Parliament and limiting the king. It addressed taxation, arrest without cause, quartering soldiers, and martial law in peacetime."},{"number":84,"term":"Habeas Corpus Act, 1679","definition":"British law strengthening the writ of habeas corpus, which allowed prisoners to challenge the legality of detention, and imposing penalties on officials who improperly refused or ignored the writ."},{"number":85,"term":"Bill of Rights, 1689","definition":"Parliamentary statement of rights presented to William and Mary that protected certain British liberties, limited royal taxation power, and restricted standing armies in peacetime."},{"number":86,"term":"Board of Trade (of the Privy Council)","definition":"Royal advisers who regulated British trade during the seventeenth and eighteenth centuries."},{"number":87,"term":"Robert Walpole","definition":"British prime minister in the early eighteenth century whose approach toward the colonies was salutary neglect."},{"number":88,"term":"\"Salutary neglect\"","definition":"Robert Walpole’s policy of loose enforcement toward the colonies. He focused on British affairs and believed relatively unrestricted colonial trade would benefit England more than strict colonial taxation."},{"number":89,"term":"The Enlightenment","definition":"European intellectual movement of the 1700s that spread to the colonies and emphasized reason and the scientific method, especially in government, ethics, and science. Many Enlightenment thinkers favored Deism over traditional religious explanations."},{"number":90,"term":"Theories of representative government in legislatures: virtual representation, actual representation","definition":"Virtual representation means a representative is not elected by particular constituents but is said to share their interests; actual representation means constituents directly elect the representative. The packet says the colonies had only virtual representation in the British government."},{"number":91,"term":"Rise of the Lower House","definition":"Colonial legislatures often had an elected lower house and a governor-appointed upper house. Over time the elected lower house became more powerful because it more directly reflected popular needs and preferences."},{"number":92,"term":"Proprietary, charter, and royal colonies","definition":"Proprietary colonies were controlled by an individual or proprietary company; charter colonies operated under a charter granted to a company or group; royal colonies were created by the king and under direct royal control."},{"number":93,"term":"Colonial agents","definition":"Representatives sent by colonies to England during the seventeenth and eighteenth centuries to serve as links between colonial governments and Britain."},{"number":94,"term":"Town meetings","definition":"Directly democratic form of local government especially common in New England, where eligible town voters met to elect officers, levy taxes, and pass local laws."},{"number":95,"term":"John Peter Zenger trial","definition":"1737 trial of printer John Peter Zenger for publishing criticism of Governor William Cosby. His acquittal became an important colonial precedent for freedom of the press."},{"number":96,"term":"John Locke (1632-1704), his theories","definition":"English political philosopher who argued for natural rights to life, liberty, and property, government based on a social contract, and the people’s right to replace a government that fails to protect those rights."},{"number":97,"term":"A democratic society or not?","definition":"The packet notes that the Founding Fathers feared pure democracy, anarchy, and factions, so the system they designed incorporated republican or indirect-democratic features in which voters elect representatives rather than vote directly on laws."},{"number":98,"term":"Differences between French and British colonization","definition":"British colonists generally settled coastal farms and towns, often as families, built stronger local governments, and had less everyday interaction with Native peoples. French colonists were more concentrated in the interior and fur trade, were often single men, had fewer towns and looser government, and interacted more closely with Native communities."},{"number":99,"term":"Queen Anne’s War, 1702-1713","definition":"Second of the conflicts commonly grouped as the French and Indian Wars and part of the War of the Spanish Succession. Britain and the Netherlands fought France and Spain; Britain gained Canadian territory despite many military setbacks in North America."},{"number":100,"term":"Peace of Utrecht, 1713","definition":"Treaty ending Queen Anne’s War that weakened French power in North America by transferring Hudson Bay, Newfoundland, and Nova Scotia to Britain."},{"number":101,"term":"War of Jenkins’ Ear (1739-1743)","definition":"Conflict between Britain and Spain over trade and territory, fought mainly in the Caribbean and along the Georgia-Florida border. Its name came from British captain Robert Jenkins, whose severed ear became a symbol of Spanish abuses."},{"number":102,"term":"King George’s War (1744-1748)","definition":"North American phase of the War of the Austrian Succession, fought chiefly between Britain and France. Although New England forces captured Louisbourg, the peace treaty restored most conquests and left Britain in control of Nova Scotia."},{"number":103,"term":"French and Indian War (1756-1763)","definition":"North American part of the Seven Years’ War, in which Britain and France fought for the Ohio Valley and Canada with different Native allies. Britain’s victory removed France from most mainland North America and greatly expanded British territory and debt."},{"number":104,"term":"Albany Plan of Union, Benjamin Franklin","definition":"Benjamin Franklin’s 1754 proposal for a unified intercolonial government under British authority to coordinate defense and relations with Native nations. Colonial legislatures and the British government rejected it."},{"number":105,"term":"General Braddock","definition":"British commander whose 1755 expedition toward Fort Duquesne was ambushed and defeated; Braddock was mortally wounded. George Washington helped organize the retreat of the surviving British and colonial troops."},{"number":106,"term":"William Pitt (1708-1778)","definition":"British wartime leader who redirected resources toward defeating France, financed colonial troops, strengthened British command, and helped turn the French and Indian War in Britain’s favor."},{"number":107,"term":"Fort Pitt, Fort Duquesne","definition":"Fort Duquesne was a major French position at the forks of the Ohio River. The French abandoned it in 1758 as British forces approached, and the British built Fort Pitt at the same strategic site."},{"number":108,"term":"Wolfe, Montcalm, Quebec","definition":"In 1759 British general James Wolfe defeated French forces led by the Marquis de Montcalm on the Plains of Abraham, leading to the British capture of Quebec. Both commanders died from wounds received in the battle."},{"number":109,"term":"Treaty of Paris, 1763","definition":"Treaty ending the Seven Years’ War and French and Indian War. Britain gained Canada, French land east of the Mississippi, and Florida; Spain received Louisiana and New Orleans from France."},{"number":110,"term":"Pontiac’s Rebellion","definition":"1763 Native resistance led by Ottawa chief Pontiac and allied nations against British forts and settlement in the Great Lakes and Ohio Valley after France’s defeat. The conflict helped prompt Britain’s Proclamation of 1763."},{"number":111,"term":"Proclamation of 1763","definition":"British order barring colonial settlement west of the Appalachian Mountains in an effort to reduce frontier warfare and stabilize relations with Native nations. Many colonists resented or ignored it."},{"number":112,"term":"Writs of Assistance","definition":"Broad British search warrants that allowed customs officials to search colonial homes, warehouses, and ships for smuggled goods without specifying a particular place or proving probable cause. Colonists protested them as violations of their rights."},{"number":113,"term":"James Otis","definition":"Massachusetts lawyer and political writer who challenged writs of assistance and British taxation, arguing that arbitrary searches and taxation without representation violated colonial rights."},{"number":114,"term":"Paxton Boys","definition":"Pennsylvania frontier vigilantes who killed peaceful Susquehannock people in 1763 and later marched toward Philadelphia. Their actions exposed tensions between western settlers, Native peoples, and the colony’s eastern government."},{"number":115,"term":"Navigation Acts","definition":"British mercantilist laws regulating colonial trade, requiring many goods to travel in British ships or pass through British ports. Enforcement tightened after the French and Indian War as Britain sought more revenue."},{"number":116,"term":"Grenville’s Program","definition":"Prime Minister George Grenville’s postwar effort to reduce Britain’s debt and make the colonies help pay for their defense through stricter trade enforcement and new measures such as the Sugar Act and Stamp Act."},{"number":117,"term":"Sugar Act, 1764","definition":"Grenville measure that lowered the duty on foreign molasses but strengthened enforcement, expanded vice-admiralty jurisdiction, and taxed additional imports. Colonists objected to its revenue-raising purpose and enforcement methods."},{"number":118,"term":"Molasses Act, 1733","definition":"British law placing a high duty on molasses, sugar, and rum imported from non-British Caribbean colonies. Because New England merchants depended on this trade, the act was widely evaded and weakly enforced."},{"number":119,"term":"Currency Act, 1764","definition":"British law prohibiting the colonies from issuing new paper money and restricting existing colonial currency as legal tender, protecting British creditors but worsening colonial shortages of hard money."},{"number":120,"term":"Vice-Admiralty Courts","definition":"British maritime courts that tried smuggling and customs cases without juries. Colonists objected that judges, rather than local juries, decided guilt and could benefit financially from convictions."},{"number":121,"term":"Non-Importation","definition":"Colonial boycott strategy in which merchants and consumers agreed not to import British goods in order to pressure Parliament to repeal unpopular taxes and trade laws."},{"number":122,"term":"Virtual vs Actual Representation","definition":"Virtual representation claimed Parliament represented all British subjects even when they did not elect its members; actual representation meant constituents directly elected their representatives. Colonists argued that only actual representation justified taxation."},{"number":123,"term":"Stamp Act","definition":"1765 law requiring revenue stamps on newspapers, legal documents, licenses, and other printed materials. Colonial protests, riots, and non-importation led Parliament to repeal it in 1766."},{"number":124,"term":"Virginia Resolves","definition":"Patrick Henry’s 1765 resolutions asserting that Virginians possessed the rights of Englishmen and could be taxed only by their own elected representatives. Versions circulated throughout the colonies and encouraged resistance to the Stamp Act."},{"number":125,"term":"Stamp Act Congress, 1765","definition":"Meeting of delegates from nine colonies in New York that issued declarations and petitions against the Stamp Act, arguing that only colonial assemblies could impose internal taxes on colonists."},{"number":126,"term":"Patrick Henry (1736-1799)","definition":"Virginia lawyer, orator, and patriot who opposed British taxation, promoted resistance and independence, served as Virginia’s first post-independence governor, and later demanded protections that contributed to adoption of the Bill of Rights."},{"number":127,"term":"Sons of Liberty","definition":"Intercolonial resistance organization formed during the Stamp Act crisis. Members organized protests, intimidated stamp distributors, supported boycotts, and included leaders such as Samuel Adams and Paul Revere."},{"number":128,"term":"Internal taxes","definition":"Taxes on activities and transactions occurring within the colonies, such as the Stamp Act’s tax on legal and printed documents. Many colonists argued Parliament lacked authority to impose them."},{"number":129,"term":"External taxes","definition":"Duties on goods imported into the colonies, such as customs taxes. Some colonists initially distinguished these trade duties from internal taxes, although later resistance challenged Parliament’s use of either type to raise revenue."},{"number":130,"term":"Declaratory Act, 1766","definition":"Law passed with repeal of the Stamp Act declaring Parliament’s authority to make laws binding the colonies in all cases whatsoever, preserving Britain’s claim of complete legislative sovereignty."},{"number":131,"term":"Quartering Act","definition":"1765 law requiring colonial governments to provide housing, food, and supplies for British troops stationed in North America, creating disputes over costs and Parliament’s authority."},{"number":132,"term":"Townshend Acts, reaction","definition":"1767 measures taxing imported glass, lead, paint, paper, and tea and strengthening customs enforcement. Colonists responded with non-importation, political writings, and protests against taxation without representation."},{"number":133,"term":"John Dickinson","definition":"Pennsylvania lawyer and author of Letters from a Farmer in Pennsylvania, which protested the Townshend duties while seeking reconciliation. He opposed immediate independence and declined to sign the Declaration of Independence."},{"number":134,"term":"Massachusetts Circular Letter","definition":"1768 letter drafted by Massachusetts leaders and circulated to other colonies, urging united opposition to the Townshend Acts. Britain demanded its withdrawal and threatened to dissolve assemblies that supported it."},{"number":135,"term":"Sam Adams (1722-1803)","definition":"Massachusetts radical who helped organize the Sons of Liberty, committees of correspondence, non-importation, and resistance to British policies. He later served in the Continental Congress and as governor of Massachusetts."},{"number":136,"term":"The Association","definition":"Volunteer military organization created in Pennsylvania under Benjamin Franklin during King George’s War. It organized defense units and built batteries along the Delaware River."},{"number":137,"term":"Repeal of the Townshend Acts, except tax on tea","definition":"In 1770 Lord North’s government repealed most Townshend duties after colonial resistance and falling trade, but retained the tax on tea to preserve Parliament’s claim that it could tax the colonies."},{"number":138,"term":"Boston Massacre, 1770","definition":"March 1770 confrontation in which British soldiers fired into a hostile Boston crowd, killing five colonists. Patriot leaders used the event to strengthen anti-British sentiment."},{"number":139,"term":"Crispus Attucks (1723-1770)","definition":"Sailor of African and Native ancestry remembered as the first person killed in the Boston Massacre. Patriots later celebrated him as a martyr to resistance against British rule."},{"number":140,"term":"John Adams","definition":"Massachusetts lawyer and advocate of colonial rights who defended the British soldiers after the Boston Massacre, promoted independence in the Continental Congress, helped draft the Declaration of Independence, and later became the second U.S. president."},{"number":141,"term":"Carolina Regulators","definition":"Backcountry movements protesting distant and often corrupt eastern colonial governments. North Carolina Regulators opposed taxes and fees before being defeated in 1771; South Carolina vigilantes sought law enforcement on the frontier."},{"number":142,"term":"Battle of the Alamance","definition":"1771 battle in which North Carolina governor William Tryon’s militia defeated the Regulators at Alamance Creek, ending their organized uprising and leading to the execution of several leaders."},{"number":143,"term":"Gaspée Incident","definition":"1772 episode in which Rhode Island colonists boarded and burned the grounded British customs schooner Gaspée. British plans to send suspects to England for trial increased colonial alarm and encouraged committees of correspondence."},{"number":144,"term":"Governor Thomas Hutchinson of Massachusetts","definition":"Massachusetts royal governor and supporter of Parliament’s authority who became a major target of Patriot opposition. His insistence that tea be landed in Boston helped precipitate the Boston Tea Party, after which he left for England."},{"number":145,"term":"Committees of Correspondence","definition":"Colonial communication networks that exchanged information about British policies, coordinated protests, and built cooperation among towns and colonies. They expanded especially after the Gaspée Incident."},{"number":146,"term":"Lord North","definition":"British prime minister from 1770 to 1782 who repealed most Townshend duties but enforced coercive policies under George III. He directed Britain during most of the American Revolution and resigned after the defeat at Yorktown."},{"number":147,"term":"Tea Act, East India Company","definition":"1773 law allowing the financially troubled East India Company to sell tea directly in the colonies while retaining the tea duty. The lower-priced but taxed tea threatened colonial merchants and prompted resistance."},{"number":148,"term":"Boston Tea Party, 1773","definition":"December 16 protest in which colonists boarded East India Company ships and dumped tea into Boston Harbor to resist the Tea Act and Parliament’s claimed right to tax the colonies."},{"number":149,"term":"Coercive Acts / Intolerable Acts / Repressive Acts","definition":"Punitive laws passed in 1774 after the Boston Tea Party. They closed Boston Harbor, restricted Massachusetts self-government, strengthened quartering provisions, and protected royal officials, prompting greater colonial unity."},{"number":150,"term":"Boston Port Act","definition":"One of the Coercive Acts; it closed Boston Harbor to most trade until the destroyed tea was paid for and royal authority was restored, causing economic hardship and intercolonial support for Massachusetts."},{"number":151,"term":"Massachusetts Government Act","definition":"This was another of the Coercive Acts, which said that members of the Massachusetts assembly would no longer be elected, but instead would be appointed by the king. In response, the colonists elected their own legislature which met in the interior of the colony."},{"number":152,"term":"Quebec Act, First Continental Congress, 1774","definition":"The Quebec Act, passed by Parliament, alarmed the colonies because it recognized the Roman Catholic Church in Quebec. Some colonials took it as a sign that Britain was planning to impose Catholicism upon the colonies. The First Continental Congress met to discuss their concerns over Parliament's dissolutions of the New York (for refusing to pay to quarter troops), Massachusetts (for the Boston Tea Party), and Virginia Assemblies. The First Continental Congress rejected the plan for a unified colonial government, stated grievances against the crown called the Declaration of Rights, resolved to prepare militias, and created the Continental Association to enforce a new non-importation agreement through Committees of Vigilance. In response, in February, 1775, Parliament declared the colonies to be in rebellion."},{"number":153,"term":"Suffolk Resolves","definition":"Agreed to by delegates from Suffolk county, Massachusetts, and approved by the First Continental Congress on October 8, 1774. Nullified the Coercive Acts, closed royal courts, ordered taxes to be paid to colonial governments instead of the royal government, and prepared local militias."},{"number":154,"term":"Galloway Plan","definition":"A plan proposed at the First Continental Congress which would have created an American parliament appointed by colonial legislatures. It was defeated by one vote."},{"number":155,"term":"Continental Association","definition":"Created by the First Continental Congress, it enforced the non-importation of British goods by empowering local Committees of Vigilance in each colony to fine or arrest violators. It was meant to pressure Britain to repeal the Coercive Acts."},{"number":156,"term":"Lexington and Concord, April 19, 1775","definition":"General Gage, stationed in Boston, was ordered by King George III to arrest Samuel Adams and John Hancock. The British marched on Lexington, where they believed the colonials had a cache of weapons. The colonial militias, warned beforehand by Paul Revere and William Dawes, attempted to block the progress of the troops and were fired on by the British at Lexington. The British continued to Concord, where they believed Adams and Hancock were hiding, and they were again attacked by the colonial militia. As the British retreated to Boston, the colonials continued to shoot at them from behind cover on the sides of the road. This was the start of the Revolutionary War."},{"number":157,"term":"Paul Revere, William Dawes","definition":"They rode through the countryside warning local militias of the approach of the British troops prior to the Battles of Lexington and Concord, although Revere was detained by the British shortly after setting out, and never completed his portion of the planned ride. Thanks to the advance warning, the militias were able to take the British by surprise."},{"number":158,"term":"Second Continental Congress","definition":"It met in 1776 and drafted and signed the Declaration of Independence, which justified the Revolutionary War and declared that the colonies should be independent of Britain."},{"number":159,"term":"George Washington","definition":"He had led troops (rather unsuccessfully) during the French and Indian War and had surrendered Fort Necessity to the French. He was appointed commander-in-chief of the Continental Army and was much more successful in this second command."},{"number":160,"term":"Battle of Bunker Hill (Breed’s Hill)","definition":"At the beginning of the Revolutionary War, the British troops were based in Boston. The British army had begun to fortify the Dorchester Heights near Boston, and so the Continental Army fortified Breed’s Hill, north of Boston, to counter the British plan. British general Gage led two unsuccessful attempts to take this hill, before he finally seized it with the third assault. The British suffered heavy losses and lost any hope for a quick victory against the colonies. Although the battle centered around Breed’s Hill, it was mistakenly named for nearby Bunker Hill."},{"number":161,"term":"Olive Branch Petition","definition":"On July 8, 1775, the colonies made a final offer of peace to Britain, agreeing to be loyal to the British government if it addressed their grievances (repealed the Coercive Acts, ended the taxation without representation policies). It was rejected by Parliament, which in December 1775 passed the American Prohibitory Act forbidding all further trade with the colonies."},{"number":162,"term":"Thomas Paine: Common Sense","definition":"A British citizen, he wrote Common Sense, published on January 1, 1776, to encourage the colonies to seek independence. It spoke out against the unfair treatment of the colonies by the British government and was instrumental in turning public opinion in favor of the Revolution."},{"number":163,"term":"Natural Rights Philosophy","definition":"Proposed by John Locke, it said that human beings had by nature certain rights, such as the rights to life, liberty, and property."},{"number":164,"term":"John Locke, Second Treatise of Government","definition":"He wrote that all human beings have a right to life, liberty, and property and that governments exist to protect those rights. He rejected the theory of the Divine Right of the monarchy and believed that government was based upon a \"social contract\" that existed between a government and its people. If the government failed to uphold its end of the contract by protecting those rights, the people could rebel and institute a new government."},{"number":165,"term":"George III","definition":"Became King of England in 1760 and reigned during the American Revolution."},{"number":166,"term":"The Lee Resolution","definition":"Proposed on June 7, 1776 by Richard Henry Lee (Virginia delegate to Continental Congress). Stated that the colonies should be independent and sever all political ties with Britain. It was adopted by Congress on July 2, 1776."},{"number":167,"term":"Thomas Jefferson","definition":"He was a delegate from Virginia at the Second Continental Congress and wrote the Declaration of Independence. He later served as the third President of the United States."},{"number":168,"term":"Roger Sherman, Robert Livingston","definition":"The two other guys who were part of the committee (along with John Adams and Thomas Jefferson) tasked with Drafting the Declaration of Independence."},{"number":169,"term":"July 4, 1776 and the Declaration of Independence","definition":"The Declaration of Independence was signed by the Second Continental Congress on July 4. It dissolved the colonies’ ties with Britain, listed grievances against King George III, and declared the colonies to be an independent nation."},{"number":170,"term":"Abigail Adams","definition":"Wife of John Adams. During the Revolutionary War, she wrote letters to her husband describing life on the homefront. She urged her husband to remember America’s women in the new government he was helping to create."},{"number":171,"term":"Mercy Otis Warren","definition":"Political writer and propagandist. Prior to Revolution, she published poems and plays that attacked royal authority and urged colonists to resist British infringements on liberty. Later, opposed ratification of the Constitution because it lacked a Bill of Rights."},{"number":172,"term":"Edmund Burke (1729-1797)","definition":"A conservative British politician who was generally sympathetic to the colonists' grievances, and who felt that Britain's colonial policies were misguided. He also opposed the early feminist movements. He once said, \"A woman is but an animal, and not an animal of the highest order.\""},{"number":173,"term":"Lafayette","definition":"Marquis de Lafayette was a French major general who aided the colonies during the Revolutionary War. He and Baron von Steuben (a Prussian general) were the two major foreign military experts who helped train the colonial armies."},{"number":174,"term":"George Rogers Clark (1752-1818)","definition":"Frontiersman who helped remove the Indians from the Illinois territory in May 1798."},{"number":175,"term":"Benedict Arnold","definition":"He had been a Colonel in the Connecticut militia at the outbreak of the Revolution and soon became a General in the Continental Army. He won key victories for the colonies in the battles in upstate New York in 1777 and was instrumental in General Gates victory over the British at Saratoga. After becoming Commander of Philadelphia in 1778, he went heavily into debt, and in 1780, he was caught plotting to surrender the key Hudson River fortress of West Point to the British in exchange for a commission in the royal army. He is the most famous traitor in American history."},{"number":176,"term":"Robert Morris (1734-1806)","definition":"A delegate to the Second Continental Congress. He agreed that Britain had treated the colonies unfairly, but he did not believe that the colonies should dissolve ties with Britain. He argued against the Declaration of Independence."},{"number":177,"term":"John Paul Jones (1747-1792)","definition":"Revolutionary War naval officer. His ship, the Bonhomme Richard, was sunk in a battle with the British ship Serapis, but he managed to board and gain control of the Serapis."},{"number":178,"term":"Bonhomme Richard and the Serapis","definition":"The Bonhomme Richard was John Paul Jones’ ship, which was named for Benjamin Franklin's pseudonym, Poor Richard. The Serapis was the British ship he captured."},{"number":179,"term":"Conway Cabal","definition":"The name given to the New England delegates in the Continental Congress who tried to wrest control of the Continental Army and the Revolution away from George Washington. Named after Major General Thomas Conway."},{"number":180,"term":"French Alliance of 1778, reasons for it","definition":"The colonies needed help from Europe in their war against Britain. France was Britain’s rival and hoped to weaken Britain by causing her to lose the American colonies. The French were persuaded to support the colonists by news of the American victory at the Battle of Saratoga."},{"number":181,"term":"Major battles: Saratoga, Valley Forge","definition":"In 1777, British General John Burgoyne attacked southward from Canada along the Hudson Valley in New York, hoping to link up with General Howe in New York City, thereby cutting the colonies in half. Burgoyne was defeated by American General Horatio Gates on October 17, 1777, at the Battle of Saratoga, surrendering the entire British Army of the North. Valley Forge was not a battle; it was the site where the Continental Army camped during the winter of 1777-’78, after its defeats at the Battles of the Brandywine and Germantown. The Continental Army suffered further casualties at Valley Forge due to cold and disease. Washington chose the site because it allowed him to defend the Continental Congress if necessary, which was then meeting in York, Pennsylvania after the British capture of Philadelphia."},{"number":182,"term":"Yorktown, Lord Cornwallis","definition":"Because of their lack of success in suppressing the Revolution in the northern colonies, in early 1780 the British switched their strategy and undertook a series of campaigns through the southern colonies. This strategy was equally unsuccessful, and the British decided to return to their main headquarters in New York City. While marching from Virginia to New York, British commander Lord Cornwallis became trapped in Yorktown on the Chesapeake Bay. His troops fortified the town and waited for reinforcements. The French navy, led by DeGrasse, blocked their escape. After a series of battles, Cornwallis surrendered to the Continental Army on October 19, 1781, which ended all major fighting in the Revolutionary War."},{"number":183,"term":"Treaty of Paris, 1783","definition":"This treaty ended the Revolutionary War, recognized the independence of the American colonies, and granted the colonies the territory from the southern border of Canada to the northern border of Florida, and from the Atlantic coast to the Mississippi River."},{"number":184,"term":"Benjamin Franklin, John Adams, John Jay","definition":"They were the American delegates who signed the Treaty of Paris in 1783."},{"number":185,"term":"Social impact of the war","definition":"The Revolutionary War saw the emergence of the first anti-slavery groups, and many of the northern states abolished slavery after the war. Women gained a small status increase for their efforts in the war, but they were primarily valued as mothers of future patriots."},{"number":186,"term":"Disestablishment, Virginia Statute of Religious Freedom","definition":"1779 - Written by Thomas Jefferson, this statute outlawed an established church and called for separation of Church and State."},{"number":187,"term":"New state constitutions (Massachusetts adopted by popular vote)","definition":"The first set of constitutions drafted by the individual states placed most of the government’s power in the legislature, and almost none in the executive in order to promote democracy and avoid tyranny. However, without the strong leadership of the executive, the state legislatures argued among themselves and couldn’t get anything done. After the Constitution was written, the states abandoned these old constitutions and wrote new ones that better balanced the power between the legislative and the executive."},{"number":188,"term":"Newburgh Conspiracy","definition":"The officers of the Continental Army had long gone without pay, and they met in Newburgh, New York to address Congress about their pay. Unfortunately, the American government had little money after the Revolutionary War. They also considered staging a coup and seizing control of the new government, but the plotting ceased when George Washington refused to support the plan."},{"number":189,"term":"Articles of Confederation: powers, weaknesses, successes","definition":"The Articles of Confederation delegated most of the powers (the power to tax, to regulate trade, and to draft troops) to the individual states, but left the federal government power over war, foreign policy, and issuing money. The Articles’ weakness was that they gave the federal government so little power that it couldn’t keep the country united. The Articles’ only major success was that they settled western land claims with the Northwest Ordinance. The Articles were abandoned for the Constitution."},{"number":190,"term":"Constitution","definition":"The document which established the present federal government of the United States and outlined its powers, divided into legislative, executive, and judicial branches. It can be changed through amendments."},{"number":191,"term":"Constitution: Preamble","definition":"\"We the people of the United States, in order to form a more perfect union, establish justice, insure domestic tranquility, provide for the common defense, promote the general welfare, and secure the blessings of liberty to ourselves and our posterity, do ordain and establish this Constitution for the United States of America.\""},{"number":192,"term":"Constitution: Legislature","definition":"One of the three branches of government, the legislature makes laws. There are two parts to the legislature: the House of Representatives and the Senate."},{"number":193,"term":"Constitution: Riders","definition":"Separate, unrelated clauses added to a bill in the legislature, either to ensure that the bill passes or to ensure that it fails."},{"number":194,"term":"Constitution: Quorum","definition":"The minimum number of members of Congress who must be present to hold a session. In Congress, this number is more than half of the members."},{"number":195,"term":"Constitution: Seniority","definition":"Part of the committee system. A member of Congress in a committee moves up in rank in that committee if he is reelected."},{"number":196,"term":"Constitution: Committee system","definition":"After a bill is introduced in Congress, it is assigned to a small group of legislators for review and consideration, and the committee must vote to approve the bill before it is returned to the Senate or the House for a vote."},{"number":197,"term":"Constitution: Majority leader","definition":"The person elected, by the majority party of Congress, to be leader of the majority party in Congress."},{"number":198,"term":"Constitution: Majority whip","definition":"The person who tells members of the majority party in Congress how they should vote."},{"number":199,"term":"Constitution: Minority leader","definition":"The person elected, by the minority party of Congress, to be leader of the minority party in Congress."},{"number":200,"term":"Constitution: Minority whip","definition":"The person who tells members of the minority party in Congress how they should vote."},{"number":201,"term":"Constitution: Gerrymander","definition":"The practice of drawing the boundary lines of Congressional voting districts to give a particular political party an advantage when electing representatives. First used during Eldbridge Gerry’s second term as governor of Massachusetts, the term comes from a combination of Gerry's name and a reference that the shape of the district boundary resembled a salamander."},{"number":202,"term":"Constitution: Bills become law","definition":"In order for a bill to become a law, it must be introduced to committee and be approved. Then it must be voted on by the House of Representatives, and then voted on by the Senate, or vice versa, depending on the branch in which the bill was first introduced. Finally, it must be signed by the President."},{"number":203,"term":"Constitution: House of Representatives","definition":"One of the two parts of Congress, considered the \"lower house.\" Representatives are elected directly by the people, with the number of representatives for each state determined by the state’s population."},{"number":204,"term":"Constitution: Senate","definition":"The other of the two parts of Congress, considered the \"upper house.\" Senators were originally appointed by state legislatures, but now they are elected directly by the people. Each state has two senators."},{"number":205,"term":"Constitution: Executive branch","definition":"One of the three branches of government, the executive enforces laws. It is headed by the president, who has the power to veto legislation passed by Congress."},{"number":206,"term":"Constitution: Judiciary branch","definition":"One of the three branches of government, the judiciary interprets laws. The highest authority in the judiciary is the Supreme Court, which determines the constitutionality of laws."},{"number":207,"term":"Constitution: Interstate relations","definition":"No state is allowed to form a compact with another state or with a foreign power without the consent of Congress."},{"number":208,"term":"Constitution: The amendment process","definition":"An amendment to the Constitution may be proposed if 2/3 of the members of Congress or 2/3 of state legislatures vote for it. The amendment may then be added to the Constitution by a 3/4 vote of state legislatures, or special state conventions elected for that purpose."},{"number":209,"term":"Constitution: Supremacy clause","definition":"Article VI of the Constitution, which declares the Constitution, all federal laws passed pursuant to its provisions, and all federal treaties, to be the \"supreme law of the land,\" which override any state laws or state constitutional provisions to the contrary."},{"number":210,"term":"Constitution: Ratification","definition":"The Constitution had to be ratified (approved) by at least 9 of the 13 original states in order to be put into effect."},{"number":211,"term":"Constitution: Checks and balances","definition":"Each of the three branches of government \"checks\" (ie, blocks) the power of the other two, so no one branch can become too powerful. The president (executive) can veto laws passed by Congress (legislative), and also chooses the judges in the Supreme Court (judiciary). Congress can overturn a presidential veto if 2/3 of the members vote to do so. The Supreme Court can declare laws passed by Congress and the president unconstitutional, and hence invalid."},{"number":212,"term":"Constitution: Separation of power","definition":"The powers of the government are divided between three branches: the executive, the legislative, and the judiciary."},{"number":213,"term":"Maryland, cession of western land claims","definition":"After the Revolutionary War, many states claimed all the western land between their northernmost and southernmost borders, which meant that many strips of land were claimed by more than one state. The Continental Congress was trying to get the states to ratify the Articles of Confederation, but Maryland refused to ratify it until all the states gave their western land claims. Maryland held out, and the western land claims were abandoned."},{"number":214,"term":"New state constitutions during the Revolutionary War and after","definition":"The first set of constitutions drafted by the individual states placed most of the government’s power in the legislature, and almost none in the executive in order to promote democracy and avoid tyranny. However, without the strong leadership of the executive, the state legislatures argued among themselves and could not get anything done. After the Constitution was written, the states abandoned these old constitutions and wrote new ones to change the balance of power between the legislative and the executive."},{"number":215,"term":"Pennsylvania militia routs Congress, 1783","definition":"Unpaid Revolutionary War veterans staged a protest outside Congress’ meeting hall, forcing Congress to move to Princeton, New Jersey."},{"number":216,"term":"Northwest Posts","definition":"British fur-trading posts in the Northwest Territory. Their presence in the U.S. led to continued British-American conflicts."},{"number":217,"term":"Land Ordinance of 1785","definition":"A major success of the Articles of Confederation. Provided for the orderly surveying and distribution of land belonging to the U.S."},{"number":218,"term":"Northwest Ordinance, 1787","definition":"A major success of the Articles of Confederation. Set up the framework of a government for the Northwest territory. The Ordinance provided that the Territory would be divided into 3 to 5 states, outlawed slavery in the Territory, and set 60,000 as the minimum population for statehood."},{"number":219,"term":"Shay’s Rebellion","definition":"Occurred in the winter of 1786-7 under the Articles of Confederation. Poor, indebted landowners in Massachusetts blocked access to courts and prevented the government from arresting or repossessing the property of those in debt. The federal government was too weak to help Boston remove the rebels, a sign that the Articles of Confederation weren’t working effectively."},{"number":220,"term":"Annapolis Convention, 1786","definition":"A precursor to the Constitutional Convention of 1787. A dozen commissioners form New York, New Jersey, Pennsylvania, Delaware, and Virginia met to discuss reform of interstate commerce regulations, to design a U.S. currency standard, and to find a way to repay the federal government’s debts to Revolutionary War veterans. Little was accomplished, except for the delegates to recommend that a further convention be held to discuss changes to the form of the federal government; the idea was endorsed by the Confederation Congress in February, 1878, which called for another convention to be held in May that year in Philadelphia."},{"number":221,"term":"1780's Depression","definition":"Caused by a post-war decrease in production and increase in unemployment, and caused by tough interstate commerce rules which decreased trade."},{"number":222,"term":"Noah Webster (1758-1843)","definition":"Wrote some of the first dictionaries and spellers in the U.S. His books, which became the standard for the U.S., promoted American spellings and pronunciations, rather than British."},{"number":223,"term":"Philadelphia Convention for the Constitution (aka Constitutional Convention)","definition":"Beginning on May 25, 1787, the convention recommended by the Annapolis Convention was held in Philadelphia. All the states except Rhode Island sent delegates, and George Washington served as president of the convention. The convention lasted 16 weeks, and on September 17, 1787, produced the present Constitution of the United States, which was drafted largely by James Madison."},{"number":224,"term":"Montesquieu, The Spirit of Laws","definition":"French enlightenment philosopher who believed that the government’s power should be divided into separate branches, that the government should be close to the people, and that laws should reflect the will of the people."},{"number":225,"term":"John Locke, Second Treatise of Government","definition":"British enlightenment philosopher who wrote that all human beings have a right to life, liberty, and property and that governments exist to protect those rights. He believed that a contract existed between a government and its people, and if the government failed to uphold its end of the contract, the people could rebel and institute a new government."},{"number":226,"term":"Hobbes (1588-1679)","definition":"English philosopher (author of The Leviathan) who believed that people are motivated mainly by greed and fear and need a strong government to keep them under control. He developed the theory that kings are given their position by divine right, and thus should have absolute power."},{"number":227,"term":"James Madison, \"Father of the Constitution\"","definition":"His proposals for an effective government became the Virginia Plan, which was the basis for the Constitution. He was responsible for drafting most of the language of the Constitution."},{"number":228,"term":"The Great Compromise","definition":"At the Constitutional Convention, larger states wanted to follow the Virginia Plan, which based each state’s representation in Congress on state population. Smaller states wanted to follow the New Jersey Plan, which gave every state the same number of representatives. The convention compromised by creating the House and the Senate and using both of the two separate plans as the method for electing members of each."},{"number":229,"term":"Virginia Plan, New Jersey Plan, Connecticut Plan","definition":"The Virginia Plan called for a two-house Congress with each state’s representation based on state population. The New Jersey Plan called for a one-house Congress in which each state had equal representation. The Connecticut Plan called for a two-house Congress in which both types of representation would be applied and is also known as the Compromise Plan."},{"number":230,"term":"North-South Compromises","definition":"The North was given full federal protection of trade and commerce. The South was given permanent relief from export taxes and a guarantee that the importation of slaves would not be halted for at least 20 years, plus the national capitol was placed in the South. Slaves were also deemed to be counted as 3/5 of a person when determining the state population, thus giving the Southern states a greater number of representatives in the House."},{"number":231,"term":"Slavery and the Constitution: slave trade, 3/5 Clause","definition":"The South’s slave trade was guaranteed for at least 20 years after the ratification of the Constitution. Slaves were considered 3/5 of a person when determining the state population."},{"number":232,"term":"Procedures for Amendments","definition":"An amendment to the Constitution may be proposed if 2/3 of Congress or 2/3 of state legislatures vote for it. The amendment may then be added to the Constitution by a 3/4 vote of state legislatures or state conventions."},{"number":233,"term":"Beard Thesis","definition":"Charles Austin Beard wrote in 1913 that the Constitution was written not to ensure a democratic government for the people, but to protect the economic interests of its writers (most of the men at the Constitutional Convention were very rich), and specifically to benefit wealthy financial speculators who had purchased Revolutionary War government bonds through the creation of a strong national government that could insure the bonds repayment."},{"number":234,"term":"Antifederalists","definition":"They opposed the ratification of the Constitution because it gave more power to the federal government and less to the states, and because it did not ensure individual rights. Many wanted to keep the Articles of Confederation. The Antifederalists were instrumental in obtaining passage of the Bill of Rights as a prerequisite to ratification of the Constitution in several states. After the ratification of the Constitution, the Antifederalists regrouped as the Democratic-Republican (or simply Republican) party. They included Patrick Henry and Samuel Adams."},{"number":235,"term":"Federalists","definition":"Their leaders included John Jay, Alexander Hamilton, and James Madison, who wrote the Federalist Papers in support of the Constitution. Favored a strong central government. Drew support from industry, merchant, and monied classes. Concerned about the implications of Shay’s Rebellion. Went on to form the core of the nascent Federalist Party."},{"number":236,"term":"George Mason, Bill of Rights","definition":"He opposed the Constitution because it didn’t protect individual rights. His opposition led to the inclusion of the Bill of Rights."},{"number":237,"term":"The ratification fights in Massachusetts, New York, and Virginia","definition":"Massachusetts farmers opposed the Constitution because they felt it protected trade more than agriculture, but Massachusetts became the 6th state to ratify. New York was opposed to the Constitution; the Federalist Papers were published there to gain support for it. Virginia and New York would not ratify until the Bill of Rights was added to the Constitution."},{"number":238,"term":"The Federalist Papers, Jay, Hamilton, Madison","definition":"This collection of essays by John Jay, Alexander Hamilton, and James Madison, explained the importance of a strong central government. It was published to convince New York to ratify the Constitution."},{"number":239,"term":"\"The Federalist, # 10\"","definition":"This essay from the Federalist Papers proposed setting up a republic to solve the problems of a large democracy (anarchy, rise of factions which disregard public good)."},{"number":240,"term":"Bill of Rights adopted, 1791","definition":"The first ten amendments to the Constitution, which limit government power to interfere with certain individual rights and further define the nature of the relationship between the powers of the federal and state governments."},{"number":241,"term":"President George Washington","definition":"He established many of the presidential traditions, including limiting a president's tenure to two terms. He was against political parties and strove for political balance in government by appointing political adversaries to government positions."},{"number":242,"term":"Vice-president John Adams","definition":"A Federalist, he had little say in Washington’s administration."},{"number":243,"term":"Judiciary Act, 1789","definition":"Established the federal court system, defined jurisdictions, and enabled the presidential appointment (with Senate confirmation) of federal judges and magistrates."},{"number":244,"term":"Sec. of the Treasury Hamilton","definition":"A leading Federalist, he supported industry and strong central government. He created the National Bank and managed to pay off the U.S.’s early debts through tariffs and the excise tax on whiskey."},{"number":245,"term":"Sec. of State Jefferson","definition":"A leading Democratic-Republican, he opposed Hamilton’s ideas. Washington tended to side with Hamilton, so Jefferson resigned."},{"number":246,"term":"Sec. of War Knox","definition":"A Revolutionary War hero, Henry Knox had served as Secretary of War under the Articles of Confederation and stayed on in that capacity as part of Washington’s cabinet."},{"number":247,"term":"Attorney General Randolph","definition":"Edmund Randolph had been General Washington's aide-de-camp at the outbreak of the Revolution and served both as a Virginia delegate to the Continental Congress and as Governor of Virginia from 1786-1788. He submitted the Virginia Plan at the Constitutional Convention. From 1789-1794 he served as U.S. Attorney General, and then succeeded Jefferson as Sec. of State. In 1795 he resigned form office after being falsely accused of receiving money from France to influence Washington’s administration against Great Britain, although his name was eventually cleared by the French government."},{"number":248,"term":"Hamilton’s Program","definition":"Designed to pay off the U.S.’s war debts and stabilize the economy, he believed that the United States should become a leading international commercial power. His programs included the creation of the National Bank, the establishment of the U.S.’s credit rate, increased tariffs, and an excise tax on whiskey. Also, he insisted that the federal government assume debts incurred by the states during the war."},{"number":249,"term":"Tariff of 1789","definition":"Designed to raise revenue for the federal government, resulted in a government surplus."},{"number":250,"term":"Bank of the United States","definition":"Part of Hamilton’s Plan, it would hold the government’s surplus money and serve as a national lending institution."},{"number":251,"term":"National debt, state debt, foreign debt","definition":"The U.S.’s national debt included domestic debt owed to soldiers and others who had not yet been paid for their Revolutionary War services, plus foreign debt to other countries which had helped the U.S. The federal government also assumed all the debts incurred by the states during the war. Hamilton’s program paid off these debts."},{"number":252,"term":"Excise taxes","definition":"Taxes placed on manufactured products. The excise tax on whiskey helped raise revenue for Hamilton’s program."},{"number":253,"term":"Report on Manufactures (1791)","definition":"A document submitted to Congress, which set up an economic policy to encourage industry."},{"number":254,"term":"Implied powers, elastic clause, necessary and proper clause","definition":"Section 8 of Article I contains a long list of powers specifically granted to Congress, and ends with the statement that Congress shall also have the power \"to make all laws which shall be necessary and proper for carrying into execution the foregoing powers.\" These unspecified powers are known as Congress' \"implied\" powers. There has long been a debate as to how much power this clause grants to Congress, which is sometimes referred to as the \"elastic\" clause because it can be \"stretched\" to include almost any other power that Congress might try to assert."},{"number":255,"term":"Loose, strict interpretation of the Constitution","definition":"Loose interpretation allows the government to do anything which the Constitution does not specifically forbid it from doing. Strict interpretation forbids the government from doing anything except what the Constitution specifically empowers it to do."},{"number":256,"term":"Compromise of 1790 (District of Columbia)","definition":"Hamilton’s plan for the federal government to assume the Revolutionary War debts of the states was deadlocked in Congress. Southern states opposed the national government assuming debts which largely derived from Northern states. A compromise was struck; in exchange for passing Hamilton’s debt plan, the norther states would agree to moving the national capital to a location between Maryland and Virginia (to become the District of Columbia). Alexander Hamilton and Thomas Jefferson were in the room where it happened."},{"number":257,"term":"Naturalization Act of 1790","definition":"Set the length of time which immigrants must live in the U.S. in order to become legal citizens. Immigrants must reside in the US for 2 years and be free white persons of good moral character."},{"number":258,"term":"Major L’Enfant, Benjamin Banneker","definition":"Architects of Washington, D.C."},{"number":259,"term":"Whiskey Rebellion","definition":"In 1794, farmers in Pennsylvania rebelled against Hamilton's excise tax on whiskey, and several federal officers were killed in the riots caused by their attempts to serve arrest warrants on the offenders. In October 1794, the army, led by Washington, put down the rebellion. The incident showed that the new government under the Constitution could react swiftly and effectively to such a problem, in contrast to the inability of the government under the Articles of Confederation to deal with Shay’s Rebellion."},{"number":260,"term":"Washington’s Farewell Address","definition":"He warned against the dangers of political parties and foreign alliances."},{"number":261,"term":"Election of 1796: President Adams, Vice-president Jefferson","definition":"The first true election (when Washington ran, there was never any question that he would be elected). Adams was a Federalist and Jefferson was a Democratic-Republican."},{"number":262,"term":"New states: Vermont, Kentucky, Tennessee","definition":"After the western land claims were settled, Vermont, Kentucky, and Tennessee (in that order) were added to the United States under the Constitution."},{"number":263,"term":"Federalists and Democratic-Republicans","definition":"The first two political parties. Many of the Democratic-Republicans had earlier been members of the Antifederalists, which had never organized into a formal political party."},{"number":264,"term":"Federalists / Democratic-Republicans: Party leaders","definition":"The leading Federalists were Alexander Hamilton and John Adams. The leading Democratic-Republicans were Thomas Jefferson and James Madison."},{"number":265,"term":"Federalists / Democratic-Republicans: Programs","definition":"Federalist programs were the National Bank and taxes to support the growth of industry. The Democratic-Republicans opposed these programs, favoring state banks and no direct support for industry."},{"number":266,"term":"Federalists / Democratic-Republicans: Philosophies","definition":"Federalists believed in a strong central government, a strong army, industry, and loose interpretation of the Constitution. Democratic-Republicans believed in a weak central government, state and individual rights, and strict interpretation of the Constitution."},{"number":267,"term":"Federalists / Democratic-Republicans: Foreign Policy","definition":"Federalists supported Britain, while the Democratic-Republicans felt that France was the U.S.’s most important ally."},{"number":268,"term":"Society of the Cincinnati","definition":"A secret society formed by officers of the Continental Army. The group was named for George Washington, whose nickname was Cincinnatus, although Washington himself was not involved in the society."},{"number":269,"term":"Democratic societies","definition":"Clubs which met for discussion, designed to keep alive the philosophies of the American Revolution. They were sometimes called Jacobean clubs because they also supported the French Revolution."},{"number":270,"term":"Alien and Sedition Acts","definition":"These consist of four laws passed by the Federalist Congress and signed by President Adams in 1798: the Naturali
